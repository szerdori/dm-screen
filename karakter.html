<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1013">
<title>Karakterlap</title>
<link rel="icon" href="favicon.ico">
<style>
:root{--bg:#0e1013;--panel:#1a1d23;--panel2:#22262e;--line:#2f3440;--text:#eceae4;--muted:#8e95a1;--accent:#e2a63b;--red:#d9534f;--orange:#e08a2e;--green:#4caf6a;--blue:#4a8fe0;--pc:#4a8fe0;--npc:#4caf6a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 "Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
header h1{margin:0;font:700 22px Georgia,serif;color:var(--accent);flex:1}
header h1 a{color:inherit;text-decoration:none}
header small{color:var(--muted);font-size:12px;text-align:right;overflow-wrap:anywhere}
button,select,input,textarea{font:inherit;color:var(--text)}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button.primary{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:700}
button.small{padding:4px 9px;font-size:14px}
button:disabled{opacity:.5}
input,select,textarea{background:#0b0d10;border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);vertical-align:middle}
textarea{width:100%;resize:vertical}
main{padding:12px 16px 130px;max-width:720px;margin:0 auto}
h2{font:700 15px "Segoe UI",sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:20px 0 8px}
h3{font:700 14px "Segoe UI",sans-serif;color:var(--accent);margin:16px 0 6px}
h3.sub2{color:var(--muted);font-weight:600}
.card{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--pc);border-radius:12px;padding:10px 12px;margin-bottom:10px;color:inherit;text-decoration:none}
.card.npc{border-left-color:var(--npc)}
.card.own{padding:14px}
.go{color:var(--accent);font-weight:700;white-space:nowrap}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;background:#252a33;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:24px;border:2px solid var(--line)}
.own .av{width:72px;height:72px}
.main{flex:1;min-width:0}
.name{font:700 18px Georgia,serif;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:13px}
.stats{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.ac{border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-weight:700}
.bar{flex:1;min-width:120px;height:22px;background:#08090b;border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--green)}
.bar.mid .fill{background:var(--orange)} .bar.low .fill{background:var(--red)}
.bar span{position:relative;display:block;text-align:center;font:700 14px/20px "Segoe UI",sans-serif;text-shadow:0 1px 2px #000}
.st{font-weight:600;font-size:13px;padding:2px 10px;border-radius:12px}
.st.healthy{color:var(--green);border:1px solid var(--green)}
.st.hurt{color:#e8d34a;border:1px solid #e8d34a}
.st.bloodied{color:#fff;background:#8a2a1c}
.st.down{color:#fff;background:#6b2a8a}
.muted{color:var(--muted)} .hint{color:var(--muted);font-size:13px}
.warn{color:var(--orange)}
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:30}
#gate[hidden]{display:none}
#gate>div{max-width:420px;display:flex;flex-direction:column;gap:14px;align-items:center}
#gate b.logo{font-size:44px;color:var(--accent)}
/* karakterlap */
/* a felső sor (vissza + pihenő gombok) görgetéskor is fent marad */
.top{display:flex;align-items:center;gap:6px;margin:-12px 0 8px;padding:8px 0;position:sticky;top:0;z-index:15;background:var(--bg);border-bottom:1px solid var(--line)}
.top button.small{padding:4px 8px;font-size:13px}
.top button.on{background:var(--accent);color:#1a1405;border-color:var(--accent)}
.hdbox{margin:0 0 10px;padding:8px 10px}
.hdbox .row+.row{margin-top:6px}
.top a{color:var(--muted);text-decoration:none}
.hero{display:flex;gap:12px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 6px;text-align:center;flex:1;min-width:56px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;line-height:1.3}
.hero .av{width:44px;height:44px;font-size:18px}
.hero .name{font-size:17px}
.hpline{display:flex;gap:8px;align-items:center;margin-top:8px}
.bar.slim{height:16px;min-width:0}
.bar.slim span{font-size:12px;line-height:14px}
.tmp{color:var(--blue);font-weight:700;font-size:13px;white-space:nowrap}
.box .chip{flex:none}
.chip b{display:block;font-size:18px}
.chip small{color:var(--muted);font-size:11px;text-transform:uppercase}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.hpnum{font:700 34px Georgia,serif}
.hpnum small{font-size:18px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.spread{justify-content:space-between}
.grow{flex:1}
.hprow input{width:90px;font-size:18px;text-align:center}
.pips{display:inline-flex;gap:5px;flex-wrap:wrap}
.pip{width:24px;height:24px;border-radius:50%;border:2px solid var(--accent);background:var(--accent);padding:0;cursor:pointer}
.pip.used{background:transparent}
.pip.fail{border-color:var(--red);background:transparent} .pip.fail.on{background:var(--red)}
.pip.ok{border-color:var(--green);background:transparent} .pip.ok.on{background:var(--green)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin:14px -16px 4px;padding:0 16px;scrollbar-width:none}
nav.tabs button{white-space:nowrap;padding:7px 11px;font-size:14px}
nav.tabs button.on{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:700}
.abils{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.abil{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;cursor:pointer}
.abil small{display:block;color:var(--muted);font-size:11px;letter-spacing:1px}
.abil b{display:block;font-size:24px}
.abil .sc{color:var(--muted);font-size:13px}
.abil .sv{display:block;margin-top:4px;font-size:12px;border-top:1px solid var(--line);padding-top:4px}
.abil .sv.p{color:var(--accent)}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.nm{flex:1;min-width:0;overflow-wrap:anywhere}
.nm small{display:block;color:var(--muted);font-size:12px}
.rb{background:#2a2414;border:1px solid #5a4a20;color:var(--accent);border-radius:8px;padding:5px 10px;font-weight:700;cursor:pointer;white-space:nowrap}
.mark{display:inline-block;width:18px;color:var(--accent);text-align:center}
details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
details>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details>summary::-webkit-details-marker{display:none}
details .tx{white-space:pre-wrap;font-size:14px;margin-top:8px;color:#d6d3cb}
/* minmax(0,…) és width:100%: a mezők ne a saját alapszélességüket kérjék, különben keskeny telefonon kilóg az űrlap */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.form input:not([type=checkbox]),.form select,.form textarea{width:100%;min-width:0}
.form label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.form .w2,.form h3{grid-column:1/-1}
.form .g6{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.form .g9{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.form .rowedit{grid-column:1/-1;display:flex;gap:6px;align-items:end;flex-wrap:wrap}
.form .rowedit input,.form .rowedit select{flex:1 1 70px;min-width:0}
.form label.inl{flex-direction:row;align-items:center;gap:6px}
.sk3{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 10px}
.sk3 label{flex-direction:row !important;align-items:center;justify-content:space-between;gap:6px}
.form .sk3 select{width:auto;flex:none}
#rollbar{position:fixed;left:0;right:0;bottom:0;background:#14171cee;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:20}
#rollbar[hidden]{display:none}
#rollbar>div{max-width:720px;margin:0 auto}
#rollbar .modes{display:flex;gap:4px}
#rollbar .modes button{flex:1;padding:6px 4px;font-size:13px}
#rollbar .modes button.on{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:700}
#lastRoll{display:flex;align-items:baseline;gap:10px;margin-top:6px;min-height:28px}
#lastRoll b{font:700 26px Georgia,serif;color:var(--accent)}
#lastRoll.crit b{color:var(--green)} #lastRoll.fumble b{color:var(--red)}
#lastRoll span{color:var(--muted);font-size:13px;flex:1;overflow-wrap:anywhere}
</style>
</head>
<body>
<header><h1><a href="#">⚔ Karakterlap</a></h1><small id="who"></small></header>
<main id="main"></main>
<div id="rollbar" hidden><div>
  <div class="modes">
    <button data-mode="dis">Hátrány</button><button data-mode="" class="on">Normál</button><button data-mode="adv">Előny</button><button data-mode="crit" title="A következő sebzésdobás kockái duplán">Krit ×2</button>
  </div>
  <div id="lastRoll"><span>Koppints egy értékre a dobáshoz.</span></div>
</div></div>
<div id="gate"><div class="muted">Betöltés…</div></div>
<script src="sheet.js"></script>
<script>
'use strict';
// Játékos app: belépés Google-fiókkal; a saját karakter teljes telefonos lapja (sheets/{id}) és a csapat nyilvános lapjai (characters/{id}).
// A lapot a gazdája (és a DM) írja; minden változás mezőnként megy a felhőbe, a DM Screen élőben látja.
// Minden bejövő adat a Sheet.norm-on megy át, és escape-elve íródik ki: a lapot a játékos írja, és a DM is megnyitja.
const H = window.Sheet;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const {isObj, num, str, mod, sgn} = H;
const safeUrl = v => typeof v === 'string' && /^(https?:\/\/|data:image\/)/i.test(v.trim()) ? v.trim() : '';
const ST = {healthy: 'Sértetlen', hurt: 'Sérült', bloodied: 'Súlyosan sérült', down: 'Eszméletlen'};
const RESET_HU = {short: 'short rest', long: 'long rest', none: 'nem töltődik'};
const PROF_MARK = {2: '◆', 1: '●', 0.5: '½', 0: '○'};
const TABS = [['harc', '⚔ Harc'], ['kep', '🎲 Képességek'], ['var', '✨ Varázslat'], ['fel', '🎒 Felszerelés'], ['adat', '✎ Alapadatok'], ['jegyz', '📝 Jegyzet']];

let me = '', isDM = false, chars = [], sheets = new Map(), sheetErr = '';
let view = {id: null, tab: 'harc'}, rbInfo = null, rbErr = '', rollMode = '', rolls = [];
let hdOpen = false, pendingRender = false, draft = null, openKeys = new Set(), searchQ = {spell: '', item: '', feat: ''}, notesTimer = null;

function normChar(d) {
  d = isObj(d) ? d : {};
  const hp = isObj(d.hp) ? {max: Math.max(1, num(d.hp.max, 1)), cur: Math.max(0, num(d.hp.cur, 0))} : null;
  return {
    id: str(d.id), kind: d.kind === 'npc' ? 'npc' : 'pc', owner: str(d.owner).toLowerCase(), visibility: d.visibility === 'party' ? 'party' : 'dm',
    name: str(d.name) || '(névtelen)', portrait: safeUrl(d.portrait), level: str(d.level),
    ac: d.ac == null ? null : num(d.ac, null), hp, status: hp ? null : ST[d.status] ? d.status : null
  };
}
const avatar = (portrait, name) => portrait ? `<img class="av" src="${esc(portrait)}" alt="">` : `<div class="av">${esc(String(name).charAt(0).toUpperCase())}</div>`;
function hpBar(hp, cls = '') {
  const p = Math.max(0, Math.min(1, hp.cur / hp.max));
  return `<div class="bar ${cls} ${p <= .25 ? 'low' : p <= .5 ? 'mid' : ''}"><div class="fill" style="width:${(p * 100).toFixed(1)}%"></div><span>${esc(hp.cur)} / ${esc(hp.max)} HP</span></div>`;
}
const canEdit = s => isDM || (!!me && s.owner === me);
const okId = id => /^[A-Za-z0-9_-]{1,64}$/.test(id);
function card(c, own) {
  const has = okId(c.id) && sheets.has(c.id), tag = has ? 'a' : 'div';
  return `<${tag} class="card ${c.kind} ${own ? 'own' : ''}" data-char="${esc(c.id)}" ${has ? `href="#lap/${esc(c.id)}"` : ''}>${avatar(c.portrait, c.name)}
    <div class="main"><div class="name">${esc(c.name)}</div>
      <div class="sub">${c.kind === 'npc' ? 'NPC' : 'Játékos'}${c.level ? ' · ' + esc(c.level) : ''}${own && c.visibility === 'dm' ? ' · 🔒 csak te és a DM látjátok' : ''}</div>
      <div class="stats">${c.ac != null ? `<span class="ac" title="Armor Class">🛡 ${esc(c.ac)}</span>` : ''}${c.hp ? hpBar(c.hp) : ''}${c.status ? `<span class="st ${c.status}">${esc(ST[c.status])}</span>` : ''}</div>
      ${own && !has ? '<div class="hint">A telefonos karakterlapodat még nem hozta létre a DM.</div>' : ''}
    </div>${has ? '<span class="go">Lap ›</span>' : ''}</${tag}>`;
}
const fromSheet = (id, s, level) => normChar({id, kind: 'pc', owner: s.owner, visibility: 'party', name: s.name, portrait: s.portrait, level, ac: s.ac, hp: s.hp});
function renderList() {
  const byName = (a, b) => (a.kind === 'pc' ? 0 : 1) - (b.kind === 'pc' ? 0 : 1) || a.name.localeCompare(b.name, 'hu');
  // csak játékos karakterek látszanak, NPC nem (a felhasználó kérése)
  const pcs = chars.filter(c => c.kind === 'pc');
  const own = pcs.filter(c => c.owner && c.owner === me).sort(byName);
  const party = pcs.filter(c => !(c.owner && c.owner === me) && c.visibility === 'party').sort(byName);
  // saját lap, amihez (még) nincs nyilvános rész
  for (const [id, s] of sheets) if (me && s.owner === me && !own.some(c => c.id === id)) own.push({...fromSheet(id, s, 'Szint ' + H.level(s)), visibility: 'dm'});
  const all = isDM ? [...sheets].sort((a, b) => a[1].name.localeCompare(b[1].name, 'hu')) : [];
  $('#main').innerHTML = `
    <h2>Az én karakterem</h2>${own.length ? own.map(c => card(c, true)).join('') : isDM ? '<p class="muted">DM-ként nincs saját karaktered – lent az összes karakterlap.</p>' : '<p class="muted">Még nincs hozzád rendelt karakter. Szólj a DM-nek, hogy állítsa be a Google-fiókodat a karakterednél.</p>'}
    <h2>A csapat</h2>${party.length ? party.map(c => card(c, false)).join('') : '<p class="muted">Most nem látsz senkit a csapatból.</p>'}
    ${isDM ? `<h2>Minden karakterlap (DM)</h2>${all.length ? all.map(([id, s]) => card(fromSheet(id, s, `Szint ${H.level(s)} · ${s.owner || 'nincs gazdája'}`), false)).join('')
      : '<p class="muted">Még nincs telefonos karakterlap. A DM Screen könyvtárában a 📱 gombbal hozhatsz létre.</p>'}` : ''}
    ${sheetErr ? `<p class="warn">⚠ A karakterlapok most nem érhetők el (${esc(sheetErr)}).</p>` : ''}`;
}

// ---------- kocka (kriptográfiai véletlen, elutasításos mintavétellel) ----------
function rnd(d) {
  const lim = Math.floor(0x100000000 / d) * d, a = new Uint32Array(1);
  do crypto.getRandomValues(a); while (a[0] >= lim);
  return (a[0] % d) + 1;
}
function rollExpr(expr, crit = false) {
  let total = 0; const parts = [];
  for (const m of String(expr).replace(/−/g, '-').replace(/\s+/g, '').matchAll(/([+-]?)(?:(\d*)d(\d+)|(\d+))/gi)) {
    const sign = m[1] === '-' ? -1 : 1;
    if (m[3]) {
      const n = Math.min(100, (+m[2] || 1) * (crit ? 2 : 1)), d = Math.max(1, +m[3]), r = [];
      for (let i = 0; i < n; i++) r.push(rnd(d));
      total += sign * r.reduce((a, b) => a + b, 0); parts.push((sign < 0 ? '−' : '') + '[' + r.join(',') + ']');
    } else { total += sign * +m[4]; parts.push((sign < 0 ? '−' : '+') + m[4]); }
  }
  return {total, detail: parts.join(' ')};
}
function showRoll(r) {
  rolls.unshift(r); rolls = rolls.slice(0, 20);
  const el = $('#lastRoll');
  el.className = r.nat === 20 ? 'crit' : r.nat === 1 ? 'fumble' : '';
  el.innerHTML = `<b>${esc(r.total)}</b><span>${esc(r.label)} · ${esc(r.detail)}${r.nat === 20 ? ' · természetes 20!' : r.nat === 1 ? ' · természetes 1' : ''}</span>`;
}
function setMode(m) { rollMode = m; document.querySelectorAll('#rollbar [data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === m)); }
// előny / hátrány / krit: egy dobásra szól, utána visszaáll normálra
function rollD20(bonus, label) {
  const a = rnd(20), b = rnd(20), mode = rollMode === 'adv' || rollMode === 'dis' ? rollMode : '';
  const nat = mode === 'adv' ? Math.max(a, b) : mode === 'dis' ? Math.min(a, b) : a;
  const r = {label, total: nat + bonus, nat, detail: mode ? `[${a}, ${b}] ${mode === 'adv' ? 'előny' : 'hátrány'} ${sgn(bonus)}` : `[${a}] ${sgn(bonus)}`};
  if (mode) setMode('');
  showRoll(r); return r;
}
function rollDamage(expr, label) {
  const crit = rollMode === 'crit', r = rollExpr(expr, crit);
  if (crit) setMode('');
  const out = {label: label + (crit ? ' (krit)' : ''), total: r.total, detail: `${expr}: ${r.detail}`};
  showRoll(out); return out;
}
const rollBtn = (bonus, label, text = sgn(bonus)) => `<button class="rb" data-act="d20" data-bonus="${esc(bonus)}" data-label="${esc(label)}">${esc(text)}</button>`;
const dmgBtn = (expr, label) => `<button class="rb" data-act="dmg" data-expr="${esc(expr)}" data-label="${esc(label)}">${esc(expr)}</button>`;
// sebzés-szövegből a kocka (pl. „1d8+3 slashing” → 1d8+3)
const diceOf = t => (String(t).replace(/−/g, '-').match(/\d*d\d+(?:\s*[+-]\s*\d+(?!\s*d))*/i) || [''])[0].replace(/\s/g, '');

// ---------- szabálykönyv ----------
const RB = () => rbInfo?.rb || null;
const rbSpell = sp => RB() && H.byRef(RB().spells, sp.ref, sp.name);
const rbItem = it => RB() && H.byRef(H.allItems(RB()), it.ref, it.name);
const rbNote = () => RB() ? '' : `<p class="hint">${rbErr ? '⚠ A szabálykönyv nem tölthető be (' + esc(rbErr) + ').'
  : rbInfo === null ? 'Szabálykönyv betöltése…' : 'A szabálykönyvet még nem töltötte fel a DM (DM Screen → Menü → Szabálykönyv), addig csak saját bejegyzést adhatsz hozzá.'}</p>`;
const det = (key, summary, body) => `<details data-key="${esc(key)}" ${openKeys.has(key) ? 'open' : ''}><summary>${summary}</summary>${body}</details>`;

// ---------- a karakterlap ----------
function renderSheet(s) {
  const ed = canEdit(s), L = H.level(s);
  if (!TABS.some(([k]) => k === view.tab)) view.tab = 'harc';
  const body = {harc: tabHarc, kep: tabKep, var: tabVar, fel: tabFel, jegyz: tabJegyz, adat: tabAdat}[view.tab](s, ed);
  // fent csak egy vékony HP-sáv (a HP-t főleg a DM állítja); a kezelés a Harc fül alján van
  $('#main').innerHTML = `
    <div class="top"><a href="#">‹ Vissza</a>${s.updatedAt ? `<span class="hint" title="utoljára mentve">${esc(new Date(s.updatedAt).toLocaleTimeString('hu-HU', {hour: '2-digit', minute: '2-digit'}))}</span>` : ''}<span class="grow"></span>
      ${ed ? `<button class="small" data-act="shortRest" title="Short rest">☕ Short</button><button class="small" data-act="longRest" title="Long rest">🌙 Long</button>
        <button class="small ${hdOpen ? 'on' : ''}" data-act="hdToggle" title="Hit Dice elköltése">🎲 HD</button>` : '<span class="hint">🔒 csak olvasható</span>'}</div>

function readForm() {

  d.abilities = Object.fromEntries(H.ABIL.map(a => [a, v('ab_' + a)]));

  d.skillProf = Object.fromEntries(Object.keys(H.SKILLS).map(k => [k, +v('sk_' + k)]).filter(([, p]) => p));
  d.hp = {...d.hp, max: v('hpMax')};
  d.spellcasting = {...d.spellcasting, ability: v('spAb'), slots: d.spellcasting.slots.map((_, l) => v('slot_' + l)), pact: {...d.spellcasting.pact, max: v('pactMax'), level: v('pactLvl')}};

function patch(p) {
  const id = view.id, s = sheets.get(id);

  const next = H.norm({...s, ...p, owner: s.owner});
  const out = {};
  for (const k of Object.keys(p)) out[k] = next[k];
  next.updatedAt = out.updatedAt = new Date().toISOString(); next.updatedBy = out.updatedBy = me;
  sheets.set(id, next);
  try { window.KDB?.update(id, JSON.parse(JSON.stringify(out))); } catch {}
  // a csapat felé látszó rész (characters/{id}) is frissül: HP, AC, név, szint
  if (['hp', 'ac', 'name', 'classes'].some(k => k in p) && chars.some(c => c.id === id)) {
    const pub = {hp: {cur: next.hp.cur, max: next.hp.max}, ac: next.ac, name: next.name, level: 'Szint ' + H.level(next)};
    try { window.KDB?.pub(id, pub); } catch {}

}

document.addEventListener('click', e => {
  const t = e.target;
  const m = t.closest('#rollbar [data-mode]');
  if (m) { setMode(rollMode === m.dataset.mode ? '' : m.dataset.mode); return; }

  const act = el.dataset.act, s = cur(), i = +el.dataset.i;
  if (el.tagName === 'A' || el.closest('summary')) e.preventDefault();
  if (!s && !['signIn', 'signOut', 'reload'].includes(act)) return;
  switch (act) {
    case 'signIn': window.KAuth?.signIn(); break;
    case 'signOut': window.KAuth?.signOut(); break;
    case 'reload': location.reload(); break;
    case 'd20': rollD20(+el.dataset.bonus || 0, el.dataset.label); break;
    case 'dmg': rollDamage(el.dataset.expr, el.dataset.label); break;
    case 'hpDmg': case 'hpHeal': case 'hpTemp': {
      const n = Math.abs(parseInt($('#hpIn').value));
      if (isNaN(n)) break;
      if (act === 'hpDmg' && n) patch(H.damage(s, n));
      else if (act === 'hpHeal' && n) patch(H.heal(s, n));
      else if (act === 'hpTemp') patch({hp: {...s.hp, temp: n}});
      break;
    }
    case 'ds': { const k = el.dataset.kind; patch({deathSaves: {...s.deathSaves, [k]: pipToggle(s.deathSaves[k], i)}}); break; }
    case 'dsRoll': {
      const r = rollD20(0, 'Halálmentő'), ds = {...s.deathSaves};
      if (r.nat === 20) { patch({hp: {...s.hp, cur: 1}, deathSaves: {ok: 0, fail: 0}}); break; }
      if (r.nat === 1) ds.fail += 2; else if (r.total >= 10) ds.ok++; else ds.fail++;
      patch({deathSaves: ds}); break;
    }
    case 'hd': {
      const die = +el.dataset.die, r = rollExpr('1d' + die), gain = Math.max(0, r.total + mod(s.abilities.con));
      showRoll({label: `Hit Die d${die}`, total: gain, detail: `${r.detail} ${sgn(mod(s.abilities.con))} (CON)`});
      patch({...H.heal(s, gain), hitDiceUsed: {...s.hitDiceUsed, [die]: (s.hitDiceUsed[die] || 0) + 1}}); break;
    }
    case 'hdToggle': hdOpen = !hdOpen; render(true); break;
    case 'shortRest': if (confirm('Short rest: a „short rest” erőforrások és a Pact Magic slotok visszatöltődnek. Mehet?')) patch(H.shortRest(s)); break;
    case 'longRest': if (confirm('Long rest: teljes HP, minden spell slot és erőforrás visszatöltődik, a Hit Dice fele visszajön, exhaustion −1. Mehet?')) patch(H.longRest(s)); break;
    case 'res': patch({resources: s.resources.map((r, k) => k === i ? {...r, used: pipToggle(r.used, +el.dataset.j)} : r)}); break;
    case 'slot': { const l = +el.dataset.l, used = [...s.spellcasting.used]; used[l] = pipToggle(used[l], +el.dataset.j); patch({spellcasting: {...s.spellcasting, used}}); break; }
    case 'pact': patch({spellcasting: {...s.spellcasting, pact: {...s.spellcasting.pact, used: pipToggle(s.spellcasting.pact.used, +el.dataset.j)}}}); break;
    case 'condRm': patch({conditions: s.conditions.filter((_, k) => k !== i)}); break;
    case 'spellRm': if (confirm(`Eltávolítod: ${s.spells[i].name}?`)) patch({spells: s.spells.filter((_, k) => k !== i)}); break;
    case 'spellAdd': {
      const sp = H.byRef(RB().spells, el.dataset.ref); if (!sp) break;
      patch({spells: [...s.spells, {name: sp.n, level: sp.l || 0, prepared: !sp.l, ref: H.refOf(sp)}]}); break;
    }
    case 'spellCustom': { const n = $('#spellNew').value.trim(); if (n) patch({spells: [...s.spells, {name: n, level: +$('#spellNewL').value, prepared: true}]}); break; }
    case 'qty': patch({inventory: s.inventory.map((it, k) => k === i ? {...it, qty: Math.max(0, it.qty + +el.dataset.d)} : it)}); break;
    case 'itemRm': if (confirm(`Eltávolítod: ${s.inventory[i].name}?`)) patch({inventory: s.inventory.filter((_, k) => k !== i)}); break;
    case 'itemAdd': {
      const it = H.byRef(H.allItems(RB()), el.dataset.ref); if (!it) break;
      const ref = H.refOf(it), k = s.inventory.findIndex(x => x.ref === ref);

    case 'featCustom': { const n = $('#featNew').value.trim(); if (n) patch({features: [...s.features, {name: n, text: $('#featNewT').value, src: $('#featNewS').value}]}); break; }
    case 'featRm': if (confirm(`Eltávolítod: ${s.features[i].name}?`)) patch({features: s.features.filter((_, k) => k !== i)}); break;
    case 'rowAdd': { const d = readForm(); d[el.dataset.list].push({name: '', subclass: '', level: 1, hitDie: 8, hit: '', dmg: '', note: '', max: 1, used: 0, reset: 'long'}); render(true); break; }
    case 'rowRm': { const d = readForm(); d[el.dataset.list].splice(i, 1); render(true); break; }
    case 'slotsAuto': { const d = readForm(), sl = H.slotsFor(H.norm(d).classes); d.spellcasting = {...d.spellcasting, slots: sl.slots, pact: {...d.spellcasting.pact, ...sl.pact}}; render(true); break; }
    case 'edSave': {
      const d = H.norm(readForm()), p = {};
      for (const k of EDIT_KEYS) p[k] = d[k];
      p.hp = {...s.hp, max: d.hp.max};

    }

  }
});
document.addEventListener('toggle', e => { const k = e.target.dataset?.key; if (k) e.target.open ? openKeys.add(k) : openKeys.delete(k); }, true);
document.addEventListener('change', e => {
  const t = e.target, s = cur(); if (!s) return;

document.addEventListener('keydown', e => {

<script src="firebase-config.js"></script>
<script type="module">
const V = '10.12.2';
const cfg = window.FIREBASE_CONFIG;

} else {

        try { await A.signInWithPopup(auth, provider); }

    // írás mezőnként: a lap (sheets) és a csapat felé látszó rész (characters); internet nélkül a Firestore később tölti fel
    window.KDB = {
      update: (id, p) => F.updateDoc(F.doc(fs, 'sheets/' + id), p).catch(e => console.warn('a lap mentése nem sikerült:', e.code)),

    let unsub = [];

      unsub.forEach(f => f()); unsub = [];
      if (!u) { window.KApp.setAuth({status: 'signedOut'}); return; }
      const email = (u.email || '').toLowerCase();
      // DM-e: az access/dms dokumentumot csak a DM olvashatja
      let dm = false;
      try { dm = (await F.getDoc(F.doc(fs, 'access/dms'))).exists(); } catch {}
      window.KApp.setAuth({status: 'signedIn', email, dm});
      // két élő lekérdezés a nyilvános részekre: a saját és a csapat által látható lapok (a szabályok csak így engedik)
      const parts = {own: new Map(), party: new Map()};

      const push = () => window.KApp.setChars([...new Map([...parts.party, ...parts.own]).values()]);

      for (const [key, q] of [['own', F.query(col, F.where('owner', '==', email))], ['party', F.query(col, F.where('visibility', '==', 'party'))]]) {
        unsub.push(F.onSnapshot(q, snap => {
          parts[key] = new Map(snap.docs.map(d => [d.id, {...d.data(), id: d.id}]));
          push();
        }, e => {
          if (e.code === 'permission-denied') { if (++denied === 2 && !dm) window.KApp.setAuth({status: 'denied', email}); }
          else window.KApp.setAuth({status: 'error', message: e.code || e.message});
        }));
      }
      // a teljes karakterlap: a játékosnak a sajátja, a DM-nek mind
      const sq = dm ? F.collection(fs, 'sheets') : F.query(F.collection(fs, 'sheets'), F.where('owner', '==', email));
      unsub.push(F.onSnapshot(sq, snap => window.KApp.setSheets(snap.docs.map(d => ({...d.data(), id: d.id}))),
        e => window.KApp.setSheets([], e.code === 'permission-denied' ? 'a DM-nek frissítenie kell a jogosultsági szabályokat' : e.code || e.message)));
      // szabálykönyv: a telefonon tárolt példány, ha a felhőben nincs újabb
      window.Sheet.loadRulebook(rulesDb, window.Sheet.idb).then(r => window.KApp.setRulebook(r), e => window.KApp.setRulebook(null, e.code || e.message));
    });
  } catch (e) {
    window.KApp.setAuth({status: 'error', message: 'nincs internet'});
  }
}
</script>
