<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1013">
<title>Karakterlap</title>
<link rel="icon" href="favicon.ico">
<style>
/* a nagy betű betűtípusa a tárolóból (betutipus/, SIL OFL 1.1; docs/dontesek/0007): a böngésző csak akkor tölti le, ha használja, vagyis nagy betűnél */
@font-face{font-family:"Atkinson Hyperlegible Next";font-style:normal;font-weight:400 800;font-display:swap;src:url(betutipus/atkinson-hyperlegible-next-latin-ext.woff2) format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Atkinson Hyperlegible Next";font-style:normal;font-weight:400 800;font-display:swap;src:url(betutipus/atkinson-hyperlegible-next-latin.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--bg:#0e1013;--panel:#1a1d23;--panel2:#22262e;--line:#2f3440;--text:#eceae4;--muted:#8e95a1;--accent:#e2a63b;--red:#d9534f;--orange:#e08a2e;--green:#4caf6a;--blue:#4a8fe0;--pc:#4a8fe0;--npc:#4caf6a;
  --on-accent:#1a1405;--on-red:#fff;--on-green:#08130b;--on-st:#fff;--backdrop:rgba(0,0,0,.6);--field:#0b0d10;--av-bg:#252a33;--bar-bg:#08090b;--bar-shadow:#000;--hurt:#e8d34a;--bloodied:#8a2a1c;--down:#6b2a8a;--conc-bg:rgba(80,140,255,.12);--rb-bg:#2a2414;--rb-line:#5a4a20;--text2:#d6d3cb;--rollbar-bg:#14171cee;--shadow:#0008;--bar-ok:var(--green);--bar-mid:var(--orange);--bar-low:var(--red)}
/* világos téma (Fiók → Megjelenítés → Világos): csak a színváltozókat írja át; szövegként minden szín legalább 4,5:1 a háttéren */
:root[data-tema="vilagos"]{--bg:#f4f1ea;--panel:#fff;--panel2:#ece8df;--line:#c9c1b1;--text:#1d1b17;--muted:#5f5a50;--accent:#8a5a00;--red:#b3261e;--orange:#a14f00;--green:#2e7d32;--blue:#1f5fbf;--pc:#1f5fbf;--npc:#2e7d32;
  --on-accent:#fff;--on-red:#fff;--on-green:#fff;--on-st:#fff;--backdrop:rgba(0,0,0,.4);--field:#fff;--av-bg:#e6e1d6;--bar-bg:#fbfaf7;--bar-shadow:rgba(255,255,255,.7);--hurt:#7a6000;--bloodied:#a33a26;--down:#6b2a8a;--conc-bg:rgba(31,95,191,.1);--rb-bg:#fbf1dc;--rb-line:#d9b56a;--text2:#3a362f;--rollbar-bg:#f4f1eaee;--shadow:#0003;--bar-ok:#5cb85c;--bar-mid:#e9a23b;--bar-low:#e8776d;color-scheme:light}
/* kontrasztos sötét (Nagy / Extra nagy betű, sötét mód): szövegként minden szín legalább 7:1 a háttéren */
:root[data-meret]{--bg:#050607;--panel:#14161a;--panel2:#1d2026;--line:#6b7280;--text:#f5f3ee;--muted:#c9ced6;--accent:#ffbf47;--red:#ff8f89;--orange:#ffa04a;--green:#62d67e;--blue:#7fb2ff;--pc:#7fb2ff;--npc:#62d67e;
  --on-accent:#1a1405;--on-red:#000;--on-green:#08130b;--on-st:#fff;--backdrop:rgba(0,0,0,.75);--field:#000;--av-bg:#2a2e36;--bar-bg:#000;--bar-shadow:#000;--hurt:#ffe066;--bloodied:#a32f1f;--down:#6b2a8a;--conc-bg:rgba(127,178,255,.14);--rb-bg:#2e2512;--rb-line:#b08a35;--text2:#ece9e1;--rollbar-bg:#0b0c0e;--shadow:#000a;--bar-ok:#145526;--bar-mid:#7a4508;--bar-low:#8f2418}
/* kontrasztos világos (Nagy / Extra nagy betű, világos mód): szövegként minden szín legalább 7:1 a háttéren */
:root[data-meret][data-tema="vilagos"]{--bg:#fff;--panel:#fff;--panel2:#efebe3;--line:#6b6458;--text:#000;--muted:#3d3930;--accent:#6b4400;--red:#8f1a12;--orange:#743700;--green:#1a5220;--blue:#174a96;--pc:#174a96;--npc:#1a5220;
  --on-accent:#fff;--on-red:#fff;--on-green:#fff;--on-st:#fff;--backdrop:rgba(0,0,0,.5);--field:#fff;--av-bg:#e6e1d6;--bar-bg:#fff;--bar-shadow:rgba(255,255,255,.8);--hurt:#5e4a00;--bloodied:#8a2a1c;--down:#6b2a8a;--conc-bg:rgba(23,74,150,.08);--rb-bg:#fbf1dc;--rb-line:#8a5a00;--text2:#1d1b17;--rollbar-bg:#fff;--shadow:#0004;--bar-ok:#5cb85c;--bar-mid:#e9a23b;--bar-low:#e8776d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 "Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
header h1{margin:0;font:700 22px Georgia,serif;color:var(--accent);flex:1}
header h1 a{color:inherit;text-decoration:none}
header small{color:var(--muted);font-size:12px;text-align:right;overflow-wrap:anywhere}
button,select,input,textarea{font:inherit;color:var(--text)}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.ibtn{width:26px;height:26px;min-width:26px;padding:0;border-radius:50%;font:italic 700 13px Georgia,serif;line-height:1;margin-left:4px;flex:none;vertical-align:middle}
#infoPop,#keresPop{position:fixed;inset:0;background:var(--backdrop);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
#keresPop{z-index:60}
#keresPop .ibox{text-align:center} #keresPop .kerdob{font-size:1.5em;margin:10px 0} #keresPop .row{justify-content:center;gap:10px}
#infoPop[hidden],#keresPop[hidden]{display:none}
#infoPop .ibox,#keresPop .ibox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;max-width:440px;width:100%;max-height:85vh;overflow:auto}
#infoPop h3{margin:0 0 8px}
#infoPop ol{margin:6px 0;padding-left:20px}
#infoPop .hol{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:3px 8px;margin-bottom:6px;font-size:13px}
#infoPop .hol.dm,#infoPop .hol.vegyes{border-color:var(--orange);color:var(--orange)}
#infoPop .hol.homebrew{border-color:var(--blue);color:var(--blue)}
#infoPop .hol.app{border-color:var(--green);color:var(--green)}
button.danger{background:var(--red);color:var(--on-red);border-color:var(--red);font-weight:700}
.lapdel{margin:18px 0 6px}
.ncbody>label{display:block;margin-bottom:10px} .ncbody>label input,.ncbody>label select{width:100%;box-sizing:border-box;margin-top:3px}
button.small{padding:4px 9px;font-size:14px}
button:disabled{opacity:.5}
input,select,textarea{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);vertical-align:middle}
textarea{width:100%;resize:vertical}
main{padding:12px 16px 130px;max-width:720px;margin:0 auto}
h2{font:700 15px "Segoe UI",sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:20px 0 8px}
h3{font:700 14px "Segoe UI",sans-serif;color:var(--accent);margin:16px 0 6px}
h3.sub2{color:var(--muted);font-weight:600}
.card{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--pc);border-radius:12px;padding:10px 12px;margin-bottom:10px;color:inherit;text-decoration:none}
.card.npc{border-left-color:var(--npc)}
.card.own{padding:14px}
.go{color:var(--accent);font-weight:700;white-space:nowrap}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;background:var(--av-bg);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:24px;border:2px solid var(--line)}
.own .av{width:72px;height:72px}
.main{flex:1;min-width:0}
.name{font:700 18px Georgia,serif;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.stats{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.ac{border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-weight:700}
.bar{flex:1;min-width:120px;height:22px;background:var(--bar-bg);border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--bar-ok)}
.bar.mid .fill{background:var(--bar-mid)} .bar.low .fill{background:var(--bar-low)}
.bar span{position:relative;display:block;text-align:center;font:700 14px/20px "Segoe UI",sans-serif;text-shadow:0 1px 2px var(--bar-shadow)}
.st{font-weight:600;font-size:13px;padding:2px 10px;border-radius:12px}
.st.healthy{color:var(--green);border:1px solid var(--green)}
.st.hurt{color:var(--hurt);border:1px solid var(--hurt)}
.st.bloodied{color:var(--on-st);background:var(--bloodied)}
.st.down{color:var(--on-st);background:var(--down)}
.muted{color:var(--muted)} .hint{color:var(--muted);font-size:13px}
.warn{color:var(--orange)}
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:30}
#gate[hidden]{display:none}
#gate>div{max-width:420px;display:flex;flex-direction:column;gap:14px;align-items:center}
#gate b.logo{font-size:44px;color:var(--accent)}
/* karakterlap */
/* a felső sor (vissza + pihenő gombok) görgetéskor is fent marad */
.top{display:flex;align-items:center;gap:6px;margin:-12px 0 8px;padding:8px 0;position:sticky;top:0;z-index:15;background:var(--bg);border-bottom:1px solid var(--line)}
.top button.small{padding:4px 8px;font-size:13px}
.top button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.hdbox{margin:0 0 10px;padding:8px 10px}
.hdbox .row+.row{margin-top:6px}
.concbar{display:flex;align-items:center;gap:8px;margin:6px 0;padding:6px 10px;border:2px solid var(--blue);border-radius:10px;background:var(--conc-bg);font-size:14px}
.fxbar{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.fxchip{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--green);color:var(--green)}
.fxchip.neg{border-color:var(--red);color:var(--red)} .fxchip.off{opacity:.5;text-decoration:line-through}
.chip.fx{border-color:var(--green)}
button.cast.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.castpick{gap:6px;padding:6px 0 10px}
.top a{color:var(--muted);text-decoration:none}
.hero{display:flex;gap:12px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 6px;text-align:center;flex:1;min-width:56px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;line-height:1.3}
.hero .av{width:44px;height:44px;font-size:18px}
.hero .name{font-size:17px}
.hero .main{flex:1;min-width:0}
.hero .chip.ac{flex:none;margin-left:auto;min-width:52px}
.hpline{display:flex;gap:8px;align-items:center;margin-top:8px}
.bar.slim{height:16px;min-width:0}
.bar.slim span{font-size:12px;line-height:14px}
.tmp{color:var(--blue);font-weight:700;font-size:13px;white-space:nowrap}
.box .chip{flex:none}
.chip b{display:block;font-size:18px}
.chip small{color:var(--muted);font-size:11px;text-transform:uppercase}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.hpnum{font:700 34px Georgia,serif}
.hpnum small{font-size:18px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.spread{justify-content:space-between}
.grow{flex:1}
.hprow input{width:90px;font-size:18px;text-align:center}
.pips{display:inline-flex;gap:5px;flex-wrap:wrap}
.pip{width:24px;height:24px;border-radius:50%;border:2px solid var(--accent);background:var(--accent);padding:0;cursor:pointer}
.pip.used{background:transparent}
.pip.fail{border-color:var(--red);background:transparent} .pip.fail.on{background:var(--red)}
.pip.ok{border-color:var(--green);background:transparent} .pip.ok.on{background:var(--green)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin:14px -16px 4px;padding:0 16px;scrollbar-width:none}
nav.tabs button{white-space:nowrap;padding:7px 11px;font-size:14px}
nav.tabs button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.abils{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.abil{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;cursor:pointer}
.abil small{display:block;color:var(--muted);font-size:11px;letter-spacing:1px}
.abil b{display:block;font-size:24px}
.abil .sc{color:var(--muted);font-size:13px}
.abil .sv{display:block;margin-top:4px;font-size:12px;border-top:1px solid var(--line);padding-top:4px}
.abil .sv.p{color:var(--accent)}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.drag{touch-action:none;cursor:grab;user-select:none;color:var(--muted);font-size:1.3em;padding:4px 6px;margin:-4px 0 -4px -4px}
.li.dragging{opacity:.7;border-color:var(--accent)}
.nm{flex:1;min-width:0;overflow-wrap:anywhere}
.nm small{display:block;color:var(--muted);font-size:12px}
.rb{background:var(--rb-bg);border:1px solid var(--rb-line);color:var(--accent);border-radius:8px;padding:5px 10px;font-weight:700;cursor:pointer;white-space:nowrap}
.mark{display:inline-block;width:18px;color:var(--accent);text-align:center}
details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
details>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details>summary::-webkit-details-marker{display:none}
details .tx{white-space:pre-wrap;font-size:14px;margin-top:8px;color:var(--text2)}
/* minmax(0,…) és width:100%: a mezők ne a saját alapszélességüket kérjék, különben keskeny telefonon kilóg az űrlap */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.form input:not([type=checkbox]),.form select,.form textarea{width:100%;min-width:0}
.form label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.form .w2,.form h3{grid-column:1/-1}
.form .g6,.ncbody .g6{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.form .g9{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.form .rowedit{grid-column:1/-1;display:flex;gap:6px;align-items:end;flex-wrap:wrap}
.form .rowedit input,.form .rowedit select{flex:1 1 70px;min-width:0}
.form label.inl{flex-direction:row;align-items:center;gap:6px}
.sk3{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 10px}
.sk3 label{flex-direction:row !important;align-items:center;justify-content:space-between;gap:6px}
.form .sk3 select{width:auto;flex:none}
#rollbar{position:fixed;left:0;right:0;bottom:0;background:var(--rollbar-bg);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:20}
#rollbar[hidden]{display:none}
#rollbar>div{max-width:720px;margin:0 auto}
#rollbar .modes{display:flex;gap:4px}
#rollbar .modes button{flex:1;padding:6px 4px;font-size:13px}
#rollbar .modes button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
#lastRoll{display:flex;align-items:baseline;gap:10px;margin-top:6px;min-height:28px}
#lastRoll b{font:700 26px Georgia,serif;color:var(--accent)}
#lastRoll.crit b{color:var(--green)} #lastRoll.fumble b{color:var(--red)}
#lastRoll span{color:var(--muted);font-size:13px;flex:1;overflow-wrap:anywhere}
/* rövid visszajelzés (pl. mentés után), magától eltűnik */
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:40;background:var(--green);color:var(--on-green);font-weight:700;padding:8px 16px;border-radius:999px;box-shadow:0 4px 14px var(--shadow);max-width:calc(100% - 32px);text-align:center}
#toast.info{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
#toast[hidden]{display:none}
/* szabálymotoros lap: teendők, választási helyek, számolt értékek */
.todobar{display:block;width:100%;margin:6px 0;text-align:left;border-color:var(--orange);color:var(--orange);font-weight:700}
.chbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.chbox.need{border-color:var(--orange)}
.chhead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.chbox select,.chbox input:not([type=checkbox]){width:100%;margin-top:4px}
.chopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:4px 10px}
.chopts label{display:flex;align-items:center;gap:6px;font-size:14px}
.chopts label[hidden]{display:none}
.lubar{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--accent);border-radius:8px;padding:8px 10px;margin:8px 0}
button[data-act^="lu"].on,button[data-act="ncMethod"].on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.lusteps{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 12px}
.lusteps span{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--panel);color:var(--muted)}
.lusteps span.on{background:var(--accent);color:var(--on-accent);font-weight:700}
.lunav{margin:16px 0;position:sticky;bottom:0;background:var(--bg);padding:8px 0}
.lutab{width:100%;border-collapse:collapse;table-layout:fixed}
.lutab td{padding:4px 6px;border-bottom:1px solid var(--line);overflow-wrap:break-word}
.lutab td:first-child{width:38%}
.lutab td:last-child{text-align:right}
.okk{color:var(--green);font-weight:700}
.parts{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--text2)}
.lvrow{display:flex;gap:8px;align-items:center}
.lvrow input{width:90px}
/* Fiók menü: megjelenítés (betűméret, sötét / világos) és kilépés */
#infoPop .fiok h4{margin:14px 0 6px;font-size:14px;font-weight:600;color:var(--muted)}
.megj{display:flex;gap:6px}
.megj button{flex:1;min-width:0;padding:8px 4px}
.megj button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.megj [data-v="nagy"]{font-size:19px} .megj [data-v="extra"]{font-size:22px;line-height:1.1}
.fiokalj{margin-top:18px}
/* ---------- nagy betű (Fiók → Megjelenítés → Betűméret: Nagy / Extra nagy) ----------
   minden szabály a :root[data-meret] alatt van: normál betűnél egyik sem érvényes. A méret egy szorzóból (--meret) jön,
   a legkisebb szöveg --betu-min; az alábbi sorok a fenti szabályok betűméretét írják át ugyanazzal a szelektorral. */
:root[data-meret="nagy"]{--meret:1.3;--betu-min:18px}
:root[data-meret="extra"]{--meret:1.55;--betu-min:21px}
:root[data-meret]{--betu:"Atkinson Hyperlegible Next","Atkinson Hyperlegible","Segoe UI",Roboto,sans-serif}
:root[data-meret] body{font-family:var(--betu);font-size:calc(16px * var(--meret));line-height:1.45;font-weight:500}
:root[data-meret] header h1{font-size:max(var(--betu-min),calc(22px * var(--meret)));font-family:var(--betu)}
:root[data-meret] header small{font-size:max(var(--betu-min),calc(12px * var(--meret)))}
:root[data-meret] #infoPop .hol{font-size:max(var(--betu-min),calc(13px * var(--meret)))}

<script id="megjIndito">
// megjelenítés (betűméret, sötét / világos) még az első rajzolás előtt, hogy ne villanjon fel a normál nézet;

(() => {
  const d = document.documentElement;
  try {
    const m = localStorage.getItem('dmscreen-betumeret'), t = localStorage.getItem('dmscreen-tema');
    if (m === 'nagy' || m === 'extra') d.dataset.meret = m;

  } catch {}
  document.querySelector('meta[name="theme-color"]').content = getComputedStyle(d).getPropertyValue('--bg').trim() || '#0e1013';
})();
</script>

<script>
'use strict';
// Játékos app: belépés Google-fiókkal; a saját karakter teljes telefonos lapja (sheets/{id}) és a csapat nyilvános lapjai (characters/{id}).
// A lapot a gazdája (és a DM) írja; minden változás mezőnként megy a felhőbe, a DM Screen élőben látja.
// Minden bejövő adat a Sheet.norm-on megy át, és escape-elve íródik ki: a lapot a játékos írja, és a DM is megnyitja.
// a közös fájlok várt változata (= a <script src> ?v= száma); eltérésnél (a böngésző régi, gyorsítótárazott példánya) a lap nem írható
const VART_MODULOK = {kozos: 3, sheet: 20, szerzodes: 6, 'lap-alap': 1, 'lap-dobas': 1, 'lap-rajz': 1, 'lap-felepites': 1, 'lap-szintlepes': 1, 'lap-ujkarakter': 1, 'lap-elozmenyek': 1, 'lap-fiok': 1, 'lap-iras': 1, 'lap-utvonal': 1, 'lap-gesztus': 1, 'lap-akciok': 1, 'lap-indulas': 1};
</script>

<script src="js/lap/lap-dobas.js?v=1"></script>
<script src="js/lap/lap-rajz.js?v=1"></script>
<script src="js/lap/lap-felepites.js?v=1"></script>
<script src="js/lap/lap-szintlepes.js?v=1"></script>

<script src="js/lap/lap-utvonal.js?v=1"></script>
<script src="js/lap/lap-gesztus.js?v=1"></script>
<script src="js/lap/lap-akciok.js?v=1"></script>
<script src="js/lap/lap-indulas.js?v=1"></script>
<script src="firebase-config.js"></script>
<script type="module">
const V = '10.12.2';
const cfg = window.FIREBASE_CONFIG;
// ha egy js/lap/ fájl nem töltődött le (rossz hálózat), a lap nem indulhat: üzenet a „Betöltés…” helyett
if (!window.KApp) {
  document.getElementById('gate').innerHTML = '<div>A lap nem töltődött be teljesen.<br><button onclick="location.reload()">Újra</button></div>';
// ?test = automata tesztek: a felhőhöz nem nyúl
} else if (!cfg || !cfg.apiKey || location.protocol === 'file:' || new URLSearchParams(location.search).has('test')) {
  window.KApp.setAuth({status: 'unconfigured'});
} else {
  try {
    const {initializeApp} = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const A = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
    const F = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
    const app = initializeApp(cfg);
    const auth = A.getAuth(app);
    const fs = F.initializeFirestore(app, {localCache: F.persistentLocalCache({tabManager: F.persistentMultipleTabManager()})});
    const UT = window.Szerzodes.UT;  // a felhős útvonalak (szerzodes.js)
    const provider = new A.GoogleAuthProvider();
    provider.setCustomParameters({prompt: 'select_account'});
    window.KAuth = {
      async signIn() {
        try { await A.signInWithPopup(auth, provider); }
        catch (e) {
          if (e.code === 'auth/popup-blocked') return A.signInWithRedirect(auth, provider);
          if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request')
            window.KApp.setAuth({status: 'signedOut', error: 'A belépés nem sikerült (' + e.code + ').'});
        }
      },
      signOut: () => A.signOut(auth),
    };
    // írás mezőnként: a lap (sheets) és a csapat felé látszó rész (characters); internet nélkül a Firestore később tölti fel
    window.KDB = {
      update: (id, p) => F.updateDoc(F.doc(fs, UT.lap(id)), p).catch(e => console.warn('a lap mentése nem sikerült:', e.code)),
      pub: (id, p) => F.updateDoc(F.doc(fs, UT.karakter(id)), p).catch(() => {}),
      // szintlépés, visszaállítás: a pillanatkép és a lap egy írásban (vagy mindkettő sikerül, vagy egyik sem)
      saveWithHist: async (id, p, h, doc) => {
        const b = F.writeBatch(fs);
        b.set(F.doc(fs, UT.elozmeny(id, h)), doc);
        b.update(F.doc(fs, UT.lap(id)), p);
        await b.commit();
      },
      // karakter törlése: a lap és a nyilvános rész egy írásban
      softDelete: async (id, p, pub) => {
        const b = F.writeBatch(fs);
        b.update(F.doc(fs, UT.lap(id)), p);
        if (pub) b.update(F.doc(fs, UT.karakter(id)), pub);
        await b.commit();
      },
      histList: async id => (await F.getDocs(F.collection(fs, UT.elozmenyek(id)))).docs.map(d => ({...d.data(), id: d.id})),
    };
    const rulesDb = {get: async p => { const s = await F.getDoc(F.doc(fs, p)); return s.exists() ? s.data() : null; }};
    let unsub = [];
    A.onAuthStateChanged(auth, async u => {
      unsub.forEach(f => f()); unsub = [];
      if (!u) { window.KApp.setAuth({status: 'signedOut'}); return; }
      const email = (u.email || '').toLowerCase();
      // DM-e: az access/dms dokumentumot csak a DM olvashatja
      let dm = false;
      try { dm = (await F.getDoc(F.doc(fs, UT.dmek))).exists(); } catch {}
      window.KApp.setAuth({status: 'signedIn', email, dm});
      // két élő lekérdezés a nyilvános részekre: a saját és a csapat által látható lapok (a szabályok csak így engedik)
      const parts = {own: new Map(), party: new Map()};
      let denied = 0;
      const push = () => window.KApp.setChars([...new Map([...parts.party, ...parts.own]).values()]);
      const col = F.collection(fs, UT.karakterek);
      for (const [key, q] of [['own', F.query(col, F.where('owner', '==', email))], ['party', F.query(col, F.where('visibility', '==', 'party'))]]) {
        unsub.push(F.onSnapshot(q, snap => {
          parts[key] = new Map(snap.docs.map(d => [d.id, {...d.data(), id: d.id}]));
          push();
        }, e => {
          if (e.code === 'permission-denied') { if (++denied === 2 && !dm) window.KApp.setAuth({status: 'denied', email}); }
          else window.KApp.setAuth({status: 'error', message: e.code || e.message});
        }));
      }
      // a teljes karakterlap: a játékosnak a sajátja, a DM-nek mind
      const sq = dm ? F.collection(fs, UT.lapok) : F.query(F.collection(fs, UT.lapok), F.where('owner', '==', email));
      unsub.push(F.onSnapshot(sq, snap => window.KApp.setSheets(snap.docs.map(d => ({...d.data(), id: d.id}))),
        e => window.KApp.setSheets([], e.code === 'permission-denied' ? 'a DM-nek frissítenie kell a jogosultsági szabályokat' : e.code || e.message)));
      // szabálykönyv: a telefonon tárolt példány, ha a felhőben nincs újabb
      window.Sheet.loadRulebook(rulesDb, window.Sheet.idb).then(r => window.KApp.setRulebook(r), e => window.KApp.setRulebook(null, e.code || e.message));
    });
  } catch (e) {
    window.KApp.setAuth({status: 'error', message: 'nincs internet'});
  }
}
</script>
