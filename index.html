<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DM Screen</title>
<link rel="icon" href="favicon.ico">
<style>
:root{
  --bg:#121418; --panel:#1b1e24; --panel2:#232730; --line:#323744; --text:#e7e7e9; --muted:#9097a3;
  --accent:#e2a63b; --red:#d9534f; --orange:#e08a2e; --green:#4caf6a; --blue:#4a8fe0;
  --pc:#4a8fe0; --npc:#4caf6a; --mon:#c9483f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 "Segoe UI",system-ui,sans-serif}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:600}
button.small{padding:2px 7px;font-size:12px}
button.on{background:var(--accent);color:#1a1405}
input,select,textarea{font:inherit;color:var(--text);background:#0f1115;border:1px solid var(--line);border-radius:5px;padding:4px 6px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{width:100%;resize:vertical}
input[type=number]{width:64px}
.muted{color:var(--muted)} .pad{padding:14px}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);height:52px}
.brand{font-weight:700;color:var(--accent);font-size:16px;margin-right:6px}
.round{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
.round b{color:var(--accent);font-size:16px}
.grow{flex:1} .sep{width:1px;height:26px;background:var(--line);margin:0 4px}
#saveState{color:var(--muted);font-size:12px}
main{display:flex;height:calc(100% - 52px)}
#board{flex:1;overflow:auto;padding:12px}
#tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;align-items:start}
#side{width:440px;min-width:360px;border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
#detail{flex:1;overflow:auto}
#dice{border-top:1px solid var(--line);height:260px;display:flex;flex-direction:column}
.dicebar{display:flex;gap:4px;padding:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.dicebar input{width:110px}
#log{flex:1;overflow:auto;padding:4px 8px;font-size:13px}
.le{padding:3px 0;border-bottom:1px solid #20242b}
.le .who{color:var(--muted)} .le b{font-size:15px}
.le.crit b{color:var(--green)} .le.fumble b{color:var(--red)}
.le.turn{color:var(--accent);font-weight:600} .le.warn{color:var(--orange)} .le.round{color:var(--accent);text-align:center;font-weight:700}
.empty{grid-column:1/-1;text-align:center;padding:60px;color:var(--muted)}
.empty button{margin-top:12px}

.tile{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--mon);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px}
.tile.ally{border-left-color:var(--npc)} .tile.ally.k-pc{border-left-color:var(--pc)}
.sidebtn{font-size:11px;padding:1px 7px;border-radius:10px}
.sidebtn.enemy{background:#4a1f1d;border-color:var(--mon)} .sidebtn.ally{background:#1d3d25;border-color:var(--npc)}
#diff{font-weight:600}
.d-trivial{color:var(--muted)} .d-easy{color:var(--green)} .d-medium{color:#e8d34a} .d-hard{color:var(--orange)} .d-deadly{color:#fff;background:#7a1c1c;border-color:var(--red)}
table.dt{border-collapse:collapse;width:100%;margin:6px 0 12px;font-size:13px}
table.dt th,table.dt td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
table.dt td.n,table.dt th.n{text-align:right}
table.dt tr.hl td{color:var(--accent);font-weight:700}
.tile.active{box-shadow:0 0 0 2px var(--accent);background:#262318}
.tile.selected{outline:1px dashed var(--muted);outline-offset:2px}
.tile.dead{opacity:.45}
.t-head{display:flex;align-items:center;gap:6px}
.t-head .init{width:48px;font-weight:700;text-align:center;font-size:16px}
.t-name{flex:1;font-weight:600;font-size:15px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-name small{color:var(--muted);font-weight:400;font-size:12px}
.ac{background:var(--panel2);border:1px solid var(--line);border-radius:12px 12px 16px 16px;padding:2px 8px;font-weight:700}
.hpbar{position:relative;height:20px;background:#0d0f12;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.hpbar .fill{position:absolute;inset:0 auto 0 0;background:var(--green)}
.hpbar.mid .fill{background:var(--orange)} .hpbar.low .fill{background:var(--red)}
.hpbar .tmp{position:absolute;inset:0 0 0 auto;background:#5b7fbf88}
.hpbar span{position:relative;display:block;text-align:center;font-weight:700;font-size:13px;line-height:18px;text-shadow:0 1px 2px #000}
.hp-ctl{display:flex;gap:4px} .hp-ctl input{flex:1;width:auto;min-width:0}
.hp-ctl button{flex:none;padding:4px 9px}
.hp-ctl .dmg{background:#4a1f1d} .hp-ctl .heal{background:#1d3d25}
.conds{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:#3a2f4d;border-radius:10px;padding:1px 8px;font-size:12px;cursor:pointer}
.chip.conc{background:#28466b}
.chip:hover{text-decoration:line-through}
.atks{display:flex;flex-direction:column;gap:2px;font-size:13px}
.atk{display:flex;gap:4px;align-items:baseline;flex-wrap:wrap}
.atk .an{color:#cfd3da;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.atk .tag{color:var(--accent);font-size:11px;font-weight:700}
.other{font-size:12px;color:var(--muted)}
.t-foot{display:flex;align-items:center;gap:4px}
.pips{display:flex;gap:3px;align-items:center;font-size:11px;color:var(--muted)}
.pip{width:13px;height:13px;border-radius:50%;border:1px solid var(--accent);cursor:pointer}
.pip.used{background:transparent} .pip.free{background:var(--accent)}

.roll{color:var(--accent);border-bottom:1px dotted var(--accent);cursor:pointer;white-space:nowrap;font-weight:600}
.roll:hover{background:#3a2f15}
.roll.hit{color:#7fc4ff;border-color:#7fc4ff}

/* statblock */
.sb{padding:12px 14px}
.sb h2{margin:0;color:var(--accent);font-size:20px}
.sb .sub{color:var(--muted);font-style:italic;margin-bottom:8px}
.sb h3{margin:14px 0 4px;color:var(--accent);border-bottom:1px solid var(--line);font-size:15px;padding-bottom:2px}
.sb p{margin:4px 0}
.sb .line b{color:#cfd3da}
.abil{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:8px 0;text-align:center}
.abil div{background:var(--panel2);border-radius:6px;padding:4px 0;cursor:pointer}
.abil div:hover{outline:1px solid var(--accent)}
.abil small{display:block;color:var(--muted);font-size:11px}
.abil .sv{font-size:11px;color:#7fc4ff}
.ctl{background:var(--panel2);margin:10px 14px;padding:10px;border-radius:8px;display:flex;flex-direction:column;gap:8px}
.ctl .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctl label{color:var(--muted);font-size:12px}

/* modal */
#gate{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;font-size:18px;color:var(--muted);line-height:1.8}
#gate[hidden]{display:none}
#gate button{margin-top:14px;font-size:16px;padding:8px 18px}
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-start;justify-content:center;padding:30px;z-index:10}
#modal[hidden]{display:none}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(980px,100%);max-height:calc(100vh - 60px);overflow:auto;padding:16px}
.modal-box.wide{width:min(1500px,100%)}
/* Csapat nézet */
.ptable{border-collapse:collapse;width:100%;font-size:13px;margin:4px 0 14px}
.ptable th,.ptable td{border-bottom:1px solid var(--line);padding:4px 8px;text-align:center;white-space:nowrap}
.ptable th:first-child,.ptable td:first-child{text-align:left}
.ptable td.best{color:var(--accent);font-weight:700}
.ptable td.sk{cursor:pointer} .ptable td.sk:hover{background:#3a2f15}
.ptable th.sortable{cursor:pointer;user-select:none} .ptable th.sortable:hover{color:var(--accent)}
.ptable .ab{color:var(--muted);font-size:11px}
.pmark{font-size:10px;color:var(--muted);margin-left:2px}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.pcard{background:var(--panel2);border-radius:8px;padding:10px}
.pcard h3{margin:0 0 4px;color:var(--accent);display:flex;align-items:center;gap:8px}
.pcard h4{margin:8px 0 2px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.inv{list-style:none;margin:0;padding:0;font-size:13px}
.inv li{padding:1px 0}
.inv .mag{color:#c9a0ff} .inv .flag{font-size:11px;color:var(--accent);margin-left:4px} .inv .note{color:var(--muted);font-size:11px}
#partyRoll{min-height:22px;margin:6px 0}
.modal-box h2{margin:0 0 10px;color:var(--accent)}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tabs button.on{background:var(--accent);color:#1a1405}
.rows{display:flex;flex-direction:column;gap:4px}
.lrow{display:flex;align-items:center;gap:8px;background:var(--panel2);padding:6px 8px;border-radius:6px}
.lrow .nm{flex:1} .lrow .nm small{color:var(--muted);margin-left:6px}
.lrow input[type=number]{width:52px}
.srcs{display:flex;flex-wrap:wrap;gap:4px 12px;max-height:120px;overflow:auto;background:#0f1115;padding:8px;border-radius:6px;border:1px solid var(--line);font-size:12px}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.form label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:2px}
.form label input,.form label select{width:100%}
.form .w2{grid-column:span 2} .form .w4{grid-column:1/-1} .form [hidden]{display:none}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.hint{font-size:12px;color:var(--muted)}
@media (max-width:1200px){#side{width:340px;min-width:300px}}
.kbd{border:1px solid var(--line);border-radius:3px;padding:0 4px;font-size:11px}
.av{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none;border:1px solid var(--line);background:var(--panel2)}
.sb .portrait{float:right;width:110px;height:110px;border-radius:10px;object-fit:cover;margin:0 0 8px 10px;border:1px solid var(--line)}
.tile.hiddenp{border-style:dashed;opacity:.75}
.tile.hiddenp .t-name::after{content:" 🙈";font-size:12px}
.pv{width:72px;height:72px;border-radius:10px;object-fit:cover;border:1px solid var(--line);background:var(--panel2)}
</style>
</head>
<body>
<header>
  <div class="brand">⚔ DM Screen</div>
  <div class="round">Kör <b id="roundNo">1</b></div>
  <button id="diff" data-act="diffInfo" title="Encounter nehézsége (DMG 2014) – kattints a részletekért">–</button>
  <button data-act="prev" title="Előző (P)">◀</button>
  <button class="primary" data-act="next" title="Következő (N vagy Szóköz)">Következő ▶</button>
  <button data-act="rollInit">🎲 Initiative</button>
  <button data-act="openLoot" title="Zsákmány a legyőzött ellenfelek alapján (DMG 2014 kincstáblák)">🎁 Loot</button>
  <button data-act="openParty" title="Harcon kívül: a játékosok passzív értékei, skilljei, felszerelése és pénze">👥 Csapat</button>
  <span class="sep"></span>
  <button data-act="openLib">＋ Hozzáadás / Könyvtár</button>
  <button data-act="newCreature">✎ Új lény</button>
  <button data-act="openPlayer" title="Külön ablakban megnyitja a játékosoknak szánt képernyőt – húzd át a másik monitorra, és nyomj F11-et">📺 Játékos képernyő</button>
  <button data-act="openCharApp" title="Új lapon megnyitja a játékosok telefonos karakterlapját (karakter.html) – ezt a címet küldd el a játékosoknak">📱 Karakterlap</button>
  <span class="grow"></span>
  <button id="backupNag" data-act="exportAll" hidden title="Biztonsági másolat letöltése a gépedre (a felhőtől független)" style="border-color:var(--orange);color:var(--orange)"></button>
  <span id="saveState"></span>
  <button data-act="menu">⋯ Menü</button>
</header>
<main>
  <section id="board"><div id="tiles"></div></section>
  <aside id="side">
    <div id="detail"></div>
    <div id="dice">
      <div class="dicebar">
        <input id="diceInput" placeholder="pl. 2d6+3">
        <button data-act="rollCustom">Dob</button>
        <button class="small" data-die="1d4">d4</button><button class="small" data-die="1d6">d6</button>
        <button class="small" data-die="1d8">d8</button><button class="small" data-die="1d10">d10</button>
        <button class="small" data-die="1d12">d12</button><button class="small" data-die="1d20">d20</button>
        <button class="small" data-die="1d100">d%</button>
        <span class="hint" style="width:100%">Kattints a színes számokra · Shift+kattintás: előny / kritikus · Ctrl+kattintás: hátrány</span>
      </div>
      <div id="log"></div>
    </div>
  </aside>
</main>
<div id="modal" hidden><div class="modal-box" id="modalBox"></div></div>
<div id="gate"><div>Betöltés…</div></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script src="sheet.js?v=3"></script>
<script>
'use strict';
// ---------- alapok ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const ABIL = ['str','dex','con','int','wis','cha'];
const ABIL_FULL = {str:'Strength',dex:'Dexterity',con:'Constitution',int:'Intelligence',wis:'Wisdom',cha:'Charisma'};
const CONDITIONS = ['Blinded','Charmed','Deafened','Exhaustion','Frightened','Grappled','Incapacitated','Invisible','Paralyzed','Petrified','Poisoned','Prone','Restrained','Stunned','Unconscious'];
const SECTIONS = ['traits','actions','bonusActions','reactions','legendary'];
const SECTION_HU = {traits:'Tulajdonságok', actions:'Akciók', bonusActions:'Bónusz akciók', reactions:'Reakciók', legendary:'Legendás akciók'};
const KIND_HU = {monster:'Szörny', npc:'NPC', pc:'Játékos'};
const sideOf = x => x.side === 'enemy' || x.side === 'ally' ? x.side : (x.c.kind === 'monster' ? 'enemy' : 'ally');
const SIDE_HU = {enemy: 'Ellenfél', ally: 'Csapattárs'};
const mod = s => Math.floor(((+s || 10) - 10) / 2);
const sgn = n => (n >= 0 ? '+' : '') + n;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

const TEMPLATE = {
  "_leiras": "DM Screen sablon. Töltsd ki, és importáld: Könyvtár → JSON / Sablon fül. kind: monster | npc | pc. A szekciókban (traits, actions, bonusActions, reactions, legendary) minden elem {name, text}. A szövegben lévő dobásokat (pl. 1d6+2, +5 to hit, Recharge 5–6) a program kattinthatóvá teszi. initBonus: null = DEX módosító. Több lényt is megadhatsz egy tömbben: [ {...}, {...} ].",
  "name": "Ködvadász", "kind": "monster", "size": "Medium", "type": "aberration", "alignment": "neutral evil", "cr": "3",
  "ac": 14, "acNote": "natural armor", "hp": {"max": 52, "formula": "8d8+16"}, "speed": "30 ft., climb 30 ft.",
  "abilities": {"str": 14, "dex": 16, "con": 14, "int": 8, "wis": 12, "cha": 6},
  "saves": {"dex": 5}, "skills": "Stealth +7, Perception +3", "senses": "darkvision 60 ft., passive Perception 13",
  "languages": "Deep Speech", "initBonus": null, "resist": "", "immune": "poison", "vuln": "", "condImmune": "poisoned",
  "traits": [{"name": "Ködben járás", "text": "Sűrű ködben a ködvadász láthatatlan."}],
  "actions": [
    {"name": "Multiattack", "text": "Két Karom támadás."},
    {"name": "Karom", "text": "Melee Weapon Attack: +5 to hit, reach 5 ft. Hit: 1d8+3 slashing damage."},
    {"name": "Ködlehelet (Recharge 5–6)", "text": "15 ft. cone, DC 12 Constitution saving throw. 3d6 poison damage on a failed save, half as much on a success."}
  ],
  "bonusActions": [], "reactions": [], "legendary": [], "legendaryCount": 0, "notes": ""
};

// ---------- állapot ----------
let S = {
  library: [],
  enc: {list: [], round: 1, active: null},
  saved: [],
  settings: {groupInit: true, rollHp: false, sources: ['MM','VGM','MTF','MPMM']}
};
let selected = null;
let logLines = [];
let libTab = 'lib';

function blankCreature() {
  return {id: uid(), name: 'Új lény', kind: 'monster', source: 'saját', size: '', type: '', alignment: '', cr: '',
    ac: 10, acNote: '', hp: {max: 10, formula: ''}, speed: '30 ft.',
    abilities: {str:10,dex:10,con:10,int:10,wis:10,cha:10}, saves: {}, skills: '', senses: '', languages: '',
    initBonus: null, resist: '', immune: '', vuln: '', condImmune: '',
    traits: [], actions: [], bonusActions: [], reactions: [], legendary: [], legendaryCount: 0, notes: ''};
}
// ---------- bejövő adatok tisztítása ----------
// Minden betöltött adat (import, felhő, böngésző-tároló, mentésfájl) ezeken megy át, hogy egy
// rosszindulatú fájl se tudjon kódot becsempészni: a számok számok, a típusok csak megengedett
// értékek, az azonosítók csak biztonságos karakterek, a portré csak kép-link lehet.
const KINDS = ['monster', 'npc', 'pc'], SIDES = ['enemy', 'ally'], VIS = ['dm', 'party'];
const EMAIL_RE = /^[^\s@<>"'`]{1,100}@[^\s@<>"'`]{1,100}\.[^\s@<>"'`]{2,30}$/;
const num = (v, def = 0) => { if (v === null || v === '' || typeof v === 'boolean') return def; const n = Number(v); return Number.isFinite(n) ? n : def; };
const str = v => v == null ? '' : typeof v === 'object' ? '' : String(v);
const safeId = v => { const s = typeof v === 'number' ? String(v) : v; return typeof s === 'string' && /^[A-Za-z0-9_-]{1,64}$/.test(s) ? s : uid(); };
const safeUrl = v => typeof v === 'string' && /^(https?:\/\/|data:image\/)/i.test(v.trim()) ? v.trim() : '';
const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
const SKILLS = {acrobatics: 'dex', 'animal-handling': 'wis', arcana: 'int', athletics: 'str', deception: 'cha', history: 'int', insight: 'wis', intimidation: 'cha', investigation: 'int', medicine: 'wis', nature: 'int', perception: 'wis', performance: 'cha', persuasion: 'cha', religion: 'int', 'sleight-of-hand': 'dex', stealth: 'dex', survival: 'wis'};
const skillLabel = k => k.split('-').map(w => w === 'of' ? w : cap(w)).join(' ');
const WEAPON_ARMOR_PROF = /^(simple|martial)-weapons$|-armor$|^shields$|^(club|dagger|greatclub|handaxe|javelin|light-hammer|mace|quarterstaff|sickle|spear|crossbow-light|crossbow-heavy|crossbow-hand|dart|shortbow|sling|battleaxe|flail|glaive|greataxe|greatsword|halberd|lance|longsword|maul|morningstar|pike|rapier|scimitar|shortsword|trident|war-pick|warhammer|whip|blowgun|longbow|net|firearms)$/;
function normInventory(list) {
  return (Array.isArray(list) ? list : []).slice(0, 1000).filter(isObj).map(i => ({
    name: str(i.name), qty: Math.max(0, Math.floor(num(i.qty, 1))), equipped: !!i.equipped, attuned: !!i.attuned,
    magic: !!i.magic, rarity: str(i.rarity), container: str(i.container), note: str(i.note), ref: str(i.ref)
  })).filter(i => i.name);
}
function normCreature(c) {
  c = isObj(c) ? c : {};
  const b = blankCreature();
  const o = {...b, ...c};
  delete o._leiras;
  for (const k of ['name', 'source', 'size', 'type', 'alignment', 'cr', 'acNote', 'speed', 'skills', 'senses', 'languages', 'resist', 'immune', 'vuln', 'condImmune', 'notes']) o[k] = str(o[k]);
  o.kind = KINDS.includes(o.kind) ? o.kind : 'monster';
  o.id = safeId(o.id);
  if (o.libId != null) o.libId = safeId(o.libId);
  if (o.ddbId != null) o.ddbId = num(o.ddbId, null);
  o.portrait = safeUrl(o.portrait);
  const ab = isObj(c.abilities) ? c.abilities : {};
  o.abilities = {}; ABIL.forEach(a => o.abilities[a] = num(ab[a], 10));
  const hp = isObj(c.hp) ? c.hp : c.hp != null ? {max: c.hp} : {};
  o.hp = {max: Math.max(1, num(hp.max, 10)), formula: str(hp.formula)};
  if (hp.cur != null) o.hp.cur = Math.max(0, num(hp.cur, o.hp.max));
  o.ac = num(o.ac, 10) || 10;
  o.legendaryCount = Math.max(0, Math.min(10, Math.floor(num(o.legendaryCount, 0))));
  const sv = isObj(c.saves) ? c.saves : {};

function syncSheets(ops) {

// ---------- kocka ----------
// kriptográfiai véletlenszám (Windows rendszer-generátora), elutasításos mintavétellel, hogy minden oldal pontosan egyforma eséllyel jöjjön
function rnd(d) {
  const a = new Uint32Array(1), lim = Math.floor(0x100000000 / d) * d;
  do crypto.getRandomValues(a); while (a[0] >= lim);
  return 1 + (a[0] % d);
}
const TIP_HIT = 'Támadódobás – kattintás: normál · Shift+kattintás: előny · Ctrl+kattintás: hátrány';
const TIP_DMG = 'Sebzésdobás – kattintás: normál · Shift+kattintás: kritikus (dupla kocka)';
const TIP_RECH = 'Recharge – d6 dobás, ennyi vagy több kell, hogy újra használható legyen';
function roll(expr) {
  const e = String(expr).replace(/\s+/g, '').replace(/[−–]/g, '-');
  const terms = e.match(/[+-]?[^+-]+/g) || [];
  let total = 0; const parts = [];
  for (const t of terms) {
    const sign = t[0] === '-' ? -1 : 1;
    const body = t.replace(/^[+-]/, '');
    const m = body.match(/^(\d*)d(\d+)$/i);
    if (m) {
      const n = Math.min(+(m[1] || 1), 200), d = +m[2]; const rs = [];
      for (let i = 0; i < n; i++) rs.push(rnd(d));
      total += sign * rs.reduce((a, b) => a + b, 0);
      parts.push((sign < 0 ? '−' : '') + `[${rs.join(',')}]`);
    } else if (/^\d+$/.test(body)) { total += sign * +body; parts.push((sign < 0 ? '−' : '+') + body); }
  }
  return {total, detail: parts.join(' ')};
}
function log(html, cls = '') {
  logLines.unshift({html, cls});
  logLines = logLines.slice(0, 150);
  $('#log').innerHTML = logLines.map(l => `<div class="le ${l.cls}">${l.html}</div>`).join('');
}
function rollHit(bonus, who, label, mode) {
  const b = parseInt(bonus) || 0;
  const a = rnd(20), a2 = rnd(20);
  const d = mode === 'adv' ? Math.max(a, a2) : mode === 'dis' ? Math.min(a, a2) : a;
  const tag = mode === 'adv' ? ` előny [${a},${a2}]` : mode === 'dis' ? ` hátrány [${a},${a2}]` : ` [${a}]`;
  const cls = d === 20 ? 'crit' : d === 1 ? 'fumble' : '';
  const html = `<span class="who">${esc(who)}</span> ${esc(label)}: <b>${d + b}</b> <small>d20${tag} ${sgn(b)}${d === 20 ? ' — KRITIKUS!' : d === 1 ? ' — elvétve' : ''}</small>`;
  log(html, cls);
  return {html, cls, total: d + b};
}
function rollDmg(expr, who, label, crit) {
  if (crit) expr = expr.replace(/(\d*)d(\d+)/g, (m, n, d) => `${2 * (+n || 1)}d${d}`);
  const r = roll(expr);
  log(`<span class="who">${esc(who)}</span> ${esc(label)}: <b>${r.total}</b> <small>${esc(expr)}${crit ? ' (krit)' : ''} ${esc(r.detail)}</small>`);
}

// szövegben lévő dobások kattinthatóvá tétele
const LINK_RE = /(\d+d\d+(?:\s*[+\-−]\s*\d+(?!\s*d))?)|([+\-]\d+)(?= to hit)|(?<=Attack(?: Roll)?:\s?)([+\-]\d+)|(\(Recharge (\d)(?:[–-]6)?\))/g;
function linkify(s) {
  return esc(s).replace(LINK_RE, (m, dice, hit, hit2, rech, rn) => {
    if (dice) return `<span class="roll" data-roll="${dice.replace(/\s/g, '')}" title="${TIP_DMG}">${dice}</span>`;
    if (hit || hit2) return `<span class="roll hit" data-hit="${hit || hit2}" title="${TIP_HIT}">${hit || hit2}</span>`;
    if (rech) return `<span class="roll" data-rech="${rn || 6}" title="${TIP_RECH}">${rech}</span>`;
    return m;
  }).replace(/\n/g, '<br>');
}
function atkInfo(text) {
  const hit = (text.match(/([+\-]\d+)(?= to hit)/) || text.match(/Attack(?: Roll)?:\s?([+\-]\d+)/) || [])[1];
  const dice = [];
  const re = /(\d+d\d+(?:\s*[+\-−]\s*\d+(?!\s*d))?)/g; let m;
  while ((m = re.exec(text))) {
    const after = text.slice(re.lastIndex, re.lastIndex + 30).match(/^\)?\s*([A-Za-z]+)\s+damage/i);
    dice.push({expr: m[1].replace(/\s/g, ''), type: after ? after[1].toLowerCase() : ''});
  }
  return {hit, dice};
}

// ---------- encounter ----------
function order() {
  return [...S.enc.list].sort((a, b) =>
    (b.init ?? -99) - (a.init ?? -99) ||
    initBonusOf(b.c) - initBonusOf(a.c) ||
    (a.c.kind === 'pc' ? 0 : 1) - (b.c.kind === 'pc' ? 0 : 1) ||
    nameOf(a).localeCompare(nameOf(b), 'hu', {numeric: true}));
}
function addToEncounter(creature, count = 1) {
  const c0 = normCreature(structuredClone(creature));
  const base = c0.name;
  const same = S.enc.list.filter(x => x.c.name === base);
  if (same.length === 1 && !same[0].num && c0.kind !== 'pc') same[0].num = 1;
  let next = Math.max(0, ...same.map(x => x.num || 0)) + 1;
  const group = uid();
  const added = [];
  for (let i = 0; i < count; i++) {
    const c = structuredClone(c0);
    c.libId = creature.libId || creature.id;
    const num = c.kind === 'pc' ? 0 : (count > 1 || same.length ? next++ : 0);
    let hp = c.hp.cur ?? c.hp.max;
    if (S.settings.rollHp && c.hp.formula && c.kind !== 'pc') hp = Math.max(1, roll(c.hp.formula).total);
    if (c.kind !== 'pc') c.hp.max = Math.max(c.hp.max, hp);
    delete c.hp.cur;
    const sheet = c.kind === 'pc' && SHEETS[c.libId];  // telefonos lapnál a lap szerinti HP és temp HP
    if (sheet) hp = sheet.hp.cur;
    const x = {cid: uid(), num, c, hp, temp: sheet ? sheet.hp.temp : 0, init: null, cond: sheet ? condsFromSheet(sheet) : [], conc: !!sheet?.concentration, dead: false, notes: '', leg: 0, group: c.kind === 'pc' ? null : group};
    S.enc.list.push(x); added.push(x);
  }
  // harc közben hozzáadott ellenfelek azonnal dobnak
  if (S.enc.active) added.forEach(x => { if (x.c.kind !== 'pc') x.init = roll('1d20').total + initBonusOf(x.c); });
  save(); render();
  return added;
}
function startTurn(x) {
  x.leg = 0;
  const expired = [];
  x.cond.forEach(k => { if (k.rounds != null) { k.rounds--; if (k.rounds <= 0) expired.push(k); } });
  x.cond = x.cond.filter(k => !expired.includes(k));
  log(`▶ ${esc(nameOf(x))} köre`, 'turn');
  expired.forEach(k => log(`${esc(nameOf(x))}: ${esc(k.name)} lejárt`, 'warn'));
  if (x.conc) log(`${esc(nameOf(x))} koncentrál`, 'warn');
}
function step(dir) {
  const o = order();
  if (!o.length) return;
  const skip = x => x.dead && x.c.kind !== 'pc';
  if (o.every(skip)) return;
  let i = o.findIndex(x => x.cid === S.enc.active);
  if (i < 0) {
    i = o.findIndex(x => !skip(x));
    S.enc.active = o[i].cid; S.enc.round = S.enc.round || 1;
    log(`— ${S.enc.round}. kör —`, 'round'); startTurn(o[i]);
  } else {
    let j = i;
    do {
      j += dir;
      if (j >= o.length) { j = 0; S.enc.round++; log(`— ${S.enc.round}. kör —`, 'round'); }
      if (j < 0) { j = o.length - 1; S.enc.round = Math.max(1, S.enc.round - 1); }
    } while (skip(o[j]));
    S.enc.active = o[j].cid;
    if (dir > 0) startTurn(o[j]);
  }
  selected = null;
  save(); render();
  document.querySelector('.tile.active')?.scrollIntoView({block: 'nearest', behavior: 'smooth'});
}
function rollInitiative(mode) {
  const groups = {};
  for (const x of S.enc.list) {
    if (mode === 'monsters' && x.c.kind === 'pc') continue;
    if (mode === 'missing' && x.init != null) continue;
    if (S.settings.groupInit && x.group) {
      if (groups[x.group] == null) groups[x.group] = roll('1d20').total + initBonusOf(x.c);
      x.init = groups[x.group];
    } else x.init = roll('1d20').total + initBonusOf(x.c);
  }
  log('🎲 Initiative dobva', 'turn');
  closeModal(); save(); render();
}
function damage(x, n) {
  const max = x.c.hp.max;
  let rem = n;
  if (x.temp) { const t = Math.min(x.temp, rem); x.temp -= t; rem -= t; }
  x.hp = Math.max(0, x.hp - rem);
  log(`<span class="who">${esc(nameOf(x))}</span> −${esc(n)} HP → <b>${esc(x.hp)}</b>/${esc(max)}${x.temp ? ` (+${esc(x.temp)} temp)` : ''}`);
  if (x.conc && n > 0) log(`⚠ ${esc(nameOf(x))}: koncentráció mentő, DC ${Math.max(10, Math.floor(n / 2))}`, 'warn');
  if (x.hp === 0) {
    if (x.c.kind === 'pc') log(`⚠ ${esc(nameOf(x))} 0 HP-n – death save-ek!`, 'warn');
    else { x.dead = true; log(`💀 ${esc(nameOf(x))} elesett`, 'warn'); }
  }
}
function heal(x, n) {
  x.hp = Math.min(x.c.hp.max, x.hp + n);
  if (x.hp > 0) x.dead = false;
  log(`<span class="who">${esc(nameOf(x))}</span> +${esc(n)} HP → <b>${esc(x.hp)}</b>/${esc(x.c.hp.max)}`);
}

// Kincshalom: az egész harcért érmék + drágakövek, műtárgyak és mágikus tárgyak (A–I táblák).
const LOOT_URL = 'https://raw.githubusercontent.com/5etools-mirror-3/5etools-src/main/data/loot.json';
const COIN_GP = {pp: 10, gp: 1, ep: 0.5, sp: 0.1, cp: 0.01}, COINS = ['pp', 'gp', 'ep', 'sp', 'cp'];
const BAND_HU = ['CR 0–4', 'CR 5–10', 'CR 11–16', 'CR 17+'];
const NATURAL_ATTACK = /\b(bite|claws?|slam|tail|tentacles?|horns?|hoof|hooves|talons?|gore|sting|fists?|unarmed|beak|tusks?|touch|rend|pseudopod|ram|stomp|wings?|harapás|karom)\b/i;
let lootData = null, lootResult = null;
async function loadLoot() {
  if (!lootData) { const r = await fetch(LOOT_URL); if (!r.ok) throw new Error('HTTP ' + r.status); lootData = await r.json(); }
  return lootData;
}
const crBand = cr => { const n = crNum(String(cr ?? '').replace(/^CR\s*/i, '')); return n <= 4 ? 0 : n <= 10 ? 1 : n <= 16 ? 2 : 3; };
function rollAmount(expr) {
  const m = String(expr ?? '0').replace(/\s/g, '').match(/^(.+?)(?:\*(\d+))?$/);
  return m ? roll(m[1]).total * (m[2] ? +m[2] : 1) : 0;
}
const dmgTable = (list, band) => (list || []).find(t => t.source === 'DMG' && crBand(t.crMin) === band);
function pickRow(table, die) { const r = rnd(die); return (table || []).find(row => r >= row.min && r <= (row.max ?? row.min)); }
function addCoins(acc, coins) { for (const [k, v] of Object.entries(coins || {})) if (COIN_GP[k]) acc[k] = (acc[k] || 0) + rollAmount(v); return acc; }
function lootItemName(row) {
  if (!row) return '';
  if (Array.isArray(row.table) && row.table.length) {
    const die = Math.max(...row.table.map(r => r.max ?? r.min));
    return lootItemName(pickRow(row.table, die) || row.table[0]);
  }
  if (row.choose) return tagStrip(String(Object.values(row.choose).flat()[0] || '')) + ' (válassz konkrét tárgyat)';
  return tagStrip(row.item || '');
}
function rollValuables(list, spec) {
  if (!spec) return [];
  const t = (list || []).find(g => g.source === 'DMG' && g.type === spec.type);
  if (!t || !t.table?.length) return [];
  return Array.from({length: rollAmount(spec.amount)}, () => ({name: tagStrip(t.table[rnd(t.table.length) - 1]), value: spec.type}));
}
function rollMagicItems(data, specs) {
  const out = [];
  for (const s of specs || []) {
    const t = (data.magicItems || []).find(m => m.source === 'DMG' && m.type === s.type);
    if (!t) continue;
    for (let i = 0, n = rollAmount(s.amount); i < n; i++) { const name = lootItemName(pickRow(t.table, 100)); if (name) out.push({name, table: s.type}); }
  }
  return out;
}
// a legyőzött fegyverei és páncélja (természetes támadások nélkül)
function gearOf(c) {
  const items = [];
  for (const a of [...c.actions, ...c.bonusActions])
    if (/Weapon Attack:|Attack Roll:/i.test(a.text) && !/Spell Attack/i.test(a.text) && !NATURAL_ATTACK.test(a.name)) items.push(a.name.replace(/\s*\(.*?\)\s*/g, ' ').trim());
  if (c.acNote && !/natural|scraps|unarmored|mage armor/i.test(c.acNote)) c.acNote.split(/,\s*/).forEach(s => items.push(s.trim()));
  return [...new Set(items.filter(Boolean))];
}
const noTreasure = c => /\b(beast|ooze|plant)\b/i.test(c.type);
function generateLoot(data, chosen, mode, band) {
  const res = {mode, creatures: [], hoard: null};
  for (const x of chosen) {
    let coins = {};
    if (mode !== 'hoard') { const t = dmgTable(data.individual, crBand(x.c.cr)); coins = addCoins({}, t ? pickRow(t.table, 100)?.coins : null); }
    res.creatures.push({name: nameOf(x), coins, gear: gearOf(x.c)});
  }
  if (mode !== 'individual') {
    const t = dmgTable(data.hoard, band);
    const row = (t && pickRow(t.table, 100)) || {};
    res.hoard = {band, coins: addCoins({}, t?.coins), gems: rollValuables(data.gems, row.gems), art: rollValuables(data.artObjects, row.artObjects), items: rollMagicItems(data, row.magicItems)};
  }
  return res;
}
function lootTotals(res) {
  const coins = {};
  for (const c of [...res.creatures.map(c => c.coins), res.hoard?.coins || {}]) for (const k of COINS) if (c[k]) coins[k] = (coins[k] || 0) + c[k];
  const valuables = res.hoard ? [...res.hoard.gems, ...res.hoard.art].reduce((s, v) => s + v.value, 0) : 0;
  const gp = COINS.reduce((s, k) => s + (coins[k] || 0) * COIN_GP[k], 0) + valuables;
  const party = S.enc.list.filter(x => x.c.kind === 'pc' && sideOf(x) === 'ally').length;
  return {coins, gp: Math.round(gp * 100) / 100, party, each: party ? Math.floor(gp / party * 100) / 100 : null};
}
const coinStr = c => COINS.filter(k => c[k]).map(k => `${c[k]} ${k}`).join(', ');
function groupNames(list) {
  const m = new Map();
  for (const v of list) { const k = v.name + (v.value ? ` (${v.value} gp)` : ''); m.set(k, (m.get(k) || 0) + 1); }
  return [...m].map(([k, n]) => (n > 1 ? n + '× ' : '') + k);
}
function lootText(res) {
  if (!res) return '';
  const t = lootTotals(res), lines = [];
  for (const c of res.creatures) {
    const parts = [res.mode !== 'hoard' ? (coinStr(c.coins) || 'nincs érme') : '', c.gear.length ? 'felszerelés: ' + c.gear.join(', ') : ''].filter(Boolean);
    if (parts.length) lines.push(`${c.name}: ${parts.join('; ')}`);
  }
  if (res.hoard) {
    lines.push(`Kincshalom (${BAND_HU[res.hoard.band]}): ${coinStr(res.hoard.coins) || 'nincs érme'}`);
    if (res.hoard.gems.length) lines.push('Drágakövek: ' + groupNames(res.hoard.gems).join(', '));
    if (res.hoard.art.length) lines.push('Műtárgyak: ' + groupNames(res.hoard.art).join(', '));
    if (res.hoard.items.length) lines.push('Mágikus tárgyak: ' + groupNames(res.hoard.items).join(', '));
  }
  lines.push(`Összesen: ${coinStr(t.coins) || '0'} – kb. ${t.gp} gp értékben` + (t.each != null ? `, fejenként kb. ${t.each} gp (${t.party} játékos)` : ''));
  return lines.join('\n');
}
function openLoot() {
  const enemies = order().filter(x => sideOf(x) === 'enemy');
  const anyDead = enemies.some(x => x.dead);
  const on = x => (anyDead ? x.dead : true) && !noTreasure(x.c);
  const pool = enemies.filter(on);
  const band = crBand((pool.length ? pool : enemies).reduce((m, x) => crNum(x.c.cr) > crNum(m) ? x.c.cr : m, '0'));
  openModal(`<h2>🎁 Zsákmány</h2>
    <p class="hint">A DMG (2014) kincstáblái alapján. Alapból a legyőzött ellenfelek vannak kiválasztva; állatoknál, oozeoknál és növényeknél a DMG szerint nincs kincs. Egyéni kincs = ellenfelenként érmék; kincshalom = egy nagyobb zsákmány az egész harcért (pl. boss, búvóhely), mágikus tárgyakkal.</p>
    ${enemies.length ? `<div class="rows">${enemies.map(x => `<label class="lrow"><input type="checkbox" class="lootPick" value="${esc(x.cid)}" ${on(x) ? 'checked' : ''}>
      <span class="nm"><b>${esc(nameOf(x))}</b><small>${esc(crLabel(x.c) || 'nincs CR')} · ${esc(x.c.type || '')}${x.dead ? ' · legyőzve' : ''}</small></span></label>`).join('')}</div>`
      : '<p class="muted">Nincs ellenfél az encounterben – csak kincshalmot lehet dobni.</p>'}
    <div class="toolbar" style="margin-top:10px">
      <select id="lootMode"><option value="individual">Egyéni kincs (ellenfelenként)</option><option value="hoard"${enemies.length ? '' : ' selected'}>Kincshalom (az egész harcért)</option><option value="both">Mindkettő</option></select>
      <label class="hint">Kincshalom szintje <select id="lootBand">${BAND_HU.map((l, i) => `<option value="${i}" ${i === band ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <button class="primary" data-act="lootRoll">🎲 Generálás</button>
    </div>
    <div id="lootOut"></div>`);
}
async function rollLootUi() {
  const out = $('#lootOut');
  out.innerHTML = '<p class="muted">Kincstáblák betöltése…</p>';
  let data;
  try { data = await loadLoot(); }
  catch (e) { out.innerHTML = `<p style="color:var(--red)">Nem sikerült betölteni a kincstáblákat (van internet?): ${esc(e.message)}</p>`; return; }
  const picked = [...document.querySelectorAll('.lootPick')].filter(i => i.checked).map(i => byId(i.value)).filter(Boolean);
  const mode = $('#lootMode').value;
  lootResult = generateLoot(data, picked, mode, +$('#lootBand').value);
  const t = lootTotals(lootResult), h = lootResult.hoard;
  const itemLink = n => n.includes('(válassz') ? esc(n) : `<a href="https://5e.tools/items.html#${encodeURIComponent(n.toLowerCase())}_dmg" target="_blank" rel="noopener" style="color:var(--accent)">${esc(n)}</a>`;
  out.innerHTML = `
    ${lootResult.creatures.length ? `<h3>Ellenfelenként</h3>${lootResult.creatures.map(c => `<p><b>${esc(c.name)}</b>${mode !== 'hoard' ? ': ' + esc(coinStr(c.coins) || 'nincs érme') : ''}${c.gear.length ? `<br><small class="muted">Felszerelés: ${esc(c.gear.join(', '))}</small>` : ''}</p>`).join('')}` : ''}
    ${h ? `<h3>Kincshalom (${BAND_HU[h.band]})</h3>
      <p><b>Érmék:</b> ${esc(coinStr(h.coins) || 'nincs')}</p>
      ${h.gems.length ? `<p><b>Drágakövek:</b> ${esc(groupNames(h.gems).join(', '))}</p>` : ''}
      ${h.art.length ? `<p><b>Műtárgyak:</b> ${esc(groupNames(h.art).join(', '))}</p>` : ''}
      <p><b>Mágikus tárgyak:</b> ${h.items.length ? h.items.map(i => itemLink(i.name) + ` <small class="muted">(${esc(i.table)} tábla)</small>`).join(', ') : 'nincs'}</p>` : ''}
    <h3>Összesen</h3>
    <p>${esc(coinStr(t.coins) || '0')} – <b>kb. ${esc(t.gp)} gp</b> értékben${t.each != null ? `, fejenként kb. <b>${esc(t.each)} gp</b> (${esc(t.party)} játékos)` : ''}</p>
    <div class="toolbar"><button data-act="lootRoll">🎲 Újradobás</button><button data-act="lootCopy">📋 Másolás</button><button data-act="lootLog">Naplóba</button></div>`;
}

// ---------- Csapat nézet (harcon kívül): passzív értékek, skillek, felszerelés ----------
const PASSIVES = [['perception', 'Perception'], ['investigation', 'Investigation'], ['insight', 'Insight']];
const PROF_MARK = {2: '◆', 1: '●', 0.5: '½', 0: ''};
const PROF_HU = {2: 'expertise', 1: 'jártas', 0.5: 'fél jártasság (Jack of All Trades)', 0: ''};
// csapattagok: amíg nincs beállítva (partyIds = null), az összes játékos; utána a kiválasztottak
const byName = (a, b) => a.name.localeCompare(b.name, 'hu');
function partyMembers() {
  const ids = S.settings.partyIds;
  if (!Array.isArray(ids)) return S.library.filter(c => c.kind === 'pc').sort(byName);
  return ids.map(id => S.library.find(c => c.id === id)).filter(Boolean).sort(byName);
}
function setPartyMember(id, on) {
  const ids = new Set(partyMembers().map(c => c.id));
  on ? ids.add(id) : ids.delete(id);
  S.settings.partyIds = [...ids];
  save();
}
// oszlop szerinti rendezés: p = passzív táblázat (sorok = játékosok), s = skill-táblázat (sorok = skillek)
let partySort = {p: {col: null, dir: 1}, s: {col: null, dir: 1}};
const sortArrow = (t, col) => partySort[t].col === col ? (partySort[t].dir > 0 ? ' ▲' : ' ▼') : '';
function setPartySort(t, col) {
  const s = partySort[t];
  if (s.col === col) s.dir = -s.dir;
  else { s.col = col; s.dir = col === 'name' || col === 'skill' ? 1 : -1; }  // számoknál először a legnagyobb
}
// skill-bónusz: D&D Beyondról pontosan; kézzel felvitt játékosnál a „Skills” mezőből, különben a képességmódosító
function partySkill(c, k) {
  if (c.skillMods?.[k]) return c.skillMods[k];
  const base = mod(c.abilities[SKILLS[k]]);
  const m = c.skills.match(new RegExp(skillLabel(k).replace(/ /g, '\\s*') + '\\s*([+\\-−]\\s*\\d+)', 'i'));
  if (m) { const b = parseInt(m[1].replace(/\s/g, '').replace('−', '-')); return {b, p: b > base ? 1 : 0}; }
  return {b: base, p: 0};
}
const passiveScore = (c, k) => 10 + partySkill(c, k).b + (c.passiveBonus?.[k] || 0);
const coinsGp = cur => Math.round(COINS.reduce((s, k) => s + (cur?.[k] || 0) * COIN_GP[k], 0) * 100) / 100;
function inventoryToText(list) { return list.map(i => (i.qty !== 1 ? i.qty + '× ' : '') + i.name + (i.container ? ` [${i.container}]` : '')).join('\n'); }
function textToInventory(text, old = []) {
  return String(text).split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.match(/^(?:(\d+)\s*[×x*]\s*)?(.+?)(?:\s*\[([^\]]+)\])?$/i);
    const name = m[2].trim(), container = (m[3] || '').trim();
    const prev = old.find(o => o.name === name && o.container === container) || old.find(o => o.name === name) || {};
    return {...prev, name, container, qty: m[1] ? +m[1] : 1};
  });
}
function openParty() { openModal(partyHtml(), true); }
// újrarajzolás úgy, hogy a keresés és az utolsó dobás eredménye megmaradjon
function rerenderParty() {
  const q = $('#partySearch')?.value || '', roll = $('#partyRoll')?.innerHTML || '', top = $('#modalBox').scrollTop;
  openParty();
  if ($('#partyRoll')) $('#partyRoll').innerHTML = roll;
  if (q && $('#partySearch')) { $('#partySearch').value = q; filterPartyItems(q); }
  $('#modalBox').scrollTop = top;
}
function partyMembersBar(pcs) {
  const inParty = new Set(pcs.map(c => c.id));
  const cand = S.library.filter(c => !inParty.has(c.id)).sort((a, b) => (KINDS.indexOf(b.kind) - KINDS.indexOf(a.kind)) || byName(a, b));
  return `<div class="toolbar"><b>Tagok:</b>
    ${pcs.map(c => `<span class="chip" data-act="partyRemove" data-pc="${esc(c.id)}" title="Kivétel a csapatból">${esc(c.name)} ✕</span>`).join('') || '<span class="muted">senki</span>'}
    ${cand.length ? `<select id="partyAddSel"><option value="">＋ Hozzáadás a könyvtárból…</option>${cand.map(c => `<option value="${esc(c.id)}">${esc(c.name)} (${esc(KIND_HU[c.kind])})</option>`).join('')}</select>` : ''}</div>`;
}
function partyHtml() {
  const pcs = partyMembers();
  if (!pcs.length) return `<h2>👥 Csapat</h2>${partyMembersBar(pcs)}<p class="muted">${S.library.length
    ? 'Nincs senki a csapatban. Tegyél be valakit a fenti listából.'
    : 'Még nincs játékos a könyvtárban. Importáld őket a <b>＋ Hozzáadás / Könyvtár → D&D Beyond</b> fülön, vagy hozz létre egy „Játékos” típusú lényt.'}</p>`;
  const head = pcs.map(c => `<th class="sortable" data-sort="s" data-col="${esc(c.id)}" title="Rendezés ${esc(c.name)} skilljei szerint">${esc(c.name)}${sortArrow('s', c.id)}</th>`).join('');
  // passzív értékek (sorok rendezhetők)
  const prow = pcs.map(c => ({c, v: PASSIVES.map(([k]) => passiveScore(c, k))}));
  const pBest = PASSIVES.map((_, i) => Math.max(...prow.map(r => r.v[i])));
  const ps = partySort.p;
  if (ps.col === 'name') prow.sort((a, b) => byName(a.c, b.c) * ps.dir);
  else if (ps.col != null) prow.sort((a, b) => ((a.v[ps.col] - b.v[ps.col]) || byName(a.c, b.c) * ps.dir) * ps.dir);  // egyenlőségnél mindig ábécérend
  const passives = `<table class="ptable"><tr><th class="sortable" data-sort="p" data-col="name">Név${sortArrow('p', 'name')}</th>${PASSIVES.map(([, l], i) => `<th class="sortable" data-sort="p" data-col="${i}">Passive ${l}${sortArrow('p', i)}</th>`).join('')}<th>Látás</th><th>Nyelvek</th></tr>
    ${prow.map(({c, v}) => `<tr><td><b>${esc(c.name)}</b></td>${v.map((x, i) => `<td class="${x === pBest[i] ? 'best' : ''}">${esc(x)}</td>`).join('')}
      <td>${esc((c.senses.match(/darkvision\s*\d+\s*ft\.?/i) || ['–'])[0])}</td><td style="white-space:normal;text-align:left">${esc(c.languages || '–')}</td></tr>`).join('')}</table>`;
  // skill-táblázat: alapból képességek szerint; rendezhető ábécébe vagy egy tag bónusza szerint
  let keys = ['str', 'dex', 'int', 'wis', 'cha'].flatMap(a => Object.keys(SKILLS).filter(k => SKILLS[k] === a));
  const ss = partySort.s, sortPc = pcs.find(c => c.id === ss.col);
  if (ss.col === 'skill') keys.sort((a, b) => a.localeCompare(b) * ss.dir);
  else if (sortPc) keys = keys.map((k, i) => [k, i]).sort((a, b) => ((partySkill(sortPc, a[0]).b - partySkill(sortPc, b[0]).b) * ss.dir) || a[1] - b[1]).map(x => x[0]);
  const rows = keys.map(k => {
    const vals = pcs.map(c => partySkill(c, k)), top = Math.max(...vals.map(v => v.b));
    return `<tr><td>${esc(skillLabel(k))} <span class="ab">${SKILLS[k].toUpperCase()}</span></td>
      ${vals.map((v, i) => `<td class="sk ${v.b === top ? 'best' : ''}" data-pc="${esc(pcs[i].id)}" data-sk="${k}" title="${esc(pcs[i].name)} – ${esc(skillLabel(k))}${v.p ? ' (' + PROF_HU[v.p] + ')' : ''}. Kattints: titkos dobás · Shift: előny · Ctrl: hátrány">${esc(sgn(v.b))}<span class="pmark">${PROF_MARK[v.p]}</span></td>`).join('')}
      <td><button class="small" data-act="partyGroup" data-sk="${k}" title="Mindenki dob erre a skillre">Mindenki</button></td></tr>`;
  }).join('');
  const skills = `<table class="ptable"><tr><th class="sortable" data-sort="s" data-col="skill">Skill${sortArrow('s', 'skill')}</th>${head}<th>${ss.col ? '<button class="small" data-act="partySortReset" title="Vissza a képességek szerinti sorrendhez">alap sorrend</button>' : ''}</th></tr>${rows}</table>
    <p class="hint">● jártas · ◆ expertise · ½ fél jártasság (Jack of All Trades) · aranyszínű = a csapat legjobbja · a fejlécre kattintva rendezhető (▼ csökkenő, ▲ növekvő)</p>`;
  // karakterkártyák
  const item = i => `<li data-item="${esc((i.name + ' ' + i.note + ' ' + i.container).toLowerCase())}"><span class="${i.magic ? 'mag' : ''}" title="${esc(i.rarity)}">${i.qty !== 1 ? esc(i.qty) + '× ' : ''}${esc(i.name)}</span>${i.attuned ? '<span class="flag">✦ hangolva</span>' : i.equipped ? '<span class="flag">viselve</span>' : ''}${i.note ? `<br><span class="note">${esc(i.note)}</span>` : ''}</li>`;
  const card = c => {
    const main = c.inventory.filter(i => !i.container).sort((a, b) => (b.attuned - a.attuned) || (b.equipped - a.equipped) || (b.magic - a.magic));
    const groups = [...new Set(c.inventory.filter(i => i.container).map(i => i.container))];
    return `<div class="pcard" data-pcard="${esc(c.id)}">
      <h3>${c.portrait ? `<img class="av" src="${esc(c.portrait)}" alt="" onerror="this.style.display='none'">` : ''}${esc(c.name)}</h3>
      <div class="muted" style="font-size:12px">${esc(c.type)} · AC ${esc(c.ac)} · HP ${esc(c.hp.max)} · ${esc(c.speed)}</div>
      <h4>Pénz</h4><div>${esc(coinStr(c.currency) || '–')}${coinsGp(c.currency) ? ` <span class="muted">(≈ ${esc(coinsGp(c.currency))} gp)</span>` : ''}</div>
      <h4>Felszerelés</h4>${c.inventory.length ? `<ul class="inv">${main.map(item).join('')}</ul>
        ${groups.map(g => `<h4>🎒 ${esc(g)}</h4><ul class="inv">${c.inventory.filter(i => i.container === g).map(item).join('')}</ul>`).join('')}` : '<div class="muted">–</div>'}
      <h4>Eszközök, hangszerek</h4><div>${esc(c.tools || '–')}</div>
      ${c.notes ? `<h4>Jegyzet</h4><div style="white-space:pre-wrap">${esc(c.notes)}</div>` : ''}
      <div class="hint" style="margin-top:6px">${c.importedAt ? `D&D Beyond import: ${esc(c.importedAt)} – frissítéshez importáld újra a könyvjelzővel.` : ''}
        <button class="small" data-act="partyEdit" data-pc="${esc(c.id)}">✎ Szerkesztés</button></div>
    </div>`;
  };
  const total = {}; pcs.forEach(c => COINS.forEach(k => total[k] = (total[k] || 0) + (c.currency[k] || 0)));
  return `<h2>👥 Csapat</h2>
    ${partyMembersBar(pcs)}
    <div id="partyRoll" class="le"></div>
    <h3>Passzív értékek</h3>${passives}
    <h3>Skillek</h3>${skills}

  const img = new Image();
  img.onload = () => {

    const k = Math.max(s / img.width, s / img.height), w = img.width * k, h = img.height * k;

// ---------- nehézség (DMG 2014, 5. fejezet) ----------
const CR_XP = {'0': 10, '1/8': 25, '1/4': 50, '1/2': 100, '1': 200, '2': 450, '3': 700, '4': 1100, '5': 1800, '6': 2300, '7': 2900, '8': 3900, '9': 5000, '10': 5900,
  '11': 7200, '12': 8400, '13': 10000, '14': 11500, '15': 13000, '16': 15000, '17': 18000, '18': 20000, '19': 22000, '20': 25000,
  '21': 33000, '22': 41000, '23': 50000, '24': 62000, '25': 75000, '26': 90000, '27': 105000, '28': 120000, '29': 135000, '30': 155000};
// szintenként: [easy, medium, hard, deadly]
const XP_THRESH = [null, [25, 50, 75, 100], [50, 100, 150, 200], [75, 150, 225, 400], [125, 250, 375, 500], [250, 500, 750, 1100],
  [300, 600, 900, 1400], [350, 750, 1100, 1700], [450, 900, 1400, 2100], [550, 1100, 1600, 2400], [600, 1200, 1900, 2800],
  [800, 1600, 2400, 3600], [1000, 2000, 3000, 4500], [1100, 2200, 3400, 5100], [1250, 2500, 3800, 5700], [1400, 2800, 4300, 6400],
  [1600, 3200, 4800, 7200], [2000, 3900, 5900, 8800], [2100, 4200, 6300, 9500], [2400, 4900, 7300, 10900], [2800, 5700, 8500, 12700]];
const MULT = [0.5, 1, 1.5, 2, 2.5, 3, 4, 5];
const DIFF_HU = {trivial: 'Triviális', easy: 'Könnyű', medium: 'Közepes', hard: 'Nehéz', deadly: 'Halálos'};
const crXp = cr => CR_XP[String(cr ?? '').trim().replace(/^CR\s*/i, '').replace(/^0\.125$/, '1/8').replace(/^0\.25$/, '1/4').replace(/^0\.5$/, '1/2')];
const pcLevel = c => { const m = String(c.level ?? c.cr ?? '').match(/\d+/); const n = m ? +m[0] : 0; return n >= 1 && n <= 20 ? n : null; };
function difficulty() {
  const party = S.enc.list.filter(x => sideOf(x) === 'ally' && x.c.kind === 'pc');
  const enemies = S.enc.list.filter(x => sideOf(x) === 'enemy');
  const thresh = [0, 0, 0, 0], noLevel = [];
  party.forEach(x => { const l = pcLevel(x.c); if (l) XP_THRESH[l].forEach((v, i) => thresh[i] += v); else noLevel.push(nameOf(x)); });
  const noCr = [];
  let base = 0;
  enemies.forEach(x => { const xp = crXp(x.c.cr); if (xp == null) noCr.push(nameOf(x)); else base += xp; });
  const counted = enemies.length - noCr.length;
  let idx = counted <= 0 ? 1 : counted === 1 ? 1 : counted === 2 ? 2 : counted <= 6 ? 3 : counted <= 10 ? 4 : counted <= 14 ? 5 : 6;
  const pSize = party.length;
  if (pSize && pSize < 3) idx++; else if (pSize >= 6) idx--;
  const mult = MULT[idx];
  const adj = Math.round(base * mult);
  const rating = !pSize || !counted ? null : adj >= thresh[3] ? 'deadly' : adj >= thresh[2] ? 'hard' : adj >= thresh[1] ? 'medium' : adj >= thresh[0] ? 'easy' : 'trivial';
  return {party, enemies, thresh, noLevel, noCr, base, mult, adj, rating, counted};
}
function renderDiff() {
  const d = difficulty(), el = $('#diff');
  el.className = d.rating ? 'd-' + d.rating : '';
  el.textContent = d.rating ? `${DIFF_HU[d.rating]} · ${d.adj} XP` : 'Nehézség: –';
  if (d.noLevel.length || d.noCr.length) el.textContent += ' ⚠';
}

    d.noLevel.length ? `Ismeretlen szint (nem számolva): ${d.noLevel.join(', ')} – az adatlapon a „CR / szint” mezőbe írd be a szintet.` : '',

  ].filter(Boolean);
  openModal(`<h2>Encounter nehézsége</h2>

function tileHtml(x) {
  const c = x.c, max = c.hp.max || 1;
  const pct = Math.max(0, Math.min(100, x.hp / max * 100));
  const cls = ['tile', 'k-' + c.kind, sideOf(x)];
  if (x.cid === S.enc.active) cls.push('active');
  if (x.cid === selected) cls.push('selected');
  if (x.dead) cls.push('dead');
  if (x.hiddenP) cls.push('hiddenp');
  const hpCls = pct <= 25 ? 'low' : pct <= 50 ? 'mid' : '';
  const tmpPct = x.temp ? Math.min(100, x.temp / max * 100) : 0;
  const chips = (x.conc ? `<span class="chip conc" data-act="toggleConc" title="Koncentráció – kattints a megszüntetéshez">Koncentráció</span>` : '') +

  const atkRows = [], others = [];
  [...c.actions.map(a => [a, '']), ...c.bonusActions.map(a => [a, 'B'])].forEach(([a, t]) => {
    const inf = atkInfo(a.name + ' ' + a.text);
    const rech = (a.name.match(/Recharge (\d)/) || [])[1];
    if (inf.hit || inf.dice.length) {
      atkRows.push(`<div class="atk" data-label="${esc(a.name)}">${t ? `<span class="tag">${t}</span>` : ''}<span class="an" title="${esc(a.text)}">${esc(a.name.replace(/\s*\(Recharge[^)]*\)/, ''))}</span>` +
        (rech ? `<span class="roll" data-rech="${rech}" title="${TIP_RECH}">⟳${rech}</span>` : '') +
        (inf.hit ? `<span class="roll hit" data-hit="${inf.hit}" title="${TIP_HIT}">${inf.hit}</span>` : '') +
        inf.dice.slice(0, 3).map(d => `<span class="roll" data-roll="${d.expr}" title="${TIP_DMG}">${d.expr}</span>${d.type ? `<small class="muted">${esc(d.type)}</small>` : ''}`).join(' ') + '</div>');
    } else others.push((t ? t + ': ' : '') + a.name);

  return `<div class="${esc(cls.join(' '))}" data-cid="${esc(x.cid)}">

      <div class="t-name" data-act="select" title="Részletek">${esc(nameOf(x))} <small>${esc(crLabel(c))}</small></div>
      <div class="ac" title="AC${c.acNote ? ' – ' + esc(c.acNote) : ''}">🛡 ${esc(c.ac)}</div>
    </div>
    <div class="hpbar ${hpCls}"><div class="fill" style="width:${pct}%"></div>${tmpPct ? `<div class="tmp" style="width:${tmpPct}%"></div>` : ''}<span>${esc(x.hp)} / ${esc(max)}${x.temp ? ' +' + esc(x.temp) : ''}</span></div>
    <div class="hp-ctl">
      <input class="hpin" type="number" placeholder="±HP" title="Pozitív szám = sebzés, negatív (pl. -10) = gyógyítás, Enter-rel alkalmazod">

    ${others.length ? `<div class="other">${esc(others.join(' · '))}</div>` : ''}
    <div class="t-foot"><button class="sidebtn ${esc(sideOf(x))}" data-act="toggleSide" title="Kattints az oldal váltásához (ellenfél ↔ csapattárs)">${SIDE_HU[sideOf(x)]}</button>${pips}<span class="grow"></span>

function applyMod(o, mods) {
  const nm = x => typeof x === 'string' ? x : x?.name;
  for (const [key, v] of Object.entries(mods || {})) {

        } else if (op.mode === 'removeArr') {

}

const SIZE = {T: 'Tiny', S: 'Small', M: 'Medium', L: 'Large', H: 'Huge', G: 'Gargantuan'};

const isDDB = o => (o.data && Array.isArray(o.data.stats)) || (Array.isArray(o.stats) && o.stats[0]?.id != null);
async function importAny(obj) {
  const arr = Array.isArray(obj) ? obj : obj.monster || obj.creatures || (obj.library && !obj.enc ? obj.library : null) || [obj];
  const out = [], sheets = [];
  for (const o of arr) {
    if (o?.format === Sheet.FORMAT) sheets.push(importSheet(o));
    else if (isDDB(o)) out.push(convertDDB(o));
    else if (is5e(o)) out.push(convert5e(await resolveCopy(o)));
    else out.push(normCreature({...o, id: uid()}));
  }
  return [...sheets, ...out.map(c => upsertLibrary(c))];
}
function download(name, obj) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], {type: 'application/json'}));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
let fileMode = 'creatures';
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const obj = JSON.parse(await f.text());
    if (fileMode === 'all') {
      if (!confirm('Felülírja a jelenlegi könyvtárat és encountert. Folytatod?')) return;
      importBackup(obj); closeModal();
    } else {
      const res = await importAny(obj);
      openLib('lib');
      log(`📚 ${res.length} lény importálva: ${esc(res.map(c => c.name).join(', '))}`);
    }
  } catch (err) { alert('Hibás fájl: ' + err.message); }
});

function readEditor() {
  const fm = $('#edForm'), c = fm._base, v = n => fm.elements[n].value;
  for (const k of ['name', 'kind', 'cr', 'size', 'type', 'alignment', 'source', 'acNote', 'speed', 'skills', 'senses', 'languages', 'resist', 'immune', 'vuln', 'condImmune', 'notes']) c[k] = v(k);
  c.ac = +v('ac') || 10;
  c.hp = {...c.hp, max: +v('hpMax') || 1, formula: v('hpFormula')};
  c.initBonus = v('initBonus').trim() === '' ? null : parseInt(v('initBonus'));
  c.legendaryCount = +v('legendaryCount') || 0;
  c.portrait = v('portrait');
  c.inventory = textToInventory(v('inventory'), c.inventory);
  c.currency = {}; ['pp', 'gp', 'ep', 'sp', 'cp'].forEach(k => c.currency[k] = Math.max(0, +v('cur_' + k) || 0));
  c.tools = v('tools');
  ABIL.forEach(a => c.abilities[a] = +v('ab_' + a) || 10);
  c.saves = {};
  for (const m of v('saves').matchAll(/(str|dex|con|int|wis|cha)\w*\s*([+\-−]?\s*\d+)/gi)) c.saves[m[1].toLowerCase()] = parseInt(m[2].replace(/[−\s]/g, s => s === '−' ? '-' : ''));
  SECTIONS.forEach(k => c[k] = textToSection(v('sec_' + k)));
  if (fm.elements.shareVis) {
    c.owner = v('owner');
    c.share = {vis: v('shareVis'), hp: v('shareHp'), ac: v('shareAc') === '1'};
  }
  return normCreature(c);
}

// ---------- események ----------
document.addEventListener('click', async e => {
  const t = e.target;
  // Csapat nézet: titkos skill-dobás egy játékosnak
  const sk = t.closest('td.sk');
  if (sk) { partyRoll([sk.dataset.pc], sk.dataset.sk, e.shiftKey ? 'adv' : e.ctrlKey ? 'dis' : ''); return; }
  const th = t.closest('th.sortable');
  if (th) { setPartySort(th.dataset.sort, /^\d+$/.test(th.dataset.col) ? +th.dataset.col : th.dataset.col); rerenderParty(); return; }
  // dobások
  const r = t.closest('.roll');
  if (r) {
    const cidEl = r.closest('[data-cid]');
    const x = cidEl ? byId(cidEl.dataset.cid) : null;
    const who = x ? nameOf(x) : '';
    const label = r.closest('[data-label]')?.dataset.label || r.dataset.label || '';
    if (r.dataset.hit) rollHit(r.dataset.hit, who, label || 'Támadás', e.shiftKey ? 'adv' : e.ctrlKey ? 'dis' : '');
    else if (r.dataset.roll) rollDmg(r.dataset.roll, who, label || 'Dobás', e.shiftKey);
    else if (r.dataset.rech) {
      const d = rnd(6), ok = d >= +r.dataset.rech;
      log(`<span class="who">${esc(who)}</span> ${esc(label || 'Recharge')}: d6 = <b>${d}</b> — ${ok ? 'feltöltődött ✓' : 'nem töltődött'}`, ok ? 'crit' : '');
    }
    return;
  }
  const chk = t.closest('[data-check],[data-save]');
  if (chk) {
    const x = byId(chk.closest('[data-cid]')?.dataset.cid); if (!x) return;
    const sv = t.closest('[data-save]');
    if (sv) rollHit(sgn(+x.c.saves[sv.dataset.save]), nameOf(x), ABIL_FULL[sv.dataset.save] + ' mentő', e.shiftKey ? 'adv' : e.ctrlKey ? 'dis' : '');
    else { const a = chk.dataset.check; rollHit(sgn(mod(x.c.abilities[a])), nameOf(x), ABIL_FULL[a] + ' próba', e.shiftKey ? 'adv' : e.ctrlKey ? 'dis' : ''); }
    return;
  }
  if (t.dataset.die) { rollDmg(t.dataset.die, '', t.dataset.die.replace('1', '')); return; }
  if (t.dataset.tab) { libTab = t.dataset.tab; renderLib(); return; }

  const el = t.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  const x = byId(el.closest('[data-cid]')?.dataset.cid);
  const libEl = el.closest('[data-lib]'), lib = libEl && S.library.find(c => c.id === libEl.dataset.lib);
  const cnt = () => Math.max(1, +(el.closest('.lrow')?.querySelector('.cnt')?.value) || 1);

  switch (act) {
    case 'next': step(1); break;
    case 'prev': step(-1); break;
    case 'rollInit': openInitMenu(); break;
    case 'init': rollInitiative(el.dataset.mode); break;
    case 'openLib': openLib(); break;
    case 'menu': openMenu(); break;
    case 'rollCustom': { const v = $('#diceInput').value.trim(); if (v) rollDmg(v, '', v); break; }
    case 'select': selected = x.cid; render(); break;
    case 'deselect': selected = null; render(); break;
    case 'dmg': case 'heal': {
      const n = Math.abs(parseInt(el.closest('.tile').querySelector('.hpin').value));
      if (n > 0) { act === 'dmg' ? damage(x, n) : heal(x, n); save(); render(); }
      break;
    }
    case 'temp': {
      const n = parseInt(el.closest('.tile').querySelector('.hpin').value);
      if (n >= 0) { x.temp = n; log(`${esc(nameOf(x))}: ${n} temp HP`); save(); render(); }
      break;
    }
    case 'toggleConc': x.conc = !x.conc; save(); render(); break;
    case 'toggleDead': x.dead = !x.dead; save(); render(); break;
    case 'toggleSide': x.side = sideOf(x) === 'enemy' ? 'ally' : 'enemy'; save(); render(); break;
    case 'toggleHidden': x.hiddenP = !x.hiddenP; save(); render(); break;
    case 'openPlayer': window.open('player.html','dmscreen-player', 'popup,width=1280,height=800'); break;
    case 'openCharApp': window.open('karakter.html', '_blank'); break;
    case 'portraitUpload': $('#portraitFile').click(); break;
    case 'portraitClear': setPortrait(''); $('#portraitUrl').value = ''; break;
    case 'diffInfo': openDiffInfo(); break;
    case 'openLoot': openLoot(); break;
    case 'openParty': openParty(); break;
    case 'partyRemove': setPartyMember(el.dataset.pc, false); rerenderParty(); break;
    case 'partySortReset': partySort.s = {col: null, dir: 1}; rerenderParty(); break;
    case 'libParty': setPartyMember(lib.id, !partyMembers().some(c => c.id === lib.id)); filterLib(); break;
    case 'partyGroup': partyRoll(partyMembers().map(c => c.id), el.dataset.sk, e.shiftKey ? 'adv' : e.ctrlKey ? 'dis' : ''); break;
    case 'partyEdit': {
      const pcLib = S.library.find(c => c.id === el.dataset.pc);
      if (pcLib) openEditor(pcLib, c => { c.id = pcLib.id; upsertLibrary(c, false); setTimeout(openParty); }, undefined, {share: true});
      break;
    }
    case 'lootRoll': rollLootUi(); break;
    case 'lootCopy':
      try { await navigator.clipboard.writeText(lootText(lootResult)); el.textContent = '✓ Kimásolva'; }
      catch { el.textContent = 'A böngésző nem engedte'; }
      break;
    case 'lootLog': log('🎁 ' + esc(lootText(lootResult)).replace(/\n/g, '<br>')); el.textContent = '✓ Naplóban'; break;
    case 'dup': addToEncounter({...x.c, id: x.c.libId || x.c.id}, 1); break;
    case 'remove':
      if (confirm(`Eltávolítod: ${nameOf(x)}?`)) {
        if (S.enc.active === x.cid) step(1);
        S.enc.list = S.enc.list.filter(y => y !== x);
        if (S.enc.active === x.cid) S.enc.active = null;
        save(); render();
      }
      break;
    case 'rmCond': x.cond.splice(+el.dataset.i, 1); save(); render(); break;
    case 'leg': { const i = +el.dataset.i; x.leg = x.leg === i + 1 ? i : i + 1; save(); render(); break; }
    case 'addCond': {
      const name = $('#condSel').value || $('#condCustom').value.trim();
      if (!name) break;
      const rounds = parseInt($('#condRounds').value);
      x.cond.push({name, rounds: rounds > 0 ? rounds : null});
      save(); render(); break;
    }
    case 'editCombatant': {
      // a játékos app beállításai a karakterhez tartoznak, nem a harchoz: a könyvtári lényből jönnek, és oda azonnal vissza is íródnak
      const lib = S.library.find(l => l.id === x.c.libId);
      openEditor(lib ? {...x.c, owner: lib.owner, share: lib.share} : x.c, c => {
        const oldMax = x.c.hp.max;
        c.libId = x.c.libId; x.c = c;
        x.hp = x.hp === oldMax ? c.hp.max : Math.min(x.hp, c.hp.max);
        const l = S.library.find(l => l.id === c.libId);
        if (l && l.kind === c.kind) Object.assign(l, normCreature({...l, owner: c.owner, share: c.share}));
      }, 'Adatlap szerkesztése (csak ebben a harcban)', {share: true, shareNote: 'A játékos app beállításai a karakterhez tartoznak: a könyvtárban is azonnal érvényesek.'});
    }
      break;
    case 'saveToLib': {
      const c = structuredClone(x.c);
      c.id = c.libId && S.library.some(l => l.id === c.libId) ? c.libId : uid();
      if (c.kind === 'pc') c.hp.cur = x.hp;
      const saved = upsertLibrary(c);
      x.c.libId = saved.id;
      log(`📚 ${esc(saved.name)} elmentve a könyvtárba`); save();
      break;
    }
    case 'newCreature': openEditor(blankCreature(), c => { upsertLibrary(c, false); log(`📚 ${esc(c.name)} létrehozva`); }, 'Új lény', {share: true}); break;
    case 'edSave': {
      const ow = $('#edForm').elements.owner?.value.trim();
      if (ow && $('#edForm').elements.kind.value === 'pc' && !EMAIL_RE.test(ow.toLowerCase())) { alert('A játékos Google-fiókja nem érvényes e-mail-cím.'); break; }
      const c = readEditor(); const cb = editCb; closeModal(); cb && cb(c); save(); render(); break; }
    case 'edCancel': closeModal(); break;

    // könyvtár
    case 'libAdd': addToEncounter(lib, cnt()); log(`＋ ${cnt()}× ${esc(lib.name)}`); break;
    case 'libEdit': openEditor(lib, c => { c.id = lib.id; upsertLibrary(c, false); setTimeout(() => openLib('lib')); }, undefined, {share: true}); break;
    case 'libExport': download(lib.name.replace(/[^\wáéíóöőúüű -]/gi, '') + '.json', SHEETS[lib.id] || lib); break;
    case 'libDel':
      if (confirm(`Törlöd a könyvtárból: ${lib.name}?${SHEETS[lib.id] ? '\nA telefonos karakterlapja is törlődik (a felhős biztonsági mentésekből visszahozható).' : ''}`)) {
        if (SHEETS[lib.id]) sheetOps.del.add(lib.id);
        S.library = S.library.filter(c => c !== lib); save(); filterLib();
      }
      break;
    case 'libSheet':
      if (SHEETS[lib.id]) window.open('karakter.html#lap/' + lib.id, '_blank');
      else if (confirm(`Telefonos karakterlapot hozol létre ${lib.name} számára a könyvtári adatokból?\nEzután a lap a játékosé: amit a telefonján átír, az ide is átjön. Az osztályt, spell slotokat érdemes a lapon ellenőrizni.`)) {
        createSheet(lib.id, creatureToSheet(lib)); filterLib(); log(`📱 ${esc(lib.name)}: karakterlap létrehozva`);
      }
      break;
    case 'rulebook': openRulebook(); break;
    case 'rbUpdate': el.disabled = true; await rulebookUpdate(); el.disabled = false; break;
    case 'itemAdd': {
      const it = itemResults[+el.closest('[data-item]').dataset.item], to = $('#itemTo')?.value;
      const c = it && to && addItemTo(to, it, cnt());
      if (c) { el.textContent = '✓ ' + c.name; log(`🗡 ${cnt()}× ${esc(it.n)} → ${esc(c.name)}`); }
      break;
    }
    case 'downloadSheetTemplate': download('karakterlap-sablon.json', Sheet.TEMPLATE); break;
    case 'showSheetTemplate': $('#jsonIn').value = JSON.stringify(Sheet.TEMPLATE, null, 2); break;
    case 'addAllPcs': {
      const pcs = S.library.filter(c => c.kind === 'pc' && !S.enc.list.some(x => x.c.libId === c.id));
      pcs.forEach(c => addToEncounter(c, 1));
      log(`＋ ${pcs.length} játékos hozzáadva`); closeModal(); break;
    }
    case 'fiveSearch': fiveSearch(); break;
    case 'fiveAdd': case 'fiveSave': {
      const m = fiveResults[+el.closest('[data-five]').dataset.five];
      const c = convert5e(await resolveCopy(structuredClone(m)));
      if (act === 'fiveAdd') { addToEncounter(c, cnt()); log(`＋ ${cnt()}× ${esc(c.name)}`); }
      else { upsertLibrary(c); el.textContent = '✓ Mentve'; }
      break;
    }
    case 'ddbPasteImport': ddbImportText($('#ddbPaste').value); break;
    case 'ddbClipboard':
      try { ddbImportText(await navigator.clipboard.readText()); }
      catch { $('#ddbMsg').innerHTML = '<p class="muted">A böngésző nem engedte olvasni a vágólapot – kattints a mezőbe, és nyomj Ctrl+V-t.</p>'; }
      break;
    case 'signIn': window.DMAuth?.signIn(); break;
    case 'signOut': closeModal(); window.DMAuth?.signOut(); break;
    case 'reload': location.reload(); break;
    case 'jsonImport':
      try {
        const res = await importAny(JSON.parse($('#jsonIn').value));
        $('#jsonMsg').textContent = `✓ ${res.length} lény importálva: ${res.map(c => c.name).join(', ')}`;
      } catch (err) { $('#jsonMsg').textContent = '⚠ ' + err.message; }
      break;
    case 'showTemplate': $('#jsonIn').value = JSON.stringify(TEMPLATE, null, 2); break;
    case 'downloadTemplate': download('dmscreen-sablon.json', TEMPLATE); break;
    case 'importFile': fileMode = 'creatures'; $('#fileIn').click(); break;
    case 'encSave': {
      const list = S.enc.list.filter(y => y.c.kind !== 'pc').map(y => y.c);
      if (!list.length) { alert('Nincs nem-játékos lény az encounterben.'); break; }
      S.saved.push({id: uid(), name:$('#encName').value.trim() || 'Encounter ' + (S.saved.length + 1), list: structuredClone(list)});
      save(); renderLib(); break;
    }
    case 'encLoad': {
      const enc = S.saved[+el.closest('[data-enc]').dataset.enc];
      const groups = {};
      enc.list.forEach(c => (groups[c.name] = groups[c.name] || []).push(c));
      Object.values(groups).forEach(g => addToEncounter(g[0], g.length));
      log(`⚔ ${esc(enc.name)} betöltve`); closeModal(); break;
    }
    case 'encDel': if (confirm('Törlöd ezt a mentett encountert?')) { S.saved.splice(+el.closest('[data-enc]').dataset.enc, 1); save(); renderLib(); } break;

    // menü
    case 'newFight':
      S.enc.list = S.enc.list.filter(y => y.c.kind === 'pc');
      S.enc.list.forEach(y => { y.init = null; y.cond = []; y.conc = false; y.leg = 0; });
      S.enc.round = 1; S.enc.active = null; selected = null;
      log('— Új harc —', 'round'); closeModal(); save(); render(); break;
    case 'clearAll':
      if (confirm('Mindenkit eltávolítasz az encounterből?')) { S.enc = {list: [], round: 1, active: null}; selected = null; closeModal(); save(); render(); }
      break;
    case 'exportAll':
      S.settings.lastExport = localDate();
      download(`dmscreen-mentes-${localDate()}.json`, {...S, sheets: sheetList()});
      save(); render(); break;
    case 'openBackups': openBackups(); break;
    case 'backupNow':
      try { if (await addBackup(timeStamp() + '-kezi', 'kézi mentés')) log('💾 Biztonsági mentés elkészült a felhőben'); }
      catch (err) { backupWarn = 'Nem sikerült a mentés (' + (err.code || err.message) + ').'; }
      openBackups(); break;
    case 'backupRestore': {
      const id = el.closest('[data-backup]').dataset.backup;
      if (!confirm('Visszaállítod ezt a mentést? A mostani állapotról előbb automatikusan mentés készül.')) break;
      try { await restoreBackup(id); closeModal(); log('↺ Biztonsági mentés visszaállítva'); }
      catch (err) { alert('A visszaállítás nem sikerült: ' + (err.code || err.message)); }
      break;
    }
    case 'importAll': fileMode = 'all'; $('#fileIn').click(); break;
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.setting) { S.settings[t.dataset.setting] = t.checked; save(); return; }
  if (t.dataset.src) {
    const s = new Set(S.settings.sources);
    t.checked ? s.add(t.dataset.src) : s.delete(t.dataset.src);
    S.settings.sources = [...s]; save(); return;
  }
  if (t.id === 'libKind') { filterLib(); return; }
  if (t.id === 'partyAddSel') { if (t.value) { setPartyMember(t.value, true); rerenderParty(); } return; }
  const x = byId(t.closest('[data-cid]')?.dataset.cid);
  if (!x) return;
  if (t.classList.contains('init')) { x.init = t.value === '' ? null : +t.value; save(); render(); return; }
  const f = t.dataset.f;
  if (!f || f === 'notes') return;
  if (f === 'conc') x.conc = t.checked;
  else if (f === 'init') x.init = t.value === '' ? null : +t.value;
  else if (f === 'hp') { x.hp = Math.max(0, +t.value || 0); x.dead = x.hp === 0 && x.c.kind !== 'pc'; }
  else if (f === 'max') x.c.hp.max = Math.max(1, +t.value || 1);
  else if (f === 'temp') x.temp = Math.max(0, +t.value || 0);
  else if (f === 'ac') x.c.ac = +t.value || 0;
  else if (f === 'side') x.side = t.value;
  else if (f === 'hiddenP') x.hiddenP = t.checked;
  else if (f === 'pubName') x.publicName = t.value.trim();
  save(); render();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'libSearch') filterLib();
  if (t.id === 'itemQ') filterItems();
  if (t.id === 'partySearch') filterPartyItems(t.value);
  if (t.dataset.f === 'notes') { const x = byId(t.closest('[data-cid]')?.dataset.cid); if (x) { x.notes = t.value; save(); } }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Escape') { if (!$('#modal').hidden) closeModal(); else if (selected) { selected = null; render(); } return; }
  if (t.classList?.contains('hpin') && e.key === 'Enter') {
    const x = byId(t.closest('[data-cid]').dataset.cid), n = parseInt(t.value);
    if (n > 0) damage(x, n); else if (n < 0) heal(x, -n);
    if (n) { save(); render(); }
    return;
  }
  if (t.id === 'diceInput' && e.key === 'Enter') { const v = t.value.trim(); if (v) rollDmg(v, '', v); return; }
  if (t.id === 'fiveQ' && e.key === 'Enter') { fiveSearch(); return; }
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || !$('#modal').hidden) return;
  if (e.key === 'n' || e.key === 'N' || e.key === ' ') { e.preventDefault(); step(1); }
  else if (e.key === 'p' || e.key === 'P') { e.preventDefault(); step(-1); }
});

// beillesztéskor magától importál
document.addEventListener('paste', e => {
  if (e.target.id !== 'ddbPaste') return;
  const t = e.clipboardData?.getData('text');
  if (t && t.trim().startsWith('{')) { e.preventDefault(); ddbImportText(t); }
});

// ---------- indulás ----------
render();
</script>

<script src="firebase-config.js"></script>
<script type="module">
// Firebase: Google-belépés + Firestore (saját projekt; ki mit érhet el: firestore.rules)
const V = '10.12.2';
const cfg = window.FIREBASE_CONFIG;
// ?test = automata tesztek (tests/): helyi mód, a felhőhöz nem nyúl
if (!cfg || !cfg.apiKey || location.protocol === 'file:' || new URLSearchParams(location.search).has('test')) {
  window.DMApp.setAuth({status: 'unconfigured'});
} else {
  try {
    const {initializeApp} = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const A = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
    const F = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
    const app = initializeApp(cfg);
    const auth = A.getAuth(app);
    const fs = F.initializeFirestore(app, {localCache: F.persistentLocalCache({tabManager: F.persistentMultipleTabManager()})});
    const db = {
      get: async p => { const s = await F.getDoc(F.doc(fs, p)); return s.exists() ? s.data() : null; },
      list: async p => (await F.getDocs(F.collection(fs, p))).docs.map(d => ({...d.data(), id: d.id})),
      set: (p, d) => F.setDoc(F.doc(fs, p), d),
      update: (p, d) => F.updateDoc(F.doc(fs, p), d),  // mezőnként (pl. 'hp.cur'), a többi mezőhöz nem nyúl
      del: p => F.deleteDoc(F.doc(fs, p)),
      watch: (col, cb, err) => F.onSnapshot(F.collection(fs, col), s => cb(s.docs.map(d => ({...d.data(), id: d.id}))), err),
    };
    const provider = new A.GoogleAuthProvider();
    provider.setCustomParameters({prompt: 'select_account'});
    window.DMAuth = {
      async signIn() {
        try { await A.signInWithPopup(auth, provider); }
        catch (e) {
          if (e.code === 'auth/popup-blocked') return A.signInWithRedirect(auth, provider);
          if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request')
            window.DMApp.setAuth({status: 'signedOut', error: 'A belépés nem sikerült (' + e.code + ').'});
        }
      },
      signOut: () => A.signOut(auth),
      email: () => auth.currentUser?.email || '',
    };
    A.onAuthStateChanged(auth, u => window.DMApp.setAuth(u ? {status: 'signedIn', email: u.email, db} : {status: 'signedOut'}));
  } catch (e) {
    // nincs internet a legelső betöltéskor: helyi mód
    window.DMApp.setAuth({status: 'unconfigured'});
  }
}
</script>
