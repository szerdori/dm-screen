<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DM Screen</title>
<link rel="icon" href="favicon.ico">
<style>
:root{
  --bg:#121418; --panel:#1b1e24; --panel2:#232730; --line:#323744; --text:#e7e7e9; --muted:#9097a3;
  --accent:#e2a63b; --red:#d9534f; --orange:#e08a2e; --green:#4caf6a; --blue:#4a8fe0;
  --pc:#4a8fe0; --npc:#4caf6a; --mon:#c9483f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 "Segoe UI",system-ui,sans-serif}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:600}
button.small{padding:2px 7px;font-size:12px}
button.on{background:var(--accent);color:#1a1405}
input,select,textarea{font:inherit;color:var(--text);background:#0f1115;border:1px solid var(--line);border-radius:5px;padding:4px 6px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{width:100%;resize:vertical}
input[type=number]{width:64px}
.muted{color:var(--muted)} .pad{padding:14px}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);height:52px}
.brand{font-weight:700;color:var(--accent);font-size:16px;margin-right:6px}
.round{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
.round b{color:var(--accent);font-size:16px}
.grow{flex:1} .sep{width:1px;height:26px;background:var(--line);margin:0 4px}
#saveState{color:var(--muted);font-size:12px}
main{display:flex;height:calc(100% - 52px)}
#board{flex:1;overflow:auto;padding:12px}
#tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;align-items:start}
#side{width:440px;min-width:360px;border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
#detail{flex:1;overflow:auto}
#dice{border-top:1px solid var(--line);height:260px;display:flex;flex-direction:column}
.dicebar{display:flex;gap:4px;padding:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.dicebar input{width:110px}
#log{flex:1;overflow:auto;padding:4px 8px;font-size:13px}
.le{padding:3px 0;border-bottom:1px solid #20242b}
.le .who{color:var(--muted)} .le b{font-size:15px}
.le.crit b{color:var(--green)} .le.fumble b{color:var(--red)}
.le.turn{color:var(--accent);font-weight:600} .le.warn{color:var(--orange)} .le.round{color:var(--accent);text-align:center;font-weight:700}
.empty{grid-column:1/-1;text-align:center;padding:60px;color:var(--muted)}
.empty button{margin-top:12px}

.tile{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--mon);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px}
.tile.ally{border-left-color:var(--npc)} .tile.ally.k-pc{border-left-color:var(--pc)}
.sidebtn{font-size:11px;padding:1px 7px;border-radius:10px}
.sidebtn.enemy{background:#4a1f1d;border-color:var(--mon)} .sidebtn.ally{background:#1d3d25;border-color:var(--npc)}
#diff{font-weight:600}
.d-trivial{color:var(--muted)} .d-easy{color:var(--green)} .d-medium{color:#e8d34a} .d-hard{color:var(--orange)} .d-deadly{color:#fff;background:#7a1c1c;border-color:var(--red)}
table.dt{border-collapse:collapse;width:100%;margin:6px 0 12px;font-size:13px}
table.dt th,table.dt td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
table.dt td.n,table.dt th.n{text-align:right}
table.dt tr.hl td{color:var(--accent);font-weight:700}
.tile.active{box-shadow:0 0 0 2px var(--accent);background:#262318}
.tile.selected{outline:1px dashed var(--muted);outline-offset:2px}
.tile.dead{opacity:.45}
.t-head{display:flex;align-items:center;gap:6px}
.t-head .init{width:48px;font-weight:700;text-align:center;font-size:16px}
.t-name{flex:1;font-weight:600;font-size:15px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-name small{color:var(--muted);font-weight:400;font-size:12px}
.ac{background:var(--panel2);border:1px solid var(--line);border-radius:12px 12px 16px 16px;padding:2px 8px;font-weight:700}
.hpbar{position:relative;height:20px;background:#0d0f12;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.hpbar .fill{position:absolute;inset:0 auto 0 0;background:var(--green)}
.hpbar.mid .fill{background:var(--orange)} .hpbar.low .fill{background:var(--red)}
.hpbar .tmp{position:absolute;inset:0 0 0 auto;background:#5b7fbf88}
.hpbar span{position:relative;display:block;text-align:center;font-weight:700;font-size:13px;line-height:18px;text-shadow:0 1px 2px #000}
.hp-ctl{display:flex;gap:4px} .hp-ctl input{flex:1;width:auto;min-width:0}
.hp-ctl button{flex:none;padding:4px 9px}
.hp-ctl .dmg{background:#4a1f1d} .hp-ctl .heal{background:#1d3d25}
.conds{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:#3a2f4d;border-radius:10px;padding:1px 8px;font-size:12px;cursor:pointer}
.chip.conc{background:#28466b}
.chip:hover{text-decoration:line-through}
.atks{display:flex;flex-direction:column;gap:2px;font-size:13px}
.atk{display:flex;gap:4px;align-items:baseline;flex-wrap:wrap}
.atk .an{color:#cfd3da;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.atk .tag{color:var(--accent);font-size:11px;font-weight:700}
.other{font-size:12px;color:var(--muted)}
.t-foot{display:flex;align-items:center;gap:4px}
.pips{display:flex;gap:3px;align-items:center;font-size:11px;color:var(--muted)}
.pip{width:13px;height:13px;border-radius:50%;border:1px solid var(--accent);cursor:pointer}
.pip.used{background:transparent} .pip.free{background:var(--accent)}

.roll{color:var(--accent);border-bottom:1px dotted var(--accent);cursor:pointer;white-space:nowrap;font-weight:600}
.roll:hover{background:#3a2f15}
.roll.hit{color:#7fc4ff;border-color:#7fc4ff}

/* statblock */
.sb{padding:12px 14px}
.sb h2{margin:0;color:var(--accent);font-size:20px}
.sb .sub{color:var(--muted);font-style:italic;margin-bottom:8px}
.sb h3{margin:14px 0 4px;color:var(--accent);border-bottom:1px solid var(--line);font-size:15px;padding-bottom:2px}
.sb p{margin:4px 0}
.sb .line b{color:#cfd3da}
.abil{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:8px 0;text-align:center}
.abil div{background:var(--panel2);border-radius:6px;padding:4px 0;cursor:pointer}
.abil div:hover{outline:1px solid var(--accent)}
.abil small{display:block;color:var(--muted);font-size:11px}
.abil .sv{font-size:11px;color:#7fc4ff}
.ctl{background:var(--panel2);margin:10px 14px;padding:10px;border-radius:8px;display:flex;flex-direction:column;gap:8px}
.ctl .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctl label{color:var(--muted);font-size:12px}

/* modal */
#gate{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;font-size:18px;color:var(--muted);line-height:1.8}
#gate[hidden]{display:none}
#gate button{margin-top:14px;font-size:16px;padding:8px 18px}
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-start;justify-content:center;padding:30px;z-index:10}
#modal[hidden]{display:none}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(980px,100%);max-height:calc(100vh - 60px);overflow:auto;padding:16px}
.modal-box.wide{width:min(1500px,100%)}
/* Csapat nézet */
.ptable{border-collapse:collapse;width:100%;font-size:13px;margin:4px 0 14px}
.ptable th,.ptable td{border-bottom:1px solid var(--line);padding:4px 8px;text-align:center;white-space:nowrap}
.ptable th:first-child,.ptable td:first-child{text-align:left}
.ptable td.best{color:var(--accent);font-weight:700}
.ptable td.sk{cursor:pointer} .ptable td.sk:hover{background:#3a2f15}
.ptable th.sortable{cursor:pointer;user-select:none} .ptable th.sortable:hover{color:var(--accent)}
.ptable .ab{color:var(--muted);font-size:11px}
.pmark{font-size:10px;color:var(--muted);margin-left:2px}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.pcard{background:var(--panel2);border-radius:8px;padding:10px}
.pcard h3{margin:0 0 4px;color:var(--accent);display:flex;align-items:center;gap:8px}
.pcard h4{margin:8px 0 2px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.inv{list-style:none;margin:0;padding:0;font-size:13px}
.inv li{padding:1px 0}
.inv .mag{color:#c9a0ff} .inv .flag{font-size:11px;color:var(--accent);margin-left:4px} .inv .note{color:var(--muted);font-size:11px}
#partyRoll{min-height:22px;margin:6px 0}
.modal-box h2{margin:0 0 10px;color:var(--accent)}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tabs button.on{background:var(--accent);color:#1a1405}
.rows{display:flex;flex-direction:column;gap:4px}
.lrow{display:flex;align-items:center;gap:8px;background:var(--panel2);padding:6px 8px;border-radius:6px}
.lrow .nm{flex:1} .lrow .nm small{color:var(--muted);margin-left:6px}
.lrow input[type=number]{width:52px}
.srcs{display:flex;flex-wrap:wrap;gap:4px 12px;max-height:120px;overflow:auto;background:#0f1115;padding:8px;border-radius:6px;border:1px solid var(--line);font-size:12px}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.form label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:2px}
.form label input,.form label select{width:100%}
.form .w2{grid-column:span 2} .form .w4{grid-column:1/-1} .form [hidden]{display:none}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.hint{font-size:12px;color:var(--muted)}
@media (max-width:1200px){#side{width:340px;min-width:300px}}
.kbd{border:1px solid var(--line);border-radius:3px;padding:0 4px;font-size:11px}
.av{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none;border:1px solid var(--line);background:var(--panel2)}
.sb .portrait{float:right;width:110px;height:110px;border-radius:10px;object-fit:cover;margin:0 0 8px 10px;border:1px solid var(--line)}
.tile.hiddenp{border-style:dashed;opacity:.75}
.tile.hiddenp .t-name::after{content:" 🙈";font-size:12px}
.pv{width:72px;height:72px;border-radius:10px;object-fit:cover;border:1px solid var(--line);background:var(--panel2)}
</style>
</head>
<body>
<header>
  <div class="brand">⚔ DM Screen</div>
  <div class="round">Kör <b id="roundNo">1</b></div>
  <button id="diff" data-act="diffInfo" title="Encounter nehézsége (DMG 2014) – kattints a részletekért">–</button>
  <button data-act="prev" title="Előző (P)">◀</button>
  <button class="primary" data-act="next" title="Következő (N vagy Szóköz)">Következő ▶</button>
  <button data-act="rollInit">🎲 Initiative</button>
  <button data-act="openLoot" title="Zsákmány a legyőzött ellenfelek alapján (DMG 2014 kincstáblák)">🎁 Loot</button>
  <button data-act="openParty" title="Harcon kívül: a játékosok passzív értékei, skilljei, felszerelése és pénze">👥 Csapat</button>
  <span class="sep"></span>
  <button data-act="openLib">＋ Hozzáadás / Könyvtár</button>
  <button data-act="newCreature">✎ Új lény</button>
  <button data-act="openPlayer" title="Külön ablakban megnyitja a játékosoknak szánt képernyőt – húzd át a másik monitorra, és nyomj F11-et">📺 Játékos képernyő</button>
  <button data-act="openCharApp" title="Új lapon megnyitja a játékosok telefonos karakterlapját (karakter.html) – ezt a címet küldd el a játékosoknak">📱 Karakterlap</button>
  <span class="grow"></span>
  <button id="backupNag" data-act="exportAll" hidden title="Biztonsági másolat letöltése a gépedre (a felhőtől független)" style="border-color:var(--orange);color:var(--orange)"></button>
  <span id="saveState"></span>
  <button data-act="menu">⋯ Menü</button>
</header>
<main>
  <section id="board"><div id="tiles"></div></section>
  <aside id="side">
    <div id="detail"></div>
    <div id="dice">
      <div class="dicebar">
        <input id="diceInput" placeholder="pl. 2d6+3">
        <button data-act="rollCustom">Dob</button>
        <button class="small" data-die="1d4">d4</button><button class="small" data-die="1d6">d6</button>
        <button class="small" data-die="1d8">d8</button><button class="small" data-die="1d10">d10</button>
        <button class="small" data-die="1d12">d12</button><button class="small" data-die="1d20">d20</button>
        <button class="small" data-die="1d100">d%</button>
        <span class="hint" style="width:100%">Kattints a színes számokra · Shift+kattintás: előny / kritikus · Ctrl+kattintás: hátrány</span>
      </div>
      <div id="log"></div>
    </div>
  </aside>
</main>
<div id="modal" hidden><div class="modal-box" id="modalBox"></div></div>
<div id="gate"><div>Betöltés…</div></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script src="kozos.js?v=3"></script>
<script src="sheet.js?v=6"></script>
<script src="szerzodes.js?v=1"></script>
<script src="js/adat/tar.js?v=1"></script>
<script src="js/logika/alap.js?v=1"></script>
<script src="js/logika/harc.js?v=1"></script>
<script src="js/logika/nehezseg.js?v=1"></script>
<script src="js/logika/loot.js?v=1"></script>
<script src="js/logika/csapat.js?v=1"></script>
<script src="js/logika/import-5etools.js?v=1"></script>
<script src="js/logika/import-ddb.js?v=1"></script>
<script src="js/logika/import-json.js?v=1"></script>
<script>
'use strict';
// a közös fájlok várt változata (= a <script src> ?v= száma; régi, gyorsítótárazott példánynál a lapokra nem írunk – syncSheets)
const VART_MODULOK = {kozos: 3, sheet: 6, szerzodes: 1, tar: 1, alap: 1, harc: 1, nehezseg: 1, loot: 1, csapat: 1, 'import-5etools': 1, 'import-ddb': 1, 'import-json': 1};
let libTab = 'lib';

// ---------- mentés: Firebase (Firestore), plusz másolat a böngészőben ----------
// A felhőbe a Tar (js/adat/tar.js) ír: állapot (encounter + beállítások), könyvtár, mentett encounterek, és a játékos appnak
// a karakterek nyilvános része meg a játékosok e-mailjei. Az útvonalak és a formák: szerzodes.js / SZERZODES.md.
// Mindig csak a megváltozott dokumentumokat írjuk.
let saveTimer = null, authInfo = {status: 'loading'};
const emptySaved = () => ({state: '', lib: {}, saved: {}, pub: {}, players: '[]'});
let lastSaved = emptySaved();
const setSaveState = t => $('#saveState').textContent = t;
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(doSave, 400); }
function ensureIds() { S.saved.forEach(e => { if (!e.id) e.id = uid(); }); }
// kulcssorrendtől független JSON (a Firestore más sorrendben adja vissza a mezőket)
const stableJson = v => JSON.stringify(v, (k, x) => isObj(x) ? Object.fromEntries(Object.keys(x).sort().map(n => [n, x[n]])) : x);
// egy gyűjtemény (Tar.konyvtar, Tar.mentett, Tar.karakterek) szinkronja: csak a változott és a törölt dokumentumok
function syncCol(gyujt, arr, key, ops, ser = JSON.stringify) {
  const seen = {}, prev = lastSaved[key] || {};
  for (const it of arr) {
    const j = ser(it); seen[it.id] = j;
    if (prev[it.id] !== j) ops.push(gyujt.ir(it.id, JSON.parse(j)));
  }
  for (const id of Object.keys(prev)) if (!(id in seen)) ops.push(gyujt.torol(id));
  lastSaved[key] = seen;
}
// ---------- játékos app: ami a játékosok telefonján látszik ----------
// a karakter nyilvános része (characters/{id}) a könyvtárból: js/adat/tar.js (Tar.karakterek.nyilvanosResz)
const hpStatus = Sheet.hpStatus;  // ma csak a tesztek használják (W.hpStatus)
function publicChars() { return Tar.karakterek.nyilvanosResz(S.library); }
const playerEmails = () => [...new Set(S.library.filter(c => c.owner).map(c => c.owner))].sort();
function syncSharing(ops) {
  syncCol(Tar.karakterek, publicChars(), 'pub', ops, stableJson);
  const pl = JSON.stringify(playerEmails());
  if (pl !== lastSaved.players) { ops.push(Tar.jatekosok.ir(JSON.parse(pl))); lastSaved.players = pl; }
}
const sharingDirty = () => { const now = publicChars(), prev = lastSaved.pub || {};
  return JSON.stringify(playerEmails()) !== lastSaved.players || now.length !== Object.keys(prev).length || now.some(p => prev[p.id] !== stableJson(p)); };

// ---------- telefonos karakterlapok (sheets/{könyvtár-id}, formátum: sheet.js) ----------
// A lap a játékosé: a telefonján írja, a DM Screen élőben figyeli, és a könyvtári lényt + a harcban lévő példányát frissíti belőle.
// Fordítva: amit a DM itt átír (HP a harcban; név, AC, HP, képességek, felszerelés, pénz, gazda a szerkesztőben), az mezőnként
// visszaíródik a lapra. Hogy melyik oldal változott, azt a „shadow” dönti el: a legutóbb egyeztetett értékek másolata.
let SHEETS = {}, shadow = {}, cshadow = {}, sheetOps = {set: new Set(), del: new Set()}, sheetUnsub = null, sheetsWarn = '';
const LINK = {name: 'name', portrait: 'portrait', owner: 'owner', ac: 'ac', hpMax: 'hp.max', hpCur: 'hp.cur', speed: 'speed', abilities: 'abilities', inventory: 'inventory', currency: 'currency'};
const linkFields = c => ({name: c.name, portrait: c.portrait || '', owner: c.owner || '', ac: c.ac, hpMax: c.hp.max, hpCur: c.hp.cur ?? c.hp.max,
  speed: c.speed, abilities: c.abilities, inventory: Sheet.normInventory(c.inventory), currency: c.currency});
// a harcbeli példány lappal egyeztetett része: HP, temp, koncentráció, állapotok (az „Exhaustion” a lapon szint, az nem megy át)
const syncedConds = list => list.map(k => k.name ?? k).filter(n => n && n !== 'Exhaustion');
const hpShadow = x => JSON.stringify([x.hp, x.temp, !!x.conc, syncedConds(x.cond)]);
// a lap állapotai a harcbeli példányra; a DM által megadott körszám név szerint megmarad, a csak harcbeli „Exhaustion” is
const condsFromSheet = (s, old = []) => [...s.conditions.map(n => ({name: n, rounds: old.find(k => k.name.toLowerCase() === n.toLowerCase())?.rounds ?? null})),
  ...old.filter(k => k.name === 'Exhaustion')];
function sheetToCreature(s, base) {
  const H = Sheet;
  // szabálymotoros lapnál a mentők és a skillek a cache-ből (abban már benne van pl. az Aura of Protection, a Remarkable Athlete);
  // a nem jártas mentő is kiíródik, ha eltér a sima módosítótól
  const cache = s.auto ? s.cache : null;
  const saves = {}; ABIL.forEach(a => {
    const v = cache?.saves?.[a] ?? H.saveBonus(s, a);
    if (s.saveProf.includes(a) || (cache?.saves?.[a] != null && v !== mod(s.abilities[a]))) saves[a] = v;
  });
  const skillMods = {}; for (const k of Object.keys(SKILLS)) skillMods[k] = {b: cache?.skills?.[k] ?? H.skillBonus(s, k), p: H.skillProfOf(s, k)};
  const actions = s.attacks.map(a => {
    const hit = a.hit.trim() ? sgn(parseInt(a.hit.replace('−', '-')) || 0) : '';
    return {name: a.name, text: [hit ? `Attack: ${hit} to hit.` : '', a.dmg ? `Hit: ${a.dmg}.` : '', a.note].filter(Boolean).join(' ')};
  });
  const traits = s.features.map(f => ({name: f.name, text: f.text.slice(0, 600)}));
  if (s.resources.length) traits.unshift({name: 'Erőforrások', text: s.resources.map(r => `${r.name}: ${r.max - r.used}/${r.max}`).join(', ')});
  if (s.spells.length) {
    const dc = H.spellDc(s), by = {};
    s.spells.forEach(sp => (by[sp.level] = by[sp.level] || []).push(sp.name + (sp.level && !sp.prepared && !sp.always ? ' (nincs felkészítve)' : '')));
    traits.unshift({name: 'Varázslatok', text: [dc ? `spell save DC ${dc}, ${sgn(H.spellAtk(s))} to hit` : '',
      ...Object.keys(by).sort((a, b) => a - b).map(l => `${l == 0 ? 'Cantrips' : ordinal(+l) + ' level'}: ${by[l].join(', ')}`)].filter(Boolean).join('\n')});
  }
  // az AC és a speed az aktív hatásokkal (Mage Armor, Haste, Grappled…) együtt; a hatások a lap állapotai között vannak
  const fx = H.effects(s);
  return normCreature({...base, kind: 'pc', name: s.name, portrait: s.portrait, cr: 'Szint ' + H.level(s),
    type: [s.race, H.classLabel(s)].filter(Boolean).join(' — '), alignment: s.alignment, ac: fx.ac,
    acNote: [s.acNote, fx.acParts.length ? '+ ' + fx.acParts.join(', ') : ''].filter(Boolean).join(' '),
    hp: {max: s.hp.max, cur: s.hp.cur, formula: ''}, speed: fx.speed, abilities: s.abilities, saves, skillMods,
    skills: Object.keys(SKILLS).filter(k => s.skillProf[k]).map(k => skillLabel(k) + ' ' + sgn(skillMods[k].b)).join(', '),
    senses: [s.senses, `passive Perception ${H.passive(s, 'perception')}`].filter(Boolean).join(', '),
    languages: s.profs.languages, tools: s.profs.tools, resist: [s.resist, fx.resist].filter(Boolean).join(', '), initBonus: H.initiative(s),
    traits, actions, bonusActions: [], reactions: [], inventory: s.inventory, currency: s.currency,
    passiveBonus: {perception: 0, investigation: 0, insight: 0}, source: 'Karakterlap'});

// a lapról a könyvtárba és a harcban lévő példány(ok)ba; a gazdát mindig a DM állítja, az nem jön a lapról
function applySheet(id) {
  const s = SHEETS[id], i = S.library.findIndex(c => c.id === id);
  if (!s || i < 0) return;
  const lib = sheetToCreature(s, S.library[i]);
  S.library[i] = lib; shadow[id] = stableJson(linkFields(lib));
  for (const x of S.enc.list) if (x.c.libId === id) {
    const c = sheetToCreature(s, x.c); delete c.hp.cur; x.c = c;
    x.hp = s.hp.cur; x.temp = s.hp.temp; x.conc = !!s.concentration; x.cond = condsFromSheet(s, x.cond); cshadow[x.cid] = hpShadow(x);
  }
}
const setPath = (o, path, v) => { const ks = path.split('.'); ks.slice(0, -1).reduce((a, k) => a[k] = a[k] || {}, o)[ks.at(-1)] = v; };
// a DM oldali változások visszaírása a lapokra (doSave hívja; internet nélkül is lefut, ilyenkor csak helyben)
function syncSheets(ops) {
  // a böngésző gyorsítótárából régi közös fájl (sheet.js, kozos.js) jött: a lapokra nem írunk, amíg az oldal nem frissül (a könyvtári változás megmarad)
  if (regiFajl()) { if (!syncSheets.warned) log('⚠ Az oldal egy része régi változatból töltődött be: frissítsd (Ctrl + F5), addig a karakterlapokra nem írok.'); syncSheets.warned = true; return; }
  const now = new Date().toISOString(), by = authInfo.email || 'DM';
  for (const id of sheetOps.del) { delete SHEETS[id]; delete shadow[id]; if (Tar.kapcsolva()) ops.push(Tar.lapok.torol(id)); }
  sheetOps.del.clear();
  for (const c of S.library) {
    const s = SHEETS[c.id]; if (!s || c.kind !== 'pc') continue;
    const patch = {};
    for (const x of S.enc.list) if (x.c.libId === c.id) {
      // most került harcba: a lap értékeihez mérjük (a hozzáadáskor onnan kapta a HP-t)
      const prev = cshadow[x.cid] ?? JSON.stringify([s.hp.cur, s.hp.temp, !!s.concentration, syncedConds(s.conditions)]);
      const [ph, pt, pc, pk] = JSON.parse(prev);
      if (ph !== x.hp || pt !== x.temp) { patch['hp.cur'] = Math.min(x.hp, s.hp.max); patch['hp.temp'] = x.temp; c.hp.cur = patch['hp.cur']; }
      // a DM a harcban tett fel / vett le állapotot (vagy lejárt a körszáma): a lapra is, ott a hatása is érvényesül
      let conds = JSON.stringify(pk) !== JSON.stringify(syncedConds(x.cond)) ? syncedConds(x.cond) : s.conditions;
      // a DM a harcban kapcsolta a koncentrációt: ki → a lapon is vége (a koncentrációs hatás is lekerül); be → jelölés név nélkül
      if (pc !== !!x.conc) {
        patch.concentration = x.conc ? s.concentration || 'Koncentráció' : '';
        if (!x.conc && s.concentration) conds = Sheet.dropConc(conds, s.concentration);
      }
      if (JSON.stringify(conds) !== JSON.stringify(s.conditions)) patch.conditions = conds;
      if (!x.conc && s.concentration) x.cond = x.cond.filter(k => k.name === 'Exhaustion' || conds.some(n => n.toLowerCase() === k.name.toLowerCase()));
      cshadow[x.cid] = hpShadow(x);
    }
    const cur = linkFields(c), prev = shadow[c.id] ? JSON.parse(shadow[c.id]) : null;
    if (prev) for (const k of Object.keys(LINK)) if (stableJson(cur[k]) !== stableJson(prev[k])) patch[LINK[k]] = cur[k];
    shadow[c.id] = stableJson(cur);
    if (!Object.keys(patch).length) continue;
    // a könyvtárban a hatásokkal együtti AC látszik (pl. Shield of Faith +2): a lapra az alapérték megy
    if ('ac' in patch) patch.ac = Math.max(0, patch.ac - Sheet.effects(s).acAdd);
    // szabálymotoros lapnál az AC, max HP, speed, képesség átírása felülírásként (ov) is megy, különben a telefon következő
    // újraszámolása eltüntetné; képességnél a mentők / skillek gyorsítótára törlődik, amíg a telefon újra nem számol
    if (s.auto) {
      const nx = structuredClone(s);
      Object.entries(patch).forEach(([p, v]) => setPath(nx, p, structuredClone(v)));
      const ov = Sheet.ovEdits(s, Sheet.norm(nx));
      for (const [k, v] of Object.entries(ov)) if (['ac', 'hpMax', 'speed'].includes(k) || k.startsWith('ab:')) patch['ov.' + k] = v;
      if (Object.keys(ov).some(k => k.startsWith('ab:'))) patch.cache = null;
    }
    Object.entries(patch).forEach(([p, v]) => setPath(s, p, structuredClone(v)));
    SHEETS[c.id] = Sheet.norm({...s, updatedAt: now, updatedBy: by});
    if (Tar.kapcsolva() && !sheetOps.set.has(c.id)) ops.push(Tar.lapok.mezok(c.id, {...JSON.parse(JSON.stringify(patch)), updatedAt: now, updatedBy: by}));
  }
  for (const id of sheetOps.set) if (SHEETS[id] && Tar.kapcsolva()) ops.push(Tar.lapok.ir(id, JSON.parse(JSON.stringify({...SHEETS[id], updatedAt: now, updatedBy: by}))));
  if (Tar.kapcsolva()) sheetOps.set.clear();
  try { localStorage.setItem(HELYI.lapok, JSON.stringify(SHEETS)); } catch {}
}
// élő figyelés: a teljes sheets gyűjtemény minden változáskor
function onSheets(docs) {
  if (saveTimer) { clearTimeout(saveTimer); doSave(); }  // a függő helyi változás előbb kimegy
  let changed = false;
  const ids = new Set();
  for (const d of docs) {
    if (!/^[A-Za-z0-9_-]{1,64}$/.test(d.id)) continue;
    ids.add(d.id);
    const s = Sheet.norm(d);
    if (SHEETS[d.id] && stableJson(SHEETS[d.id]) === stableJson(s)) continue;
    SHEETS[d.id] = s; applySheet(d.id); changed = true;
  }
  for (const id of Object.keys(SHEETS)) if (!ids.has(id) && !sheetOps.set.has(id)) { delete SHEETS[id]; delete shadow[id]; changed = true; }
  if (changed) { save(); render(); if ($('#libRows')) filterLib(); }
}
function createSheet(id, s) {
  const lib = S.library.find(c => c.id === id);
  SHEETS[id] = Sheet.norm({...s, owner: lib?.owner || s.owner});
  sheetOps.set.add(id); sheetOps.del.delete(id);
  applySheet(id); save();
}
// mentésfájlból / felhős mentésből: a lapok is visszaállnak (ami a mentésben nincs, az törlődik)
function restoreSheets(list) {
  if (!Array.isArray(list)) return;
  const next = {};
  for (const d of list) if (isObj(d) && /^[A-Za-z0-9_-]{1,64}$/.test(d.id) && S.library.some(c => c.id === d.id)) next[d.id] = Sheet.norm(d);
  Object.keys(SHEETS).forEach(id => { if (!next[id]) sheetOps.del.add(id); });
  SHEETS = next; shadow = {}; cshadow = {};
  Object.keys(next).forEach(id => { sheetOps.set.add(id); applySheet(id); });
}
const sheetList = () => Object.entries(SHEETS).map(([id, s]) => ({...s, id}));
// meglévő (pl. D&D Beyondból importált) játékosból karakterlap: amit a könyvtári adatokból ki lehet olvasni
function creatureToSheet(c) {
  const [race, cls] = c.type.includes(' — ') ? c.type.split(' — ') : ['', c.type];
  const classes = [...String(cls).matchAll(/([A-Za-z][A-Za-z' ]*?)\s+(\d{1,2})(?:\s*\(([^)]*)\))?/g)]
    .map(m => ({name: m[1].trim(), level: +m[2], subclass: m[3] || ''})).filter(x => Sheet.findClass(x.name));
  if (!classes.length) classes.push({name: '', level: pcLevel(c) || 1});
  const skillProf = {}; let jack = false;
  for (const [k, v] of Object.entries(c.skillMods || {})) { if (v.p >= 1) skillProf[k] = v.p; if (v.p === 0.5) jack = true; }
  // kézzel felvitt játékosnál a „Skills” szövegből (pl. „Stealth +7”): a bónusz és a képességmódosító különbsége adja a jártasságot
  const pb = Math.floor(((pcLevel(c) || classes.reduce((t, x) => t + x.level, 0) || 1) - 1) / 4) + 2;
  for (const m of c.skills.matchAll(/([A-Za-z][A-Za-z ]*?)\s*([+\-−]\s*\d+)/g)) {
    const k = Object.keys(SKILLS).find(s => skillLabel(s).toLowerCase() === m[1].trim().toLowerCase());
    if (!k || skillProf[k]) continue;
    const d = parseInt(m[2].replace(/[−\s]/g, x => x === '−' ? '-' : '')) - mod(c.abilities[SKILLS[k]]);
    if (d >= 2 * pb) skillProf[k] = 2; else if (d >= pb) skillProf[k] = 1;
  }
  const attacks = [], features = [], spells = [];
  let ability = '';
  for (const k of SECTIONS) for (const e of c[k]) {
    const hit = e.text.match(/([+\-]\d+) to hit/)?.[1];
    if (k === 'actions' && hit) {
      const dm = e.text.match(/Hit:\s*(?:\d+\s*\()?\s*(\d+d\d+(?:\s*[+\-]\s*\d+)?)\s*\)?\s*([a-z]+)?/i);
      attacks.push({name: e.name, hit, dmg: dm ? dm[1].replace(/\s/g, '') + (dm[2] ? ' ' + dm[2] : '') : ''});
    } else if (e.name === 'Varázslatok') {
      for (const line of e.text.split('\n')) {
        const cl = line.match(/^(\w+):\s*spell save DC/); if (cl && !ability) ability = Sheet.CLASSES[Sheet.findClass(cl[1])]?.ab || '';
        const lv = line.match(/^(Cantrips|(\d)\w*\s+level):\s*(.+)$/);
        if (lv) lv[3].split(/,\s*/).forEach(n => spells.push({name: n.trim(), level: lv[2] ? +lv[2] : 0, prepared: true}));
      }
    } else features.push({name: e.name || SECTION_HU[k], text: e.text});
  }
  const sl = Sheet.slotsFor(classes);
  return Sheet.norm({name: c.name, portrait: c.portrait, owner: c.owner, race: race.trim(), alignment: c.alignment, classes,
    abilities: c.abilities, saveProf: ABIL.filter(a => c.saves[a] != null && c.saves[a] > mod(c.abilities[a])), skillProf, jack,
    ac: c.ac, acNote: c.acNote, speed: c.speed, hp: {max: c.hp.max, cur: c.hp.cur ?? c.hp.max, temp: 0},
    spellcasting: {ability, slots: sl.slots, pact: sl.pact}, spells, attacks, features,
    inventory: c.inventory, currency: c.currency, profs: {tools: c.tools, languages: c.languages},
    senses: c.senses.replace(/,?\s*passive Perception \d+/i, '').trim(), resist: c.resist});
}
// JSON-import: Claude által megírt vagy letöltött karakterlap; azonos nevű játékosnál rákérdez, hogy annak a lapját cserélje-e
function importSheet(o) {
  const s = Sheet.norm(o);
  let lib = S.library.find(c => c.kind === 'pc' && c.name.trim().toLowerCase() === s.name.toLowerCase());
  if (lib && !confirm(`Már van „${lib.name}” nevű játékos a könyvtárban. Az ő karakterlapját cseréled le az importáltra?\n(Mégse = új karakterként veszi fel)`)) lib = null;
  if (!lib) { lib = normCreature({id: uid(), kind: 'pc', name: s.name, owner: s.owner}); S.library.push(lib); }
  else if (!lib.owner && s.owner) Object.assign(lib, normCreature({...lib, owner: s.owner}));
  createSheet(lib.id, s);
  return S.library.find(c => c.id === lib.id);
}

async function doSave() {
  saveTimer = null;
  ensureIds();
  const ops = [];
  syncSheets(ops);
  try { localStorage.setItem(HELYI.allapot, JSON.stringify(S)); } catch {}
  if (!Tar.kapcsolva()) { setSaveState(authInfo.status === 'unconfigured' ? '✓ böngészőben mentve' : ''); return; }
  try {
    const state = JSON.stringify({enc: S.enc, settings: S.settings});
    if (state !== lastSaved.state) { ops.push(Tar.allapot.ir(JSON.parse(state))); lastSaved.state = state; }
    syncCol(Tar.konyvtar, S.library, 'lib', ops);
    syncCol(Tar.mentett, S.saved, 'saved', ops);
    syncSharing(ops);
    if (!ops.length) return;
    setSaveState(navigator.onLine ? 'mentés…' : '⚠ nincs internet – a változások később töltődnek fel');
    await Promise.all(ops);
    setSaveState('✓ mentve');
  } catch (e) {
    lastSaved = {...emptySaved(), players: ''};  // legközelebb mindent újraírunk
    setSaveState('⚠ mentés sikertelen' + (e.code ? ' (' + e.code + ')' : ''));
  }
}
window.addEventListener('beforeunload', e => {
  try { localStorage.setItem(HELYI.allapot, JSON.stringify(S)); } catch {}
  if (saveTimer) { doSave(); e.preventDefault(); }
});
function applyLoaded(d) { S = sanitizeState({...S, ...d}, S.settings); }
// teljes mentésfájl visszatöltése (Menü → Importálás)
function importBackup(obj) {
  if (!isObj(obj) || !Array.isArray(obj.library) || !isObj(obj.enc)) throw new Error('Ez nem teljes DM Screen mentés');
  applyLoaded(obj); restoreSheets(obj.sheets); selected = null;
  save(); render();
}
function loadLocal() {
  try { const t = localStorage.getItem(HELYI.allapot); if (t) applyLoaded(JSON.parse(t)); } catch {}
  try {
    const t = localStorage.getItem(HELYI.lapok), o = t ? JSON.parse(t) : null;
    if (isObj(o)) restoreSheets(Object.entries(o).map(([id, s]) => ({...s, id})));
  } catch {}
}
async function loadFromDb() {
  const [st, lib, saved, pub, players, sheets] = await Promise.all([Tar.allapot.olvas(), Tar.konyvtar.lista(), Tar.mentett.lista(),
    Tar.karakterek.lista(), Tar.jatekosok.olvas(),
    // ha a konzolban még a régi szabályok vannak, a lapok nélkül is betölt (a Menü szól)
    Tar.lapok.lista().then(l => { sheetsWarn = ''; return l; }, e => { sheetsWarn = e.code || e.message; return []; })]);
  lastSaved = emptySaved();
  pub.forEach(p => lastSaved.pub[p.id] = stableJson(p));
  if (Array.isArray(players?.emails)) lastSaved.players = JSON.stringify(players.emails);
  SHEETS = {}; shadow = {}; cshadow = {}; sheetOps = {set: new Set(), del: new Set()};
  if (st || lib.length || saved.length) {
    applyLoaded({...(st || {}), library: lib, saved});
    lastSaved.state = JSON.stringify({enc: S.enc, settings: S.settings});
    S.library.forEach(c => lastSaved.lib[c.id] = JSON.stringify(c));
    S.saved.forEach(e => lastSaved.saved[e.id] = JSON.stringify(e));
    // a telefonon azóta történt változások (HP, felszerelés…) a könyvtárba és a harcba
    for (const d of sheets) if (/^[A-Za-z0-9_-]{1,64}$/.test(d.id)) { SHEETS[d.id] = Sheet.norm(d); applySheet(d.id); }
    if (sharingDirty() || S.library.some(c => lastSaved.lib[c.id] !== JSON.stringify(c))) save();  // pl. az első indításkor még nincs közzétéve semmi
  } else {
    // üres a felhő: ha ebben a böngészőben van korábbi adat, azt töltjük fel
    // (így költözik át az adat az új Firebase-projektbe is)
    loadLocal();
    if (S.library.length || S.enc.list.length || S.saved.length) save();
  }
}
// ---------- biztonsági mentések ----------
// 1) Felhőben: naponta az első betöltéskor egy pillanatkép (dmscreen_backup/{nap}), az utolsó 14 marad meg.
//    A lista egy kis tartalomjegyzékben van (dmscreen/backups), hogy induláskor ne kelljen mindet letölteni.
// 2) Fájlba: a fejléc emlékeztet, ha 7 napja nem volt Exportálás (ez a Firebase-től független másolat).
const BACKUP_KEEP = 14, BACKUP_MAX = 900000, EXPORT_DAYS = 7;
let backupWarn = '';
const localDate = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const hasData = () => S.library.length || S.enc.list.length || S.saved.length;
async function backupIndex() { const d = await Tar.mentesek.tartalom(); return Array.isArray(d?.items) ? d.items : []; }
async function addBackup(id, note, idx) {
  idx = idx || await backupIndex();
  const data = JSON.stringify({library: S.library, saved: S.saved, enc: S.enc, settings: S.settings, sheets: sheetList()});
  if (data.length > BACKUP_MAX) { backupWarn = 'A felhős biztonsági mentés kimaradt, mert túl nagy az adat (valószínűleg sok feltöltött portré). Mentsd fájlba rendszeresen!'; return false; }
  await Tar.mentesek.ir(id, data);
  idx = [{id, note, createdAt: new Date().toISOString(), library: S.library.length, saved: S.saved.length}, ...idx.filter(b => b.id !== id)]
    .sort((a, b) => b.id.localeCompare(a.id));
  for (const b of idx.slice(BACKUP_KEEP)) await Tar.mentesek.torol(b.id);
  await Tar.mentesek.tartalomIr(idx.slice(0, BACKUP_KEEP));
  backupWarn = '';
  return true;
}
async function dailyBackup() {
  if (!Tar.kapcsolva() || !hasData()) return;
  try {
    const idx = await backupIndex();
    if (!idx.some(b => b.id === localDate())) await addBackup(localDate(), 'napi', idx);
  } catch (e) { backupWarn = 'Nem sikerült a napi biztonsági mentés (' + (e.code || e.message) + ').'; }
}
const timeStamp = () => { const d = new Date(); return localDate(d) + '-' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0'); };
async function restoreBackup(id) {
  const doc = await Tar.mentesek.olvas(id);
  if (typeof doc?.data !== 'string') throw new Error('a mentés nem található');
  const parsed = JSON.parse(doc.data);
  await addBackup(timeStamp() + '-elotte', 'visszaállítás előtt');  // a mostani állapotot is megőrizzük
  applyLoaded(parsed); restoreSheets(parsed.sheets); selected = null;
  save(); render();
}
async function openBackups() {
  openModal('<h2>Biztonsági mentések</h2><p class="muted">Betöltés…</p>');
  let idx = [];
  try { idx = await backupIndex(); } catch (e) { $('#modalBox').innerHTML = `<h2>Biztonsági mentések</h2><p style="color:var(--red)">Nem sikerült betölteni (${esc(e.code || e.message)}).</p>`; return; }
  const when = b => { const d = new Date(b.createdAt); return isNaN(d) ? '' : d.toLocaleString('hu-HU', {month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'}); };
  $('#modalBox').innerHTML = `<h2>Biztonsági mentések</h2>
    <p class="hint">Naponta az első megnyitáskor automatikusan készül egy mentés a felhőbe, az utolsó ${BACKUP_KEEP} marad meg. Visszaállítás előtt a mostani állapotról is készül egy mentés, így az is visszahozható.</p>
    ${backupWarn ? `<p style="color:var(--orange)">⚠ ${esc(backupWarn)}</p>` : ''}
    <div class="toolbar"><button data-act="backupNow">Mentés most</button><button data-act="exportAll">💾 Mentés fájlba</button></div>
    <div class="rows">${idx.length ? idx.map(b => `<div class="lrow" data-backup="${esc(b.id)}"><span class="nm"><b>${esc(when(b))}</b><small>${esc(b.note || '')} · ${esc(num(b.library))} lény · ${esc(num(b.saved))} mentett encounter</small></span>
      <button data-act="backupRestore">Visszaállítás</button></div>`).join('') : '<p class="muted">Még nincs felhős mentés.</p>'}</div>`;
}
function renderNag() {
  const el = $('#backupNag'); if (!el) return;

// a Firebase-modul hívja (lent), amikor kiderül, be vagy-e lépve

const TIP_HIT = 'Támadódobás – kattintás: normál · Shift+kattintás: előny · Ctrl+kattintás: hátrány';
const TIP_DMG = 'Sebzésdobás – kattintás: normál · Shift+kattintás: kritikus (dupla kocka)';
const TIP_RECH = 'Recharge – d6 dobás, ennyi vagy több kell, hogy újra használható legyen';
function log(html, cls = '') {
  logLines.unshift({html, cls});
  logLines = logLines.slice(0, 150);

// szövegben lévő dobások kattinthatóvá tétele
const LINK_RE = /(\d+d\d+(?:\s*[+\-−]\s*\d+(?!\s*d))?)|([+\-]\d+)(?= to hit)|(?<=Attack(?: Roll)?:\s?)([+\-]\d+)|(\(Recharge (\d)(?:[–-]6)?\))/g;
function linkify(s) {
  return esc(s).replace(LINK_RE, (m, dice, hit, hit2, rech, rn) => {
    if (dice) return `<span class="roll" data-roll="${dice.replace(/\s/g, '')}" title="${TIP_DMG}">${dice}</span>`;
    if (hit || hit2) return `<span class="roll hit" data-hit="${hit || hit2}" title="${TIP_HIT}">${hit || hit2}</span>`;
    if (rech) return `<span class="roll" data-rech="${rn || 6}" title="${TIP_RECH}">${rech}</span>`;
    return m;
  }).replace(/\n/g, '<br>');
}

    const vals = pcs.map(c => partySkill(c, k)), top = Math.max(...vals.map(v => v.b));

  }).join('');
  const skills = `<table class="ptable"><tr><th class="sortable" data-sort="s" data-col="skill">Skill${sortArrow('s', 'skill')}</th>${head}<th>${ss.col ? '<button class="small" data-act="partySortReset" title="Vissza a képességek szerinti sorrendhez">alap sorrend</button>' : ''}</th></tr>${rows}</table>
    <p class="hint">● jártas · ◆ expertise · ½ fél jártasság (Jack of All Trades) · aranyszínű = a csapat legjobbja · a fejlécre kattintva rendezhető (▼ csökkenő, ▲ növekvő)</p>`;
  // karakterkártyák
  const item = i => `<li data-item="${esc((i.name + ' ' + i.note + ' ' + i.container).toLowerCase())}"><span class="${i.magic ? 'mag' : ''}" title="${esc(i.rarity)}">${i.qty !== 1 ? esc(i.qty) + '× ' : ''}${esc(i.name)}</span>${i.attuned ? '<span class="flag">✦ hangolva</span>' : i.equipped ? '<span class="flag">viselve</span>' : ''}${i.note ? `<br><span class="note">${esc(i.note)}</span>` : ''}</li>`;
  const card = c => {
    const main = c.inventory.filter(i => !i.container).sort((a, b) => (b.attuned - a.attuned) || (b.equipped - a.equipped) || (b.magic - a.magic));
    const groups = [...new Set(c.inventory.filter(i => i.container).map(i => i.container))];
    return `<div class="pcard" data-pcard="${esc(c.id)}">
      <h3>${c.portrait ? `<img class="av" src="${esc(c.portrait)}" alt="" onerror="this.style.display='none'">` : ''}${esc(c.name)}</h3>
      <div class="muted" style="font-size:12px">${esc(c.type)} · AC ${esc(c.ac)} · HP ${esc(c.hp.max)} · ${esc(c.speed)}</div>

      <h4>Felszerelés</h4>${c.inventory.length ? `<ul class="inv">${main.map(item).join('')}</ul>
        ${groups.map(g => `<h4>🎒 ${esc(g)}</h4><ul class="inv">${c.inventory.filter(i => i.container === g).map(item).join('')}</ul>`).join('')}` : '<div class="muted">–</div>'}
      <h4>Eszközök, hangszerek</h4><div>${esc(c.tools || '–')}</div>

        <button class="small" data-act="partyEdit" data-pc="${esc(c.id)}">✎ Szerkesztés</button></div>
    </div>`;
  };
  const total = {}; pcs.forEach(c => COINS.forEach(k => total[k] = (total[k] || 0) + (c.currency[k] || 0)));
  return `<h2>👥 Csapat</h2>
    ${partyMembersBar(pcs)}
    <div id="partyRoll" class="le"></div>
    <h3>Passzív értékek</h3>${passives}

    <div class="toolbar"><input id="partySearch" placeholder="Keresés a tárgyak között (pl. kötél, potion, scroll)…" style="flex:1"><span id="partySearchInfo" class="hint"></span>
      <span>Csapat pénze: <b>${esc(coinStr(total) || '0')}</b> <span class="muted">(≈ ${esc(coinsGp(total))} gp)</span></span></div>
    <div class="pcards">${pcs.map(card).join('')}</div>`;
}

document.addEventListener('change', e => {
  if (e.target.id !== 'portraitFile' || !e.target.files[0]) return;
  const img = new Image();
  img.onload = () => {
    const s = 256, cv = document.createElement('canvas'); cv.width = cv.height = s;
    const k = Math.max(s / img.width, s / img.height), w = img.width * k, h = img.height * k;
    cv.getContext('2d').drawImage(img, (s - w) / 2, (s - h) / 2, w, h);
    setPortrait(cv.toDataURL('image/jpeg', 0.85));
    $('#portraitUrl').value = ''; $('#portraitUrl').placeholder = '(feltöltött kép)';

});

function tileHtml(x) {
  const c = x.c, max = c.hp.max || 1;
  const pct = Math.max(0, Math.min(100, x.hp / max * 100));
  const cls = ['tile', 'k-' + c.kind, sideOf(x)];
  if (x.cid === S.enc.active) cls.push('active');
  if (x.cid === selected) cls.push('selected');
  if (x.dead) cls.push('dead');
  if (x.hiddenP) cls.push('hiddenp');
  const hpCls = pct <= 25 ? 'low' : pct <= 50 ? 'mid' : '';
  const tmpPct = x.temp ? Math.min(100, x.temp / max * 100) : 0;
  const chips = (x.conc ? `<span class="chip conc" data-act="toggleConc" title="Koncentráció – kattints a megszüntetéshez">Koncentráció</span>` : '') +
    x.cond.map((k, i) => `<span class="chip" data-act="rmCond" data-i="${i}" title="Kattints az eltávolításhoz">${esc(k.name)}${k.rounds != null ? ' (' + k.rounds + ')' : ''}</span>`).join('');
  const atkRows = [], others = [];
  [...c.actions.map(a => [a, '']), ...c.bonusActions.map(a => [a, 'B'])].forEach(([a, t]) => {
    const inf = atkInfo(a.name + ' ' + a.text);
    const rech = (a.name.match(/Recharge (\d)/) || [])[1];
    if (inf.hit || inf.dice.length) {
      atkRows.push(`<div class="atk" data-label="${esc(a.name)}">${t ? `<span class="tag">${t}</span>` : ''}<span class="an" title="${esc(a.text)}">${esc(a.name.replace(/\s*\(Recharge[^)]*\)/, ''))}</span>` +
        (rech ? `<span class="roll" data-rech="${rech}" title="${TIP_RECH}">⟳${rech}</span>` : '') +
        (inf.hit ? `<span class="roll hit" data-hit="${inf.hit}" title="${TIP_HIT}">${inf.hit}</span>` : '') +
        inf.dice.slice(0, 3).map(d => `<span class="roll" data-roll="${d.expr}" title="${TIP_DMG}">${d.expr}</span>${d.type ? `<small class="muted">${esc(d.type)}</small>` : ''}`).join(' ') + '</div>');
    } else others.push((t ? t + ': ' : '') + a.name);
  });
  c.reactions.forEach(a => others.push('R: ' + a.name));
  const legN = c.legendary.length ? (c.legendaryCount || 3) : 0;
  const pips = legN ? `<span class="pips" title="Legendás akciók">LA ${Array.from({length: legN}, (_, i) => `<span class="pip ${i < x.leg ? 'used' : 'free'}" data-act="leg" data-i="${i}"></span>`).join('')}</span>` : '';
  return `<div class="${esc(cls.join(' '))}" data-cid="${esc(x.cid)}">
    <div class="t-head">
      <input class="init" type="number" value="${esc(x.init ?? '')}" placeholder="${sgn(initBonusOf(c))}" title="Initiative (bónusz: ${sgn(initBonusOf(c))})">
      ${c.portrait ? `<img class="av" src="${esc(c.portrait)}" alt="" data-act="select" onerror="this.style.display='none'">` : ''}
      <div class="t-name" data-act="select" title="Részletek">${esc(nameOf(x))} <small>${esc(crLabel(c))}</small></div>
      <div class="ac" title="AC${c.acNote ? ' – ' + esc(c.acNote) : ''}">🛡 ${esc(c.ac)}</div>
    </div>
    <div class="hpbar ${hpCls}"><div class="fill" style="width:${pct}%"></div>${tmpPct ? `<div class="tmp" style="width:${tmpPct}%"></div>` : ''}<span>${esc(x.hp)} / ${esc(max)}${x.temp ? ' +' + esc(x.temp) : ''}</span></div>
    <div class="hp-ctl">
      <input class="hpin" type="number" placeholder="±HP" title="Pozitív szám = sebzés, negatív (pl. -10) = gyógyítás, Enter-rel alkalmazod">
      <button class="dmg" data-act="dmg" title="Sebzés">−</button>
      <button class="heal" data-act="heal" title="Gyógyítás">+</button>
      <button data-act="temp" title="Temp HP beállítása">T</button>
    </div>
    ${chips ? `<div class="conds">${chips}</div>` : ''}
    ${atkRows.length ? `<div class="atks">${atkRows.slice(0, 6).join('')}</div>` : ''}
    ${others.length ? `<div class="other">${esc(others.join(' · '))}</div>` : ''}
    <div class="t-foot"><button class="sidebtn ${esc(sideOf(x))}" data-act="toggleSide" title="Kattints az oldal váltásához (ellenfél ↔ csapattárs)">${SIDE_HU[sideOf(x)]}</button>${pips}<span class="grow"></span>
      <button class="small ${x.conc ? 'on' : ''}" data-act="toggleConc" title="Koncentráció">C</button>
      <button class="small ${x.hiddenP ? 'on' : ''}" data-act="toggleHidden" title="Elrejtés a játékos képernyőről (pl. lesben álló ellenfél)">🙈</button>

// keepShare: újraimportálás / harcból visszamentés nem írja felül a játékos app beállításait (csak a szerkesztő)
function upsertLibrary(c, keepShare = true) {
  c = normCreature(c);
  const i = S.library.findIndex(x => x.id === c.id || (c.ddbId && x.ddbId === c.ddbId));
  if (i >= 0) {
    const old = S.library[i];
    c.id = old.id;
    if (keepShare) c = normCreature({...c, owner: old.owner || c.owner, share: old.share || c.share});
    S.library[i] = c;
  } else S.library.push(c);
  save();
  return c;
}

async function fiveSearch() {
  const q = ($('#fiveQ').value || '').trim().toLowerCase();
  // 5e.tools link, pl. https://5e.tools/bestiary.html#skeleton_xmm
  const link = q.match(/bestiary\.html#([^,]+)_([a-z0-9-]+)/i);
  if (link) {
    $('#fiveMsg').textContent = 'Betöltés…';
    try {
      const name = decodeURIComponent(link[1]).toLowerCase();
      const idx = await loadFiveIndex();
      const src = Object.keys(idx).find(k => k.toLowerCase() === link[2].toLowerCase());
      if (!src) throw new Error('ismeretlen forrás: ' + link[2]);

const speedOf = sp => typeof sp === 'number' ? {walk: sp} : Object.fromEntries(['walk', 'fly', 'swim', 'climb', 'burrow'].filter(k => sp?.[k] != null).map(k => [k, sp[k] === true ? (sp.walk || 30) : typeof sp[k] === 'object' ? sp[k].number : sp[k]]));
const OW_FX = {ability: ['ab', 'abChoose'], skillProficiencies: ['skill', 'skillChoose'], languageProficiencies: ['lang', 'langChoose'], toolProficiencies: ['tool', 'toolChoose'], weaponProficiencies: ['weapon'], armorProficiencies: ['armor'], resist: ['resist']};
function convRaces(file) {
  const races = (file.race || []).filter(r => (r.source === 'PHB' || (r.source === 'TCE' && r.name === 'Custom Lineage')));
  const subs = (file.subrace || []).filter(s => s.source === 'PHB' && s.raceSource === 'PHB' && races.some(r => r.name === s.raceName));
  return {
    races: races.map(r => compact({n: r.name, s: r.source, size: (r.size || []).join('/'), sp: speedOf(r.speed), fx: profFx(r), traits: traitsOf(r),
      subs: subs.filter(s => s.raceName === r.name).length})),
    // név nélküli alfaj = a faj alapváltozata (pl. Human: minden képesség +1; a Variant ezt váltja ki)
    subraces: subs.map(s => compact({n: s.name || s.raceName + ' (alap)', race: s.raceName, s: s.source, sp: s.speed != null ? speedOf(s.speed) : null, fx: profFx(s), traits: traitsOf(s),
      ow: Object.keys(s.overwrite || {}).flatMap(k => OW_FX[k] || [])}))
  };
}
function convBackgrounds(file) {
  const all = file.background || [];
  return all.filter(b => b.source === 'PHB').map(b => {
    if (b._copy) { const src = all.find(x => x.name === b._copy.name && x.source === b._copy.source); b = {...(src || {}), ...b}; }
    const feat = (b.entries || []).find(e => /^Feature:/i.test(e?.name || ''));
    return compact({n: b.name, s: b.source, fx: profFx(b), feature: feat ? {n: tagStrip(feat.name).replace(/^Feature:\s*/i, ''), tx: rbText(feat.entries)} : null,
      tx: rbText((b.entries || []).filter(e => e?.type === 'list'))});
  });
}
function optPre(pre) {
  return (pre || []).map(o => Object.entries(o).map(([k, v]) =>
    k === 'level' ? (typeof v === 'object' ? `${v.class?.name || ''} ${v.level}. szint`.trim() : `${v}. szint`)
      : k === 'pact' ? 'Pact of the ' + v : k === 'patron' ? v + ' patron' : k === 'spell' ? v.map(refClean).join(', ')
      : k === 'item' ? v.map(refClean).join(', ') : k === 'feature' ? v.map(refClean).join(', ') : k).join(', ')).join(' / ');
}
function convOptFeatures(file) {
  return (file.optionalfeature || []).filter(o => RB_SUB.includes(o.source)).map(o => {
    const lv = (o.prerequisite || []).map(p => p.level).find(Boolean);
    return compact({n: o.name, s: o.source, t: o.featureType || [], pre: optPre(o.prerequisite), lv: typeof lv === 'object' ? lv.level : lv || 0,
      pact: (o.prerequisite || []).map(p => p.pact).find(Boolean) || '', fx: profFx(o), tx: rbText(o.entries)});
  });
}
const bonusNum = v => v == null ? 0 : parseInt(String(v).replace('+', '')) || 0;
// tárgyak mechanikája: típuskód (páncélhoz / fegyverhez), mágikus bónuszok, képességérték-minimum (pl. Gauntlets of Ogre Power)
const itemMech = it => ({tc: String(it.type || '').split('|')[0], wc: it.weaponCategory || '', bAc: bonusNum(it.bonusAc), bW: bonusNum(it.bonusWeapon), bS: bonusNum(it.bonusSavingThrow),
  abS: it.ability?.static ? Object.fromEntries(ABIL.filter(a => it.ability.static[a]).map(a => [a, it.ability.static[a]])) : null});

async function buildRulebook(get = rbFetch) {
  const [phb, xge, tce, lookup, items, base, variants, feats, conds, clsIndex, races, bgs, opts] = await Promise.all(['spells/spells-phb.json', 'spells/spells-xge.json', 'spells/spells-tce.json',
    'generated/gendata-spell-source-lookup.json', 'items.json', 'items-base.json', 'magicvariants.json', 'feats.json', 'conditionsdiseases.json',
    'class/index.json', 'races.json', 'backgrounds.json', 'optionalfeatures.json'].map(get));
  // osztályfájlok: csak a 13 (PHB 2014 + TCE Artificer) osztály, a Mystic / Sidekick nélkül
  const clsFiles = await Promise.all(Object.entries(clsIndex || {}).filter(([k]) => Sheet.findClass(k)).map(([, f]) => get('class/' + f)));
  const cls = {classes: [], subclasses: [], features: []};
  for (const f of clsFiles) convClassFile(f, cls);
  const rc = convRaces(races);
  const types = Object.fromEntries((base.itemType || []).filter(t => t.source === 'PHB' || t.source === 'DMG').map(t => [t.abbreviation, t.name]));
  const props = Object.fromEntries((base.itemProperty || []).filter(p => p.source === 'PHB' || p.source === 'DMG').map(p => [p.abbreviation, (p.name || p.entries?.[0]?.name || p.abbreviation).toLowerCase()]));
  const vars = (variants.magicvariant || []).filter(v => RB_ITEM.includes(v.inherits?.source) && v.edition !== 'one');
  // az alaptárgyaknál csak azok a jellemzők kellenek, amikre a variánsok feltételei (requires / excludes) hivatkoznak
  const keys = new Set(vars.flatMap(v => [...(v.requires || []).flatMap(r => Object.keys(r)), ...Object.keys(v.excludes || {})]));
  const all = items.item || [];
  const resolve = it => {
    if (!it._copy) return it;
    const src = all.find(x => x.name === it._copy.name && x.source === it._copy.source) || (base.baseitem || []).find(x => x.name === it._copy.name && x.source === it._copy.source);
    const o = {...(src || {}), ...it}; delete o._copy; delete o._mod; return o;
  };
  const rb = {
    spells: [...(phb.spell || []), ...(xge.spell || []), ...(tce.spell || [])].filter(s => RB_SPELL.includes(s.source)).map(s => convSpell(s, lookup)),
    baseItems: (base.baseitem || []).filter(b => b.source === 'PHB' || b.source === 'DMG').map(b => ({...convItem(b, types, props), ...compact(itemMech(b)),
      m: Object.fromEntries([...keys].filter(k => b[k] != null).map(k => [k, b[k]]).concat([['name', b.name]]))})),
    items: [...all.filter(i => RB_ITEM.includes(i.source)).map(resolve), ...(items.itemGroup || []).filter(i => RB_ITEM.includes(i.source))].map(i => ({...convItem(i, types, props), ...compact(itemMech(i))})),
    variants: vars.map(v => { const h = v.inherits; return compact({n: v.name.replace(/\s*\(\*\)$/, ''), s: h.source, rar: h.rarity && h.rarity !== 'none' ? h.rarity : '', bAc: bonusNum(h.bonusAc), bW: bonusNum(h.bonusWeapon), bS: bonusNum(h.bonusSavingThrow),
      att: h.reqAttune === true ? 'requires attunement' : typeof h.reqAttune === 'string' ? 'requires attunement ' + tagStrip(h.reqAttune) : '',
      pre: h.namePrefix || '', suf: h.nameSuffix || '', req: v.requires || [], exc: v.excludes || null,
      tx: rbText(h.entries).replace(/\{=(\w+)[^}]*\}/g, (m, k) => h[k] ?? '')}); }),
    feats: (feats.feat || []).filter(f => RB_FEAT.includes(f.source)).map(f => compact({n: f.name, s: f.source, pre: featPre(f.prerequisite), fx: profFx(f),
      tx: [featAbility(f.ability), rbText(f.entries)].filter(Boolean).join('\n')})),
    conditions: (conds.condition || []).filter(c => c.source === 'PHB').map(c => ({n: c.name, s: c.source, tx: rbText(c.entries)})),
    ...cls, races: rc.races, subraces: rc.subraces, backgrounds: convBackgrounds(bgs), optfeatures: convOptFeatures(opts)
  };
  return rb;
}
async function uploadRulebook(rb, step = () => {}) {
  const chunks = Sheet.splitChunks(rb), old = await Tar.szabalyok.meta();
  for (const [i, c] of chunks.entries()) { step(`Feltöltés: ${i + 1} / ${chunks.length}`); await Tar.szabalyok.darabIr(c.id, c.data); }
  for (const id of old?.chunks || []) if (!chunks.some(c => c.id === id)) await Tar.szabalyok.darabTorol(id);
  // a meta utoljára: a telefonok csak akkor töltik le az újat, ha minden darab fent van
  const meta = {version: new Date().toISOString(), format: Sheet.RB_FORMAT, chunks: chunks.map(c => c.id), counts: Object.fromEntries(Sheet.RB_KINDS.map(k => [k, rb[k].length]))};
  await Tar.szabalyok.metaIr(meta);
  return meta;
}
// a Tárgyak fülnek: a felhőben lévő példány, ha nincs (vagy nincs belépés), közvetlenül a tükörből

}

      <div class="w4" style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px">${ABIL.map(a => `<label>${a.toUpperCase()}<input type="number" name="ab_${a}" value="${esc(c.abilities[a])}"></label>`).join('')}</div>
      <label class="w2">Mentők (pl. dex +5, wis +3)<input name="saves" value="${esc(ABIL.filter(a => c.saves[a] != null).map(a => a + ' ' + sgn(+c.saves[a])).join(', '))}"></label>
      ${f('skills', 'Skills', 'w2')}${f('senses', 'Senses', 'w2')}${f('languages', 'Languages', 'w2')}
      ${f('resist', 'Resistances', 'w2')}${f('immune', 'Immunities', 'w2')}${f('vuln', 'Vulnerabilities', 'w2')}${f('condImmune', 'Condition immunities', 'w2')}
      ${SECTIONS.map(k => `<label class="w4">${SECTION_HU[k]} <span class="hint">– elemenként: „Név. Szöveg”, az elemek között üres sor</span><textarea name="sec_${k}" rows="${k === 'actions' ? 7 : 3}">${esc(sectionToText(c[k]))}</textarea></label>`).join('')}
      <label class="w4">Jegyzet<textarea name="notes" rows="2">${esc(c.notes)}</textarea></label>
      <label class="w4">Felszerelés <span class="hint">– soronként egy tárgy, pl. „3× Fáklya” vagy „Kötél [Backpack]”${c.importedAt ? '; D&D Beyond-os játékosnál az újraimportálás felülírja' : ''}</span><textarea name="inventory" rows="4">${esc(inventoryToText(c.inventory))}</textarea></label>
      <div class="w4" style="display:grid;grid-template-columns:repeat(5,1fr) 3fr;gap:8px">${['pp', 'gp', 'ep', 'sp', 'cp'].map(k => `<label>${k}<input type="number" min="0" name="cur_${k}" value="${esc(c.currency[k])}"></label>`).join('')}
        <label>Eszköz-, hangszer-jártasságok<input name="tools" value="${esc(c.tools)}"></label></div>
      ${opts.share ? shareFieldsHtml(c, opts.shareNote) : ''}
    </form>
    <div class="toolbar" style="margin-top:12px"><button class="primary" data-act="edSave">Mentés</button><button data-act="edCancel">Mégse</button></div>`);
  $('#edForm')._base = c;
  syncShareBox();
}
function readEditor() {
  const fm = $('#edForm'), c = fm._base, v = n => fm.elements[n].value;
  for (const k of ['name', 'kind', 'cr', 'size', 'type', 'alignment', 'source', 'acNote', 'speed', 'skills', 'senses', 'languages', 'resist', 'immune', 'vuln', 'condImmune', 'notes']) c[k] = v(k);
  c.ac = +v('ac') || 10;
  c.hp = {...c.hp, max: +v('hpMax') || 1, formula: v('hpFormula')};
  c.initBonus = v('initBonus').trim() === '' ? null : parseInt(v('initBonus'));
  c.legendaryCount = +v('legendaryCount') || 0;
  c.portrait = v('portrait');
  c.inventory = textToInventory(v('inventory'), c.inventory);
  c.currency = {}; ['pp', 'gp', 'ep', 'sp', 'cp'].forEach(k => c.currency[k] = Math.max(0, +v('cur_' + k) || 0));
  c.tools = v('tools');
  ABIL.forEach(a => c.abilities[a] = +v('ab_' + a) || 10);
  c.saves = {};
  for (const m of v('saves').matchAll(/(str|dex|con|int|wis|cha)\w*\s*([+\-−]?\s*\d+)/gi)) c.saves[m[1].toLowerCase()] = parseInt(m[2].replace(/[−\s]/g, s => s === '−' ? '-' : ''));
  SECTIONS.forEach(k => c[k] = textToSection(v('sec_' + k)));
  if (fm.elements.shareVis) {
    c.owner = v('owner');
    c.share = {vis: v('shareVis'), hp: v('shareHp'), ac: v('shareAc') === '1'};
  }
  return normCreature(c);
}

// ---------- események ----------
document.addEventListener('click', async e => {
  const t = e.target;
  // Csapat nézet: titkos skill-dobás egy játékosnak
  const sk = t.closest('td.sk');
  if (sk) { partyRoll([sk.dataset.pc], sk.dataset.sk, e.shiftKey ? 'adv' : e.ctrlKey ? 'dis' : ''); return; }
  const th = t.closest('th.sortable');
  if (th) { setPartySort(th.dataset.sort, /^\d+$/.test(th.dataset.col) ? +th.dataset.col : th.dataset.col); rerenderParty(); return; }
  // dobások
  const r = t.closest('.roll');
  if (r) {
    const cidEl = r.closest('[data-cid]');
    const x = cidEl ? byId(cidEl.dataset.cid) : null;
    const who = x ? nameOf(x) : '';
    const label = r.closest('[data-label]')?.dataset.label || r.dataset.label || '';
    if (r.dataset.hit) rollHit(r.dataset.hit, who, label || 'Támadás', e.shiftKey ? 'adv' : e.ctrlKey ? 'dis' : '');
    else if (r.dataset.roll) rollDmg(r.dataset.roll, who, label || 'Dobás', e.shiftKey);
    else if (r.dataset.rech) {
      const d = rnd(6), ok = d >= +r.dataset.rech;
      log(`<span class="who">${esc(who)}</span> ${esc(label || 'Recharge')}: d6 = <b>${d}</b> — ${ok ? 'feltöltődött ✓' : 'nem töltődött'}`, ok ? 'crit' : '');
    }
    return;
  }
  const chk = t.closest('[data-check],[data-save]');
  if (chk) {
    const x = byId(chk.closest('[data-cid]')?.dataset.cid); if (!x) return;
    const sv = t.closest('[data-save]');
    if (sv) rollHit(sgn(+x.c.saves[sv.dataset.save]), nameOf(x), ABIL_FULL[sv.dataset.save] + ' mentő', e.shiftKey ? 'adv' : e.ctrlKey ? 'dis' : '');
    else { const a = chk.dataset.check; rollHit(sgn(mod(x.c.abilities[a])), nameOf(x), ABIL_FULL[a] + ' próba', e.shiftKey ? 'adv' : e.ctrlKey ? 'dis' : ''); }
    return;
  }
  if (t.dataset.die) { rollDmg(t.dataset.die, '', t.dataset.die.replace('1', '')); return; }
  if (t.dataset.tab) { libTab = t.dataset.tab; renderLib(); return; }

  const el = t.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  const x = byId(el.closest('[data-cid]')?.dataset.cid);
  const libEl = el.closest('[data-lib]'), lib = libEl && S.library.find(c => c.id === libEl.dataset.lib);
  const cnt = () => Math.max(1, +(el.closest('.lrow')?.querySelector('.cnt')?.value) || 1);

  switch (act) {
    case 'next': step(1); break;
    case 'prev': step(-1); break;
    case 'rollInit': openInitMenu(); break;
    case 'init': rollInitiative(el.dataset.mode); break;
    case 'openLib': openLib(); break;
    case 'menu': openMenu(); break;
    case 'rollCustom': { const v = $('#diceInput').value.trim(); if (v) rollDmg(v, '', v); break; }
    case 'select': selected = x.cid; render(); break;
    case 'deselect': selected = null; render(); break;
    case 'dmg': case 'heal': {
      const n = Math.abs(parseInt(el.closest('.tile').querySelector('.hpin').value));
      if (n > 0) { act === 'dmg' ? damage(x, n) : heal(x, n); save(); render(); }
      break;
    }
    case 'temp': {
      const n = parseInt(el.closest('.tile').querySelector('.hpin').value);
      if (n >= 0) { x.temp = n; log(`${esc(nameOf(x))}: ${n} temp HP`); save(); render(); }
      break;
    }
    case 'toggleConc': x.conc = !x.conc; save(); render(); break;
    case 'toggleDead': x.dead = !x.dead; save(); render(); break;
    case 'toggleSide': x.side = sideOf(x) === 'enemy' ? 'ally' : 'enemy'; save(); render(); break;
    case 'toggleHidden': x.hiddenP = !x.hiddenP; save(); render(); break;
    // 'dmscreen-player' itt ablaknév (ugyanaz a lap nyílik újra), nem a CSATORNA
    case 'openPlayer': window.open('player.html','dmscreen-player', 'popup,width=1280,height=800'); break;
    case 'openCharApp': window.open('karakter.html', '_blank'); break;
    case 'portraitUpload': $('#portraitFile').click(); break;
    case 'portraitClear': setPortrait(''); $('#portraitUrl').value = ''; break;
    case 'diffInfo': openDiffInfo(); break;
    case 'openLoot': openLoot(); break;
    case 'openParty': openParty(); break;
    case 'partyRemove': setPartyMember(el.dataset.pc, false); rerenderParty(); break;
    case 'partySortReset': partySort.s = {col: null, dir: 1}; rerenderParty(); break;
    case 'libParty': setPartyMember(lib.id, !partyMembers().some(c => c.id === lib.id)); filterLib(); break;
    case 'partyGroup': partyRoll(partyMembers().map(c => c.id), el.dataset.sk, e.shiftKey ? 'adv' : e.ctrlKey ? 'dis' : ''); break;
    case 'partyEdit': {
      const pcLib = S.library.find(c => c.id === el.dataset.pc);
      if (pcLib) openEditor(pcLib, c => { c.id = pcLib.id; upsertLibrary(c, false); setTimeout(openParty); }, undefined, {share: true});
      break;
    }
    case 'lootRoll': rollLootUi(); break;
    case 'lootCopy':
      try { await navigator.clipboard.writeText(lootText(lootResult)); el.textContent = '✓ Kimásolva'; }
      catch { el.textContent = 'A böngésző nem engedte'; }
      break;
    case 'lootLog': log('🎁 ' + esc(lootText(lootResult)).replace(/\n/g, '<br>')); el.textContent = '✓ Naplóban'; break;
    case 'dup': addToEncounter({...x.c, id: x.c.libId || x.c.id}, 1); break;
    case 'remove':
      if (confirm(`Eltávolítod: ${nameOf(x)}?`)) {
        if (S.enc.active === x.cid) step(1);
        S.enc.list = S.enc.list.filter(y => y !== x);
        if (S.enc.active === x.cid) S.enc.active = null;
        save(); render();
      }
      break;
    case 'rmCond': x.cond.splice(+el.dataset.i, 1); save(); render(); break;
    case 'leg': { const i = +el.dataset.i; x.leg = x.leg === i + 1 ? i : i + 1; save(); render(); break; }
    case 'addCond': {
      const name = $('#condSel').value || $('#condCustom').value.trim();
      if (!name) break;
      const rounds = parseInt($('#condRounds').value);
      x.cond.push({name, rounds: rounds > 0 ? rounds : null});
      save(); render(); break;
    }
    case 'editCombatant': {
      // a játékos app beállításai a karakterhez tartoznak, nem a harchoz: a könyvtári lényből jönnek, és oda azonnal vissza is íródnak
      const lib = S.library.find(l => l.id === x.c.libId);
      openEditor(lib ? {...x.c, owner: lib.owner, share: lib.share} : x.c, c => {
        const oldMax = x.c.hp.max;
        c.libId = x.c.libId; x.c = c;
        x.hp = x.hp === oldMax ? c.hp.max : Math.min(x.hp, c.hp.max);
        const l = S.library.find(l => l.id === c.libId);
        if (l && l.kind === c.kind) Object.assign(l, normCreature({...l, owner: c.owner, share: c.share}));
      }, 'Adatlap szerkesztése (csak ebben a harcban)', {share: true, shareNote: 'A játékos app beállításai a karakterhez tartoznak: a könyvtárban is azonnal érvényesek.'});
    }
      break;
    case 'saveToLib': {
      const c = structuredClone(x.c);
      c.id = c.libId && S.library.some(l => l.id === c.libId) ? c.libId : uid();
      if (c.kind === 'pc') c.hp.cur = x.hp;
      const saved = upsertLibrary(c);
      x.c.libId = saved.id;
      log(`📚 ${esc(saved.name)} elmentve a könyvtárba`); save();
      break;
    }
    case 'newCreature': openEditor(blankCreature(), c => { upsertLibrary(c, false); log(`📚 ${esc(c.name)} létrehozva`); }, 'Új lény', {share: true}); break;
    case 'edSave': {
      const ow = $('#edForm').elements.owner?.value.trim();
      if (ow && $('#edForm').elements.kind.value === 'pc' && !EMAIL_RE.test(ow.toLowerCase())) { alert('A játékos Google-fiókja nem érvényes e-mail-cím.'); break; }
      const c = readEditor(); const cb = editCb; closeModal(); cb && cb(c); save(); render(); break; }
    case 'edCancel': closeModal(); break;

    // könyvtár
    case 'libAdd': addToEncounter(lib, cnt()); log(`＋ ${cnt()}× ${esc(lib.name)}`); break;
    case 'libEdit': openEditor(lib, c => { c.id = lib.id; upsertLibrary(c, false); setTimeout(() => openLib('lib')); }, undefined, {share: true}); break;
    case 'libExport': download(lib.name.replace(/[^\wáéíóöőúüű -]/gi, '') + '.json', SHEETS[lib.id] || lib); break;
    case 'libDel':
      if (confirm(`Törlöd a könyvtárból: ${lib.name}?${SHEETS[lib.id] ? '\nA telefonos karakterlapja is törlődik (a felhős biztonsági mentésekből visszahozható).' : ''}`)) {
        if (SHEETS[lib.id]) sheetOps.del.add(lib.id);
        S.library = S.library.filter(c => c !== lib); save(); filterLib();
      }
      break;
    case 'libSheet':
      if (SHEETS[lib.id]) window.open('karakter.html#lap/' + lib.id, '_blank');
      else if (confirm(`Telefonos karakterlapot hozol létre ${lib.name} számára a könyvtári adatokból?\nEzután a lap a játékosé: amit a telefonján átír, az ide is átjön. Az osztályt, spell slotokat érdemes a lapon ellenőrizni.`)) {
        createSheet(lib.id, creatureToSheet(lib)); filterLib(); log(`📱 ${esc(lib.name)}: karakterlap létrehozva`);
      }
      break;
    case 'rulebook': openRulebook(); break;
    case 'rbUpdate': el.disabled = true; await rulebookUpdate(); el.disabled = false; break;
    case 'itemAdd': {
      const it = itemResults[+el.closest('[data-item]').dataset.item], to = $('#itemTo')?.value;
      const c = it && to && addItemTo(to, it, cnt());
      if (c) { el.textContent = '✓ ' + c.name; log(`🗡 ${cnt()}× ${esc(it.n)} → ${esc(c.name)}`); }
      break;
    }
    case 'downloadSheetTemplate': download('karakterlap-sablon.json', Sheet.TEMPLATE); break;
    case 'showSheetTemplate': $('#jsonIn').value = JSON.stringify(Sheet.TEMPLATE, null, 2); break;
    case 'addAllPcs': {
      const pcs = S.library.filter(c => c.kind === 'pc' && !S.enc.list.some(x => x.c.libId === c.id));
      pcs.forEach(c => addToEncounter(c, 1));
      log(`＋ ${pcs.length} játékos hozzáadva`); closeModal(); break;
    }
    case 'fiveSearch': fiveSearch(); break;
    case 'fiveAdd': case 'fiveSave': {
      const m = fiveResults[+el.closest('[data-five]').dataset.five];
      const c = convert5e(await resolveCopy(structuredClone(m)));
      if (act === 'fiveAdd') { addToEncounter(c, cnt()); log(`＋ ${cnt()}× ${esc(c.name)}`); }
      else { upsertLibrary(c); el.textContent = '✓ Mentve'; }
      break;
    }
    case 'ddbPasteImport': ddbImportText($('#ddbPaste').value); break;
    case 'ddbClipboard':
      try { ddbImportText(await navigator.clipboard.readText()); }
      catch { $('#ddbMsg').innerHTML = '<p class="muted">A böngésző nem engedte olvasni a vágólapot – kattints a mezőbe, és nyomj Ctrl+V-t.</p>'; }
      break;
    case 'signIn': window.DMAuth?.signIn(); break;
    case 'signOut': closeModal(); window.DMAuth?.signOut(); break;
    case 'reload': location.reload(); break;
    case 'jsonImport':
      try {
        const res = await importAny(JSON.parse($('#jsonIn').value));
        $('#jsonMsg').textContent = `✓ ${res.length} lény importálva: ${res.map(c => c.name).join(', ')}`;
      } catch (err) { $('#jsonMsg').textContent = '⚠ ' + err.message; }
      break;
    case 'showTemplate': $('#jsonIn').value = JSON.stringify(TEMPLATE, null, 2); break;
    case 'downloadTemplate': download('dmscreen-sablon.json', TEMPLATE); break;
    case 'importFile': fileMode = 'creatures'; $('#fileIn').click(); break;
    case 'encSave': {
      const list = S.enc.list.filter(y => y.c.kind !== 'pc').map(y => y.c);
      if (!list.length) { alert('Nincs nem-játékos lény az encounterben.'); break; }
      S.saved.push({id: uid(), name:$('#encName').value.trim() || 'Encounter ' + (S.saved.length + 1), list: structuredClone(list)});
      save(); renderLib(); break;
    }
    case 'encLoad': {
      const enc = S.saved[+el.closest('[data-enc]').dataset.enc];
      const groups = {};
      enc.list.forEach(c => (groups[c.name] = groups[c.name] || []).push(c));
      Object.values(groups).forEach(g => addToEncounter(g[0], g.length));
      log(`⚔ ${esc(enc.name)} betöltve`); closeModal(); break;
    }
    case 'encDel': if (confirm('Törlöd ezt a mentett encountert?')) { S.saved.splice(+el.closest('[data-enc]').dataset.enc, 1); save(); renderLib(); } break;

    // menü
    case 'newFight':
      S.enc.list = S.enc.list.filter(y => y.c.kind === 'pc');
      S.enc.list.forEach(y => { y.init = null; y.cond = []; y.conc = false; y.leg = 0; });
      S.enc.round = 1; S.enc.active = null; selected = null;
      log('— Új harc —', 'round'); closeModal(); save(); render(); break;
    case 'clearAll':
      if (confirm('Mindenkit eltávolítasz az encounterből?')) { S.enc = {list: [], round: 1, active: null}; selected = null; closeModal(); save(); render(); }
      break;
    case 'exportAll':
      S.settings.lastExport = localDate();
      download(`dmscreen-mentes-${localDate()}.json`, {...S, sheets: sheetList()});
      save(); render(); break;
    case 'openBackups': openBackups(); break;
    case 'backupNow':
      try { if (await addBackup(timeStamp() + '-kezi', 'kézi mentés')) log('💾 Biztonsági mentés elkészült a felhőben'); }
      catch (err) { backupWarn = 'Nem sikerült a mentés (' + (err.code || err.message) + ').'; }
      openBackups(); break;
    case 'backupRestore': {
      const id = el.closest('[data-backup]').dataset.backup;
      if (!confirm('Visszaállítod ezt a mentést? A mostani állapotról előbb automatikusan mentés készül.')) break;
      try { await restoreBackup(id); closeModal(); log('↺ Biztonsági mentés visszaállítva'); }
      catch (err) { alert('A visszaállítás nem sikerült: ' + (err.code || err.message)); }
      break;
    }
    case 'importAll': fileMode = 'all'; $('#fileIn').click(); break;
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.setting) { S.settings[t.dataset.setting] = t.checked; save(); return; }
  if (t.dataset.src) {
    const s = new Set(S.settings.sources);
    t.checked ? s.add(t.dataset.src) : s.delete(t.dataset.src);
    S.settings.sources = [...s]; save(); return;
  }
  if (t.id === 'libKind') { filterLib(); return; }
  if (t.id === 'partyAddSel') { if (t.value) { setPartyMember(t.value, true); rerenderParty(); } return; }
  const x = byId(t.closest('[data-cid]')?.dataset.cid);
  if (!x) return;
  if (t.classList.contains('init')) { x.init = t.value === '' ? null : +t.value; save(); render(); return; }
  const f = t.dataset.f;
  if (!f || f === 'notes') return;
  if (f === 'conc') x.conc = t.checked;
  else if (f === 'init') x.init = t.value === '' ? null : +t.value;
  else if (f === 'hp') { x.hp = Math.max(0, +t.value || 0); x.dead = x.hp === 0 && x.c.kind !== 'pc'; }
  else if (f === 'max') x.c.hp.max = Math.max(1, +t.value || 1);
  else if (f === 'temp') x.temp = Math.max(0, +t.value || 0);
  else if (f === 'ac') x.c.ac = +t.value || 0;
  else if (f === 'side') x.side = t.value;
  else if (f === 'hiddenP') x.hiddenP = t.checked;
  else if (f === 'pubName') x.publicName = t.value.trim();
  save(); render();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'libSearch') filterLib();
  if (t.id === 'itemQ') filterItems();
  if (t.id === 'partySearch') filterPartyItems(t.value);
  if (t.dataset.f === 'notes') { const x = byId(t.closest('[data-cid]')?.dataset.cid); if (x) { x.notes = t.value; save(); } }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Escape') { if (!$('#modal').hidden) closeModal(); else if (selected) { selected = null; render(); } return; }
  if (t.classList?.contains('hpin') && e.key === 'Enter') {
    const x = byId(t.closest('[data-cid]').dataset.cid), n = parseInt(t.value);
    if (n > 0) damage(x, n); else if (n < 0) heal(x, -n);
    if (n) { save(); render(); }
    return;
  }
  if (t.id === 'diceInput' && e.key === 'Enter') { const v = t.value.trim(); if (v) rollDmg(v, '', v); return; }
  if (t.id === 'fiveQ' && e.key === 'Enter') { fiveSearch(); return; }
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || !$('#modal').hidden) return;
  if (e.key === 'n' || e.key === 'N' || e.key === ' ') { e.preventDefault(); step(1); }
  else if (e.key === 'p' || e.key === 'P') { e.preventDefault(); step(-1); }
});

// beillesztéskor magától importál
document.addEventListener('paste', e => {
  if (e.target.id !== 'ddbPaste') return;
  const t = e.clipboardData?.getData('text');
  if (t && t.trim().startsWith('{')) { e.preventDefault(); ddbImportText(t); }
});

// ---------- indulás ----------
render();
</script>

<script src="firebase-config.js"></script>
<script type="module">
// Firebase: Google-belépés + Firestore (saját projekt; ki mit érhet el: firestore.rules)
const V = '10.12.2';
const cfg = window.FIREBASE_CONFIG;
// ?test = automata tesztek (tests/): helyi mód, a felhőhöz nem nyúl
if (!cfg || !cfg.apiKey || location.protocol === 'file:' || new URLSearchParams(location.search).has('test')) {
  window.DMApp.setAuth({status: 'unconfigured'});
} else {
  try {
    const {initializeApp} = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const A = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
    const F = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
    const app = initializeApp(cfg);
    const auth = A.getAuth(app);
    const fs = F.initializeFirestore(app, {localCache: F.persistentLocalCache({tabManager: F.persistentMultipleTabManager()})});
    const db = {
      get: async p => { const s = await F.getDoc(F.doc(fs, p)); return s.exists() ? s.data() : null; },
      list: async p => (await F.getDocs(F.collection(fs, p))).docs.map(d => ({...d.data(), id: d.id})),
      set: (p, d) => F.setDoc(F.doc(fs, p), d),
      update: (p, d) => F.updateDoc(F.doc(fs, p), d),  // mezőnként (pl. 'hp.cur'), a többi mezőhöz nem nyúl
      del: p => F.deleteDoc(F.doc(fs, p)),
      watch: (col, cb, err) => F.onSnapshot(F.collection(fs, col), s => cb(s.docs.map(d => ({...d.data(), id: d.id}))), err),
    };
    const provider = new A.GoogleAuthProvider();
    provider.setCustomParameters({prompt: 'select_account'});
    window.DMAuth = {
      async signIn() {
        try { await A.signInWithPopup(auth, provider); }
        catch (e) {
          if (e.code === 'auth/popup-blocked') return A.signInWithRedirect(auth, provider);
          if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request')
            window.DMApp.setAuth({status: 'signedOut', error: 'A belépés nem sikerült (' + e.code + ').'});
        }
      },
      signOut: () => A.signOut(auth),
      email: () => auth.currentUser?.email || '',
    };
    A.onAuthStateChanged(auth, u => window.DMApp.setAuth(u ? {status: 'signedIn', email: u.email, db} : {status: 'signedOut'}));
  } catch (e) {
    // nincs internet a legelső betöltéskor: helyi mód
    window.DMApp.setAuth({status: 'unconfigured'});
  }
}
</script>
</body>
</html>
