<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DM Screen</title>
<link rel="icon" href="favicon.ico">
<style>
:root{
  --bg:#121418; --panel:#1b1e24; --panel2:#232730; --line:#323744; --text:#e7e7e9; --muted:#9097a3;
  --accent:#e2a63b; --red:#d9534f; --orange:#e08a2e; --green:#4caf6a; --blue:#4a8fe0;
  --pc:#4a8fe0; --npc:#4caf6a; --mon:#c9483f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 "Segoe UI",system-ui,sans-serif}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:600}
button.small{padding:2px 7px;font-size:12px}
button.on{background:var(--accent);color:#1a1405}
input,select,textarea{font:inherit;color:var(--text);background:#0f1115;border:1px solid var(--line);border-radius:5px;padding:4px 6px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{width:100%;resize:vertical}
input[type=number]{width:64px}
.muted{color:var(--muted)} .pad{padding:14px}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);height:52px}
.brand{font-weight:700;color:var(--accent);font-size:16px;margin-right:6px}
.round{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
.round b{color:var(--accent);font-size:16px}
.grow{flex:1} .sep{width:1px;height:26px;background:var(--line);margin:0 4px}
#saveState{color:var(--muted);font-size:12px}
main{display:flex;height:calc(100% - 52px)}
#board{flex:1;overflow:auto;padding:12px}
#tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;align-items:start}
#side{width:440px;min-width:360px;border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
#detail{flex:1;overflow:auto}
#dice{border-top:1px solid var(--line);height:260px;display:flex;flex-direction:column}
.dicebar{display:flex;gap:4px;padding:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.dicebar input{width:110px}
#log{flex:1;overflow:auto;padding:4px 8px;font-size:13px}
.le{padding:3px 0;border-bottom:1px solid #20242b}
.le .who{color:var(--muted)} .le b{font-size:15px}
.le.crit b{color:var(--green)} .le.fumble b{color:var(--red)}
.le.turn{color:var(--accent);font-weight:600} .le.warn{color:var(--orange)} .le.round{color:var(--accent);text-align:center;font-weight:700}
.empty{grid-column:1/-1;text-align:center;padding:60px;color:var(--muted)}
.empty button{margin-top:12px}

.tile{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--mon);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px}
.tile.ally{border-left-color:var(--npc)} .tile.ally.k-pc{border-left-color:var(--pc)}
.sidebtn{font-size:11px;padding:1px 7px;border-radius:10px}
.sidebtn.enemy{background:#4a1f1d;border-color:var(--mon)} .sidebtn.ally{background:#1d3d25;border-color:var(--npc)}
#diff{font-weight:600}
.d-trivial{color:var(--muted)} .d-easy{color:var(--green)} .d-medium{color:#e8d34a} .d-hard{color:var(--orange)} .d-deadly{color:#fff;background:#7a1c1c;border-color:var(--red)}
table.dt{border-collapse:collapse;width:100%;margin:6px 0 12px;font-size:13px}
table.dt th,table.dt td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
table.dt td.n,table.dt th.n{text-align:right}
table.dt tr.hl td{color:var(--accent);font-weight:700}
.tile.active{box-shadow:0 0 0 2px var(--accent);background:#262318}
.tile.selected{outline:1px dashed var(--muted);outline-offset:2px}
.tile.dead{opacity:.45}
.t-head{display:flex;align-items:center;gap:6px}
.t-head .init{width:48px;font-weight:700;text-align:center;font-size:16px}
.t-name{flex:1;font-weight:600;font-size:15px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-name small{color:var(--muted);font-weight:400;font-size:12px}
.ac{background:var(--panel2);border:1px solid var(--line);border-radius:12px 12px 16px 16px;padding:2px 8px;font-weight:700}
.hpbar{position:relative;height:20px;background:#0d0f12;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.hpbar .fill{position:absolute;inset:0 auto 0 0;background:var(--green)}
.hpbar.mid .fill{background:var(--orange)} .hpbar.low .fill{background:var(--red)}
.hpbar .tmp{position:absolute;inset:0 0 0 auto;background:#5b7fbf88}
.hpbar span{position:relative;display:block;text-align:center;font-weight:700;font-size:13px;line-height:18px;text-shadow:0 1px 2px #000}
.hp-ctl{display:flex;gap:4px} .hp-ctl input{flex:1;width:auto;min-width:0}
.hp-ctl button{flex:none;padding:4px 9px}
.hp-ctl .dmg{background:#4a1f1d} .hp-ctl .heal{background:#1d3d25}
.conds{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:#3a2f4d;border-radius:10px;padding:1px 8px;font-size:12px;cursor:pointer}
.chip.conc{background:#28466b}
.chip:hover{text-decoration:line-through}
.atks{display:flex;flex-direction:column;gap:2px;font-size:13px}
.atk{display:flex;gap:4px;align-items:baseline;flex-wrap:wrap}
.atk .an{color:#cfd3da;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.atk .tag{color:var(--accent);font-size:11px;font-weight:700}
.other{font-size:12px;color:var(--muted)}
.t-foot{display:flex;align-items:center;gap:4px}
.pips{display:flex;gap:3px;align-items:center;font-size:11px;color:var(--muted)}
.pip{width:13px;height:13px;border-radius:50%;border:1px solid var(--accent);cursor:pointer}
.pip.used{background:transparent} .pip.free{background:var(--accent)}

.roll{color:var(--accent);border-bottom:1px dotted var(--accent);cursor:pointer;white-space:nowrap;font-weight:600}
.roll:hover{background:#3a2f15}
.roll.hit{color:#7fc4ff;border-color:#7fc4ff}

/* statblock */
.sb{padding:12px 14px}
.sb h2{margin:0;color:var(--accent);font-size:20px}
.sb .sub{color:var(--muted);font-style:italic;margin-bottom:8px}
.sb h3{margin:14px 0 4px;color:var(--accent);border-bottom:1px solid var(--line);font-size:15px;padding-bottom:2px}
.sb p{margin:4px 0}
.sb .line b{color:#cfd3da}
.abil{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:8px 0;text-align:center}
.abil div{background:var(--panel2);border-radius:6px;padding:4px 0;cursor:pointer}
.abil div:hover{outline:1px solid var(--accent)}
.abil small{display:block;color:var(--muted);font-size:11px}
.abil .sv{font-size:11px;color:#7fc4ff}
.ctl{background:var(--panel2);margin:10px 14px;padding:10px;border-radius:8px;display:flex;flex-direction:column;gap:8px}
.ctl .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctl label{color:var(--muted);font-size:12px}

/* modal */
#gate{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;font-size:18px;color:var(--muted);line-height:1.8}
#gate[hidden]{display:none}
#gate button{margin-top:14px;font-size:16px;padding:8px 18px}
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-start;justify-content:center;padding:30px;z-index:10}
#modal[hidden]{display:none}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(980px,100%);max-height:calc(100vh - 60px);overflow:auto;padding:16px}
.modal-box.wide{width:min(1500px,100%)}
/* Csapat nézet */
.ptable{border-collapse:collapse;width:100%;font-size:13px;margin:4px 0 14px}
.ptable th,.ptable td{border-bottom:1px solid var(--line);padding:4px 8px;text-align:center;white-space:nowrap}
.ptable th:first-child,.ptable td:first-child{text-align:left}
.ptable td.best{color:var(--accent);font-weight:700}
.ptable td.sk{cursor:pointer} .ptable td.sk:hover{background:#3a2f15}
.ptable th.sortable{cursor:pointer;user-select:none} .ptable th.sortable:hover{color:var(--accent)}
.ptable .ab{color:var(--muted);font-size:11px}
.pmark{font-size:10px;color:var(--muted);margin-left:2px}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.pcard{background:var(--panel2);border-radius:8px;padding:10px}
.pcard h3{margin:0 0 4px;color:var(--accent);display:flex;align-items:center;gap:8px}
.pcard h4{margin:8px 0 2px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.inv{list-style:none;margin:0;padding:0;font-size:13px}
.inv li{padding:1px 0}
.inv .mag{color:#c9a0ff} .inv .flag{font-size:11px;color:var(--accent);margin-left:4px} .inv .note{color:var(--muted);font-size:11px}
#partyRoll{min-height:22px;margin:6px 0}
.modal-box h2{margin:0 0 10px;color:var(--accent)}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tabs button.on{background:var(--accent);color:#1a1405}
.rows{display:flex;flex-direction:column;gap:4px}
.lrow{display:flex;align-items:center;gap:8px;background:var(--panel2);padding:6px 8px;border-radius:6px}
.lrow .nm{flex:1} .lrow .nm small{color:var(--muted);margin-left:6px}
.lrow input[type=number]{width:52px}
.srcs{display:flex;flex-wrap:wrap;gap:4px 12px;max-height:120px;overflow:auto;background:#0f1115;padding:8px;border-radius:6px;border:1px solid var(--line);font-size:12px}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.form label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:2px}
.form label input,.form label select{width:100%}
.form .w2{grid-column:span 2} .form .w4{grid-column:1/-1} .form [hidden]{display:none}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.hint{font-size:12px;color:var(--muted)}
@media (max-width:1200px){#side{width:340px;min-width:300px}}
.kbd{border:1px solid var(--line);border-radius:3px;padding:0 4px;font-size:11px}
.av{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none;border:1px solid var(--line);background:var(--panel2)}
.sb .portrait{float:right;width:110px;height:110px;border-radius:10px;object-fit:cover;margin:0 0 8px 10px;border:1px solid var(--line)}
.tile.hiddenp{border-style:dashed;opacity:.75}
.tile.hiddenp .t-name::after{content:" 🙈";font-size:12px}
.pv{width:72px;height:72px;border-radius:10px;object-fit:cover;border:1px solid var(--line);background:var(--panel2)}
</style>
</head>
<body>
<header>
  <div class="brand">⚔ DM Screen</div>
  <div class="round">Kör <b id="roundNo">1</b></div>
  <button id="diff" data-act="diffInfo" title="Encounter nehézsége (DMG 2014) – kattints a részletekért">–</button>
  <button data-act="prev" title="Előző (P)">◀</button>
  <button class="primary" data-act="next" title="Következő (N vagy Szóköz)">Következő ▶</button>
  <button data-act="rollInit">🎲 Initiative</button>
  <button data-act="openLoot" title="Zsákmány a legyőzött ellenfelek alapján (DMG 2014 kincstáblák)">🎁 Loot</button>
  <button data-act="openParty" title="Harcon kívül: a játékosok passzív értékei, skilljei, felszerelése és pénze">👥 Csapat</button>
  <span class="sep"></span>
  <button data-act="openLib">＋ Hozzáadás / Könyvtár</button>
  <button data-act="newCreature">✎ Új lény</button>
  <button data-act="openPlayer" title="Külön ablakban megnyitja a játékosoknak szánt képernyőt – húzd át a másik monitorra, és nyomj F11-et">📺 Játékos képernyő</button>
  <button data-act="openCharApp" title="Új lapon megnyitja a játékosok telefonos karakterlapját (karakter.html) – ezt a címet küldd el a játékosoknak">📱 Karakterlap</button>
  <span class="grow"></span>
  <button id="backupNag" data-act="exportAll" hidden title="Biztonsági másolat letöltése a gépedre (a felhőtől független)" style="border-color:var(--orange);color:var(--orange)"></button>
  <span id="saveState"></span>
  <button data-act="menu">⋯ Menü</button>
</header>
<main>
  <section id="board"><div id="tiles"></div></section>
  <aside id="side">
    <div id="detail"></div>
    <div id="dice">
      <div class="dicebar">
        <input id="diceInput" placeholder="pl. 2d6+3">
        <button data-act="rollCustom">Dob</button>
        <button class="small" data-die="1d4">d4</button><button class="small" data-die="1d6">d6</button>
        <button class="small" data-die="1d8">d8</button><button class="small" data-die="1d10">d10</button>
        <button class="small" data-die="1d12">d12</button><button class="small" data-die="1d20">d20</button>
        <button class="small" data-die="1d100">d%</button>
        <span class="hint" style="width:100%">Kattints a színes számokra · Shift+kattintás: előny / kritikus · Ctrl+kattintás: hátrány</span>
      </div>
      <div id="log"></div>
    </div>
  </aside>
</main>
<div id="modal" hidden><div class="modal-box" id="modalBox"></div></div>
<div id="gate"><div>Betöltés…</div></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script src="kozos.js?v=3"></script>
<script src="sheet.js?v=6"></script>
<script src="szerzodes.js?v=1"></script>
<script src="js/adat/tar.js?v=1"></script>
<script src="js/logika/alap.js?v=1"></script>
<script src="js/logika/harc.js?v=1"></script>
<script src="js/logika/nehezseg.js?v=1"></script>
<script src="js/logika/loot.js?v=1"></script>
<script src="js/logika/csapat.js?v=1"></script>
<script src="js/logika/import-5etools.js?v=1"></script>
<script src="js/logika/import-ddb.js?v=1"></script>
<script src="js/logika/import-json.js?v=1"></script>
<script src="js/logika/szabalykonyv.js?v=1"></script>
<script src="js/logika/lapszinkron.js?v=1"></script>
<script src="js/logika/mentes.js?v=1"></script>
<script src="js/logika/konyvtar.js?v=1"></script>
<script src="js/felulet/harcter.js?v=1"></script>
<script src="js/felulet/jatekos-kepernyo.js?v=1"></script>
<script src="js/felulet/modal.js?v=1"></script>
<script src="js/felulet/konyvtar-ablak.js?v=1"></script>
<script src="js/felulet/szerkeszto.js?v=1"></script>
<script>
'use strict';
// a közös fájlok várt változata (= a <script src> ?v= száma; régi, gyorsítótárazott példánynál a lapokra nem írunk – syncSheets)
const VART_MODULOK = {kozos: 3, sheet: 6, szerzodes: 1, tar: 1, alap: 1, harc: 1, nehezseg: 1, loot: 1, csapat: 1, 'import-5etools': 1, 'import-ddb': 1, 'import-json': 1, szabalykonyv: 1, lapszinkron: 1, mentes: 1, konyvtar: 1, harcter: 1, 'jatekos-kepernyo': 1, modal: 1, 'konyvtar-ablak': 1, szerkeszto: 1};

// ---------- mentés és biztonsági mentések (megjelenítés) ----------
window.addEventListener('beforeunload', e => {
  try { localStorage.setItem(HELYI.allapot, JSON.stringify(S)); } catch {}
  if (saveTimer) { doSave(); e.preventDefault(); }
});

// a Firebase-modul hívja (lent), amikor kiderül, be vagy-e lépve
window.DMApp = {
  async setAuth(a) {
    authInfo = a;
    if (a.status === 'signedIn') {
      Tar.kapcsol(a.db);
      renderGate('Adatok betöltése…');
      try {
        await loadFromDb(); renderGate(null); dailyBackup();
        sheetUnsub?.(); sheetUnsub = sheetsWarn ? null : Tar.lapok.figyel(onSheets, () => {});
      }
      catch (e) {
        Tar.kapcsol(null);
        renderGate(e.code === 'permission-denied'
          ? `Ez a Google-fiók (${esc(a.email)}) nem fér hozzá az adatokhoz.<br><button data-act="signOut">Másik fiókkal</button>`
          : `Nem sikerült betölteni az adatokat (${esc(e.code || e.message)}).<br><button data-act="reload">Újra</button>`);
        return;
      }
    } else if (a.status === 'unconfigured') { Tar.kapcsol(null); loadLocal(); renderGate(null); }
    else if (a.status === 'signedOut') {
      Tar.kapcsol(null); sheetUnsub?.(); sheetUnsub = null;
      renderGate(`<b style="font-size:40px;color:var(--accent)">⚔</b><br>Lépj be a Google-fiókoddal, hogy elérd a DM Screen adataidat.<br>
        <button class="primary" data-act="signIn">Belépés Google-fiókkal</button>${a.error ? `<p style="color:var(--red)">${esc(a.error)}</p>` : ''}`);
    }
    render();
  }
};

// ---------- zsákmány (megjelenítés) ----------
function openLoot() {
  const enemies = order().filter(x => sideOf(x) === 'enemy');
  const anyDead = enemies.some(x => x.dead);
  const on = x => (anyDead ? x.dead : true) && !noTreasure(x.c);
  const pool = enemies.filter(on);
  const band = crBand((pool.length ? pool : enemies).reduce((m, x) => crNum(x.c.cr) > crNum(m) ? x.c.cr : m, '0'));
  openModal(`<h2>🎁 Zsákmány</h2>
    <p class="hint">A DMG (2014) kincstáblái alapján. Alapból a legyőzött ellenfelek vannak kiválasztva; állatoknál, oozeoknál és növényeknél a DMG szerint nincs kincs. Egyéni kincs = ellenfelenként érmék; kincshalom = egy nagyobb zsákmány az egész harcért (pl. boss, búvóhely), mágikus tárgyakkal.</p>
    ${enemies.length ? `<div class="rows">${enemies.map(x => `<label class="lrow"><input type="checkbox" class="lootPick" value="${esc(x.cid)}" ${on(x) ? 'checked' : ''}>
      <span class="nm"><b>${esc(nameOf(x))}</b><small>${esc(crLabel(x.c) || 'nincs CR')} · ${esc(x.c.type || '')}${x.dead ? ' · legyőzve' : ''}</small></span></label>`).join('')}</div>`
      : '<p class="muted">Nincs ellenfél az encounterben – csak kincshalmot lehet dobni.</p>'}
    <div class="toolbar" style="margin-top:10px">
      <select id="lootMode"><option value="individual">Egyéni kincs (ellenfelenként)</option><option value="hoard"${enemies.length ? '' : ' selected'}>Kincshalom (az egész harcért)</option><option value="both">Mindkettő</option></select>
      <label class="hint">Kincshalom szintje <select id="lootBand">${BAND_HU.map((l, i) => `<option value="${i}" ${i === band ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <button class="primary" data-act="lootRoll">🎲 Generálás</button>
    </div>
    <div id="lootOut"></div>`);
}
async function rollLootUi() {
  const out = $('#lootOut');
  out.innerHTML = '<p class="muted">Kincstáblák betöltése…</p>';
  let data;
  try { data = await loadLoot(); }
  catch (e) { out.innerHTML = `<p style="color:var(--red)">Nem sikerült betölteni a kincstáblákat (van internet?): ${esc(e.message)}</p>`; return; }
  const picked = [...document.querySelectorAll('.lootPick')].filter(i => i.checked).map(i => byId(i.value)).filter(Boolean);
  const mode = $('#lootMode').value;
  lootResult = generateLoot(data, picked, mode, +$('#lootBand').value);
  const t = lootTotals(lootResult), h = lootResult.hoard;
  const itemLink = n => n.includes('(válassz') ? esc(n) : `<a href="https://5e.tools/items.html#${encodeURIComponent(n.toLowerCase())}_dmg" target="_blank" rel="noopener" style="color:var(--accent)">${esc(n)}</a>`;
  out.innerHTML = `
    ${lootResult.creatures.length ? `<h3>Ellenfelenként</h3>${lootResult.creatures.map(c => `<p><b>${esc(c.name)}</b>${mode !== 'hoard' ? ': ' + esc(coinStr(c.coins) || 'nincs érme') : ''}${c.gear.length ? `<br><small class="muted">Felszerelés: ${esc(c.gear.join(', '))}</small>` : ''}</p>`).join('')}` : ''}
    ${h ? `<h3>Kincshalom (${BAND_HU[h.band]})</h3>
      <p><b>Érmék:</b> ${esc(coinStr(h.coins) || 'nincs')}</p>
      ${h.gems.length ? `<p><b>Drágakövek:</b> ${esc(groupNames(h.gems).join(', '))}</p>` : ''}
      ${h.art.length ? `<p><b>Műtárgyak:</b> ${esc(groupNames(h.art).join(', '))}</p>` : ''}
      <p><b>Mágikus tárgyak:</b> ${h.items.length ? h.items.map(i => itemLink(i.name) + ` <small class="muted">(${esc(i.table)} tábla)</small>`).join(', ') : 'nincs'}</p>` : ''}
    <h3>Összesen</h3>

    <p class="hint">● jártas · ◆ expertise · ½ fél jártasság (Jack of All Trades) · aranyszínű = a csapat legjobbja · a fejlécre kattintva rendezhető (▼ csökkenő, ▲ növekvő)</p>`;
  // karakterkártyák

  const card = c => {

      <h3>${c.portrait ? `<img class="av" src="${esc(c.portrait)}" alt="" onerror="this.style.display='none'">` : ''}${esc(c.name)}</h3>
      <div class="muted" style="font-size:12px">${esc(c.type)} · AC ${esc(c.ac)} · HP ${esc(c.hp.max)} · ${esc(c.speed)}</div>
      <h4>Pénz</h4><div>${esc(coinStr(c.currency) || '–')}${coinsGp(c.currency) ? ` <span class="muted">(≈ ${esc(coinsGp(c.currency))} gp)</span>` : ''}</div>
      <h4>Felszerelés</h4>${c.inventory.length ? `<ul class="inv">${main.map(item).join('')}</ul>
        ${groups.map(g => `<h4>🎒 ${esc(g)}</h4><ul class="inv">${c.inventory.filter(i => i.container === g).map(item).join('')}</ul>`).join('')}` : '<div class="muted">–</div>'}

      <div class="hint" style="margin-top:6px">${c.importedAt ? `D&D Beyond import: ${esc(c.importedAt)} – frissítéshez importáld újra a könyvjelzővel.` : ''}
        <button class="small" data-act="partyEdit" data-pc="${esc(c.id)}">✎ Szerkesztés</button></div>
    </div>`;
  };
  const total = {}; pcs.forEach(c => COINS.forEach(k => total[k] = (total[k] || 0) + (c.currency[k] || 0)));
  return `<h2>👥 Csapat</h2>
    ${partyMembersBar(pcs)}
    <div id="partyRoll" class="le"></div>
    <h3>Passzív értékek</h3>${passives}
    <h3>Skillek</h3>${skills}
    <h3>Felszerelés</h3>
    <div class="toolbar"><input id="partySearch" placeholder="Keresés a tárgyak között (pl. kötél, potion, scroll)…" style="flex:1"><span id="partySearchInfo" class="hint"></span>
      <span>Csapat pénze: <b>${esc(coinStr(total) || '0')}</b> <span class="muted">(≈ ${esc(coinsGp(total))} gp)</span></span></div>
    <div class="pcards">${pcs.map(card).join('')}</div>`;
}

document.addEventListener('click', async e => {
  const t = e.target;
  // Csapat nézet: titkos skill-dobás egy játékosnak
  const sk = t.closest('td.sk');
  if (sk) { partyRoll([sk.dataset.pc], sk.dataset.sk, e.shiftKey ? 'adv' : e.ctrlKey ? 'dis' : ''); return; }
  const th = t.closest('th.sortable');
  if (th) { setPartySort(th.dataset.sort, /^\d+$/.test(th.dataset.col) ? +th.dataset.col : th.dataset.col); rerenderParty(); return; }
  // dobások
  const r = t.closest('.roll');
  if (r) {
    const cidEl = r.closest('[data-cid]');
    const x = cidEl ? byId(cidEl.dataset.cid) : null;
    const who = x ? nameOf(x) : '';
    const label = r.closest('[data-label]')?.dataset.label || r.dataset.label || '';
    if (r.dataset.hit) rollHit(r.dataset.hit, who, label || 'Támadás', e.shiftKey ? 'adv' : e.ctrlKey ? 'dis' : '');
    else if (r.dataset.roll) rollDmg(r.dataset.roll, who, label || 'Dobás', e.shiftKey);
    else if (r.dataset.rech) {
      const d = rnd(6), ok = d >= +r.dataset.rech;
      log(`<span class="who">${esc(who)}</span> ${esc(label || 'Recharge')}: d6 = <b>${d}</b> — ${ok ? 'feltöltődött ✓' : 'nem töltődött'}`, ok ? 'crit' : '');
    }
    return;
  }
  const chk = t.closest('[data-check],[data-save]');
  if (chk) {
    const x = byId(chk.closest('[data-cid]')?.dataset.cid); if (!x) return;
    const sv = t.closest('[data-save]');
    if (sv) rollHit(sgn(+x.c.saves[sv.dataset.save]), nameOf(x), ABIL_FULL[sv.dataset.save] + ' mentő', e.shiftKey ? 'adv' : e.ctrlKey ? 'dis' : '');
    else { const a = chk.dataset.check; rollHit(sgn(mod(x.c.abilities[a])), nameOf(x), ABIL_FULL[a] + ' próba', e.shiftKey ? 'adv' : e.ctrlKey ? 'dis' : ''); }
    return;
  }
  if (t.dataset.die) { rollDmg(t.dataset.die, '', t.dataset.die.replace('1', '')); return; }
  if (t.dataset.tab) { libTab = t.dataset.tab; renderLib(); return; }

  const el = t.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  const x = byId(el.closest('[data-cid]')?.dataset.cid);
  const libEl = el.closest('[data-lib]'), lib = libEl && S.library.find(c => c.id === libEl.dataset.lib);
  const cnt = () => Math.max(1, +(el.closest('.lrow')?.querySelector('.cnt')?.value) || 1);

  switch (act) {
    case 'next': step(1); break;
    case 'prev': step(-1); break;
    case 'rollInit': openInitMenu(); break;
    case 'init': rollInitiative(el.dataset.mode); break;
    case 'openLib': openLib(); break;
    case 'menu': openMenu(); break;
    case 'rollCustom': { const v = $('#diceInput').value.trim(); if (v) rollDmg(v, '', v); break; }
    case 'select': selected = x.cid; render(); break;
    case 'deselect': selected = null; render(); break;
    case 'dmg': case 'heal': {
      const n = Math.abs(parseInt(el.closest('.tile').querySelector('.hpin').value));
      if (n > 0) { act === 'dmg' ? damage(x, n) : heal(x, n); save(); render(); }
      break;
    }
    case 'temp': {
      const n = parseInt(el.closest('.tile').querySelector('.hpin').value);
      if (n >= 0) { x.temp = n; log(`${esc(nameOf(x))}: ${n} temp HP`); save(); render(); }
      break;
    }
    case 'toggleConc': x.conc = !x.conc; save(); render(); break;
    case 'toggleDead': x.dead = !x.dead; save(); render(); break;
    case 'toggleSide': x.side = sideOf(x) === 'enemy' ? 'ally' : 'enemy'; save(); render(); break;
    case 'toggleHidden': x.hiddenP = !x.hiddenP; save(); render(); break;
    // 'dmscreen-player' itt ablaknév (ugyanaz a lap nyílik újra), nem a CSATORNA
    case 'openPlayer': window.open('player.html','dmscreen-player', 'popup,width=1280,height=800'); break;
    case 'openCharApp': window.open('karakter.html', '_blank'); break;
    case 'portraitUpload': $('#portraitFile').click(); break;
    case 'portraitClear': setPortrait(''); $('#portraitUrl').value = ''; break;
    case 'diffInfo': openDiffInfo(); break;
    case 'openLoot': openLoot(); break;
    case 'openParty': openParty(); break;
    case 'partyRemove': setPartyMember(el.dataset.pc, false); rerenderParty(); break;
    case 'partySortReset': partySort.s = {col: null, dir: 1}; rerenderParty(); break;
    case 'libParty': setPartyMember(lib.id, !partyMembers().some(c => c.id === lib.id)); filterLib(); break;
    case 'partyGroup': partyRoll(partyMembers().map(c => c.id), el.dataset.sk, e.shiftKey ? 'adv' : e.ctrlKey ? 'dis' : ''); break;
    case 'partyEdit': {
      const pcLib = S.library.find(c => c.id === el.dataset.pc);

      try {
        const res = await importAny(JSON.parse($('#jsonIn').value));
        $('#jsonMsg').textContent = `✓ ${res.length} lény importálva: ${res.map(c => c.name).join(', ')}`;
      } catch (err) { $('#jsonMsg').textContent = '⚠ ' + err.message; }
      break;
    case 'showTemplate': $('#jsonIn').value = JSON.stringify(TEMPLATE, null, 2); break;
    case 'downloadTemplate': download('dmscreen-sablon.json', TEMPLATE); break;
    case 'importFile': fileMode = 'creatures'; $('#fileIn').click(); break;
    case 'encSave': {
      const list = S.enc.list.filter(y => y.c.kind !== 'pc').map(y => y.c);
      if (!list.length) { alert('Nincs nem-játékos lény az encounterben.'); break; }
      S.saved.push({id: uid(), name:$('#encName').value.trim() || 'Encounter ' + (S.saved.length + 1), list: structuredClone(list)});
      save(); renderLib(); break;
    }
    case 'encLoad': {
      const enc = S.saved[+el.closest('[data-enc]').dataset.enc];
      const groups = {};
      enc.list.forEach(c => (groups[c.name] = groups[c.name] || []).push(c));
      Object.values(groups).forEach(g => addToEncounter(g[0], g.length));
      log(`⚔ ${esc(enc.name)} betöltve`); closeModal(); break;
    }
    case 'encDel': if (confirm('Törlöd ezt a mentett encountert?')) { S.saved.splice(+el.closest('[data-enc]').dataset.enc, 1); save(); renderLib(); } break;

    // menü
    case 'newFight':
      S.enc.list = S.enc.list.filter(y => y.c.kind === 'pc');
      S.enc.list.forEach(y => { y.init = null; y.cond = []; y.conc = false; y.leg = 0; });
      S.enc.round = 1; S.enc.active = null; selected = null;
      log('— Új harc —', 'round'); closeModal(); save(); render(); break;
    case 'clearAll':
      if (confirm('Mindenkit eltávolítasz az encounterből?')) { S.enc = {list: [], round: 1, active: null}; selected = null; closeModal(); save(); render(); }
      break;
    case 'exportAll':
      S.settings.lastExport = localDate();
      download(`dmscreen-mentes-${localDate()}.json`, {...S, sheets: sheetList()});
      save(); render(); break;
    case 'openBackups': openBackups(); break;
    case 'backupNow':
      try { if (await addBackup(timeStamp() + '-kezi', 'kézi mentés')) log('💾 Biztonsági mentés elkészült a felhőben'); }
      catch (err) { backupWarn = 'Nem sikerült a mentés (' + (err.code || err.message) + ').'; }
      openBackups(); break;
    case 'backupRestore': {
      const id = el.closest('[data-backup]').dataset.backup;
      if (!confirm('Visszaállítod ezt a mentést? A mostani állapotról előbb automatikusan mentés készül.')) break;
      try { await restoreBackup(id); closeModal(); log('↺ Biztonsági mentés visszaállítva'); }
      catch (err) { alert('A visszaállítás nem sikerült: ' + (err.code || err.message)); }
      break;
    }
    case 'importAll': fileMode = 'all'; $('#fileIn').click(); break;
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.setting) { S.settings[t.dataset.setting] = t.checked; save(); return; }
  if (t.dataset.src) {
    const s = new Set(S.settings.sources);
    t.checked ? s.add(t.dataset.src) : s.delete(t.dataset.src);
    S.settings.sources = [...s]; save(); return;
  }
  if (t.id === 'libKind') { filterLib(); return; }
  if (t.id === 'partyAddSel') { if (t.value) { setPartyMember(t.value, true); rerenderParty(); } return; }
  const x = byId(t.closest('[data-cid]')?.dataset.cid);
  if (!x) return;
  if (t.classList.contains('init')) { x.init = t.value === '' ? null : +t.value; save(); render(); return; }
  const f = t.dataset.f;
  if (!f || f === 'notes') return;
  if (f === 'conc') x.conc = t.checked;
  else if (f === 'init') x.init = t.value === '' ? null : +t.value;
  else if (f === 'hp') { x.hp = Math.max(0, +t.value || 0); x.dead = x.hp === 0 && x.c.kind !== 'pc'; }
  else if (f === 'max') x.c.hp.max = Math.max(1, +t.value || 1);
  else if (f === 'temp') x.temp = Math.max(0, +t.value || 0);
  else if (f === 'ac') x.c.ac = +t.value || 0;
  else if (f === 'side') x.side = t.value;
  else if (f === 'hiddenP') x.hiddenP = t.checked;
  else if (f === 'pubName') x.publicName = t.value.trim();
  save(); render();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'libSearch') filterLib();
  if (t.id === 'itemQ') filterItems();
  if (t.id === 'partySearch') filterPartyItems(t.value);
  if (t.dataset.f === 'notes') { const x = byId(t.closest('[data-cid]')?.dataset.cid); if (x) { x.notes = t.value; save(); } }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Escape') { if (!$('#modal').hidden) closeModal(); else if (selected) { selected = null; render(); } return; }
  if (t.classList?.contains('hpin') && e.key === 'Enter') {
    const x = byId(t.closest('[data-cid]').dataset.cid), n = parseInt(t.value);
    if (n > 0) damage(x, n); else if (n < 0) heal(x, -n);
    if (n) { save(); render(); }
    return;
  }
  if (t.id === 'diceInput' && e.key === 'Enter') { const v = t.value.trim(); if (v) rollDmg(v, '', v); return; }
  if (t.id === 'fiveQ' && e.key === 'Enter') { fiveSearch(); return; }
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || !$('#modal').hidden) return;
  if (e.key === 'n' || e.key === 'N' || e.key === ' ') { e.preventDefault(); step(1); }
  else if (e.key === 'p' || e.key === 'P') { e.preventDefault(); step(-1); }
});

// beillesztéskor magától importál
document.addEventListener('paste', e => {
  if (e.target.id !== 'ddbPaste') return;
  const t = e.clipboardData?.getData('text');
  if (t && t.trim().startsWith('{')) { e.preventDefault(); ddbImportText(t); }
});

// ---------- indulás ----------
render();
</script>

<script src="firebase-config.js"></script>
<script type="module">
// Firebase: Google-belépés + Firestore (saját projekt; ki mit érhet el: firestore.rules)
const V = '10.12.2';
const cfg = window.FIREBASE_CONFIG;
// ?test = automata tesztek (tests/): helyi mód, a felhőhöz nem nyúl
if (!cfg || !cfg.apiKey || location.protocol === 'file:' || new URLSearchParams(location.search).has('test')) {
  window.DMApp.setAuth({status: 'unconfigured'});
} else {
  try {
    const {initializeApp} = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const A = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
    const F = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
    const app = initializeApp(cfg);
    const auth = A.getAuth(app);
    const fs = F.initializeFirestore(app, {localCache: F.persistentLocalCache({tabManager: F.persistentMultipleTabManager()})});
    const db = {
      get: async p => { const s = await F.getDoc(F.doc(fs, p)); return s.exists() ? s.data() : null; },
      list: async p => (await F.getDocs(F.collection(fs, p))).docs.map(d => ({...d.data(), id: d.id})),
      set: (p, d) => F.setDoc(F.doc(fs, p), d),
      update: (p, d) => F.updateDoc(F.doc(fs, p), d),  // mezőnként (pl. 'hp.cur'), a többi mezőhöz nem nyúl
      del: p => F.deleteDoc(F.doc(fs, p)),
      watch: (col, cb, err) => F.onSnapshot(F.collection(fs, col), s => cb(s.docs.map(d => ({...d.data(), id: d.id}))), err),
    };
    const provider = new A.GoogleAuthProvider();
    provider.setCustomParameters({prompt: 'select_account'});
    window.DMAuth = {
      async signIn() {
        try { await A.signInWithPopup(auth, provider); }
        catch (e) {
          if (e.code === 'auth/popup-blocked') return A.signInWithRedirect(auth, provider);
          if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request')
            window.DMApp.setAuth({status: 'signedOut', error: 'A belépés nem sikerült (' + e.code + ').'});
        }
      },
      signOut: () => A.signOut(auth),
      email: () => auth.currentUser?.email || '',
    };
    A.onAuthStateChanged(auth, u => window.DMApp.setAuth(u ? {status: 'signedIn', email: u.email, db} : {status: 'signedOut'}));
  } catch (e) {
    // nincs internet a legelső betöltéskor: helyi mód
    window.DMApp.setAuth({status: 'unconfigured'});
  }
}
</script>
